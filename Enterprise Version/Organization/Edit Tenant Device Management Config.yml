                      "host": "http://178.20.72.24/downloads/200MB.file",
                      "default": true
                  }
              ],
              "upload_servers": [
                  {
                      "host": "http://178.20.72.24/uploads",
                      "default": true
                  }
              ]
          },
          "ping_test": {
              "enable": true,
              "servers": [
                  "178.20.72.41",
                  "178.20.72.85"
              ]
          },
          "critical_start_time": "0001-01-01T00:00:00Z",
