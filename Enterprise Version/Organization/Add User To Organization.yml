info:
  name: Add User To Organization
  type: http
  seq: 7

http:
  method: PUT
  url: "{{base_url}}organization/user"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  body:
    type: json
    data: |-
      {
          "email": "test@gmail.com",
          "role": "support"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

