info:
  name: Delete Organization
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{base_url}}organization"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  body:
    type: json
    data: |-
      {
          "id": "691ba342c9c40ffe2b804b5b"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

