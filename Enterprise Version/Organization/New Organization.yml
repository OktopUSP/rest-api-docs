info:
  name: New Organization
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}organization?inherit=true&roles=true"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: inherit
      value: "true"
      type: query
      description: defines if the new tenant will inherit properties from the parent tenant.
    - name: roles
      value: "true"
      type: query
      description: inherit parent tenant roles
    - name: services
      value: "false"
      type: query
      description: inherit parent tenant services [WIP]
      disabled: true
    - name: scripts
      value: "false"
      type: query
      description: inherit parent tenant scripts [WIP]
      disabled: true
  body:
    type: json
    data: |-
      {
          "name": "org3"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: New Organization
    request:
      url: "{{base_url}}organization?inherit=false&roles=false"
