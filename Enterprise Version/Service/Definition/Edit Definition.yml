http:
  method: PUT
  url: "{{base_url}}service/definition"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  body:
    type: json
    data: |-
      {
          "id": "69ca80207a4e2558538ffce0",
          "name": "test-1",
          "description": "my first test",
          "tenant_id": "12345678901234567890",
          "script": "--just changin the original lua script",
          "variables": [
              {
                  "name": "A",
                  "description": "",
