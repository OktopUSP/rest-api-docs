info:
  name: Download
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url_speedtest_server}}downloads/:filename"
  params:
    - name: filename
      value: 200MB.file
      type: path
      description: the filename defines the filesize to be downloaded (200MB.file or 20MB.file)
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
