info:
  name: Passcode
  type: http
  seq: 1

http:
  method: PUT
  url: "{{base_url}}license/passcode"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  body:
    type: json
    data: |-
      {
        "Pscd": "88225378",
        "Period": 30,
        "Digits": 6,
        "Algorithm": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

