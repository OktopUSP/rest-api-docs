info:
  name: Device settings
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}insights/device/:device/settings"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: device
      value: "{{device}}"
      type: path
  body:
    type: json
    data: |-
      {
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

