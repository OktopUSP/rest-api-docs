info:
  name: Device Number Evolution
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}info/device_evolution"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Device Number Evolution
    request:
      url: "{{base_url}}info/device_evolution"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.18.0 (Ubuntu)
        - name: Date
          value: Mon, 14 Oct 2024 17:06:50 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "98"
        - name: Connection
          value: keep-alive
        - name: Vary
          value: Origin
      body:
        type: json
        data: |-
          [
              {
                  "date": "11/10/2024",
                  "total": 2
              },
              {
                  "date": "12/10/2024",
                  "total": 2
              },
              {
                  "date": "13/10/2024",
                  "total": 2
              }
          ]
