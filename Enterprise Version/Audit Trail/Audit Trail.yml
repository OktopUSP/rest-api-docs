docs: |-
  Returns a filtered, keyset-paginated list of audit trail events for the active tenant.

  ## Query parameters

  | Param | Required | Description |
  |---|---|---|
  | `sn` | yes | Device serial number to scope the trail to. |
  | `sortBy` | no | `timestamp` or `id`. Defaults to `timestamp`. |
  | `orderBy` | no | `asc` or `desc`. Defaults to `desc`. |
  | `limit` | no | Page size. Defaults to 50, max 64. |
  | `cursor` | no | Keyset cursor from the previous response's `page.nextCursor`. Omit for the first page. |
  | `resource` | no | Comma-separated list of resources to filter by. |
  | `action` | no | Comma-separated list of actions to filter by. |
  | `actorType` | no | Comma-separated list of actor types to filter by. |
  | `actorId` | no | Comma-separated list of actor ids to filter by. |
  | `startTime` / `endTime` | no | RFC3339 timestamps bounding the event range. |

  ## Response

  ```json
  {
    "items": [ /* array of trail events */ ],
    "page": {
      "nextCursor": "695d7fb8b1a0a72682c6e143",
      "total": 8,
      "pageSize": 64,
      "totalPages": 1
    }
  }
  ```

  ### `page` object

  | Field | Type | Description |
  |---|---|---|
  | `nextCursor` | string | Cursor to pass as `cursor` to fetch the next page. Empty when there are no more pages. |
  | `total` | integer | Total number of entries matching the filter across all pages. |
  | `pageSize` | integer | Effective page size applied to this query (the resolved `limit`). |
  | `totalPages` | integer | Number of pages for the current filter and page size: `ceil(total / pageSize)`. `0` when there are no matches. |

  Pagination is keyset-based on `(timestamp, streamSeq)`, so pages never skip or repeat events that share a timestamp. `totalPages` is informational for UI display; navigate forward with `nextCursor` rather than a page number.
