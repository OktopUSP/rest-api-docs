info:
  name: Audit Trail
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}audit?sn={{device}}&sortBy=timestamp&limit=64&orderBy=desc&resource&action&actorType&actorId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: sn
      value: "{{device}}"
      type: query
      description: required
    - name: sortBy
      value: timestamp
      type: query
      description: '"timestamp" or "id"; defaults to "timestamp" if none'
    - name: limit
      value: "64"
      type: query
      description: max is 64
    - name: cursor
      value: 695d7fb8b1a0a72682c6e143
      type: query
      disabled: true
    - name: orderBy
      value: desc
      type: query
      description: '"asc" or "desc"'
    - name: resource
      value: ""
      type: query
      description: list of resources to be fetched, separated by commas
    - name: action
      value: ""
      type: query
      description: list of actions to be fetched, separated by commas
    - name: actorType
      value: ""
      type: query
      description: list of actor types to be fetched, separated by commas
    - name: actorId
      value: ""
      type: query
      description: list of actor id to be fetched, separated by commas
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

