                  "protocol": "cwmp",
                  "content": "-- model:FRITZ\n-- protocol:cwmp\n\n-- Helpers\nlocal function trim(s)\n  return (tostring(s or ''):gsub('^%s+', ''):gsub('%s+$', ''))\nend\n\nlocal function split(s, sep)\n  local out = {}\n  if s == nil or s == '' then\n    return out\n  end\n  sep = sep or ','\n  local pattern = '([^' .. sep .. ']+)'\n  for part in string.gmatch(s, pattern) do\n    out[#out + 1] = trim(part)\n  end\n  return out\nend\n\nlocal function split_int(s, sep)\n  local out = {}\n  for _, item in ipairs(split(s, sep)) do\n    local n = tonumber(item)\n    if n ~= nil then\n      out[#out + 1] = math.floor(n)\n    end\n  end\n  return out\nend\n\nlocal function pd(writable, value)\n  return { writable = writable, value = value }\nend\n\nlocal function bool_val(v)\n  if v == nil then\n    return false\n  end\n  if type(v) == 'boolean' then\n    return v\n  end\n  local s = tostring(v):lower()\n  return s == '1' or s == 'true'\nend\n\nlocal function to_int(v, default)\n  local n = tonumber(v)\n  if n == nil then\n    return default\n  end\n  return math.floor(n)\nend\n\nlocal function response_param_map(response)\n  local param_map = {}\n  for _, param in ipairs((response and response.list) or {}) do\n    local name = param.name or ''\n    local last = name:match('([^.]+)$') or name\n    param_map[last] = param.value\n  end\n  return param_map\nend\n\nlocal function format_transmit_power_supported(raw)\n  if raw == nil then\n    return nil\n  end\n  local out = {}\n  for _, power in ipairs(split(raw, ',')) do\n    if power == '-1' then\n      out[#out + 1] = 'Auto'\n    else\n      out[#out + 1] = power .. '%'\n    end\n  end\n  return out\nend\n\nlocal function translate_beacon_type_to_human(value)\n  if value == '11i' then\n    return 'WPA2'\n  elseif value == 'WPAand11i' then\n    return 'WPA/WPA2'\n  elseif value == '11iandWPA3' then\n    return 'WPA2/WPA3'\n  end\n  return value\nend\n\nlocal function is_password_writable(beacon_type)\n  return not (beacon_type == 'Basic' or beacon_type == 'None')\nend\n\nlocal function parse_diagnostic_state(raw, failure_count)\n  if raw == 'Error_CannotResolveHostName' then\n    return 'Cannot resolve host name'\n  elseif raw == 'Error_MaxHopCountExceeded' then\n    return 'Max hop count exceeded'\n  elseif raw == 'Requested' or raw == 'Running' then\n    return 'In progress'\n  elseif raw == 'Complete' or raw == 'Completed' then\n    if (failure_count or 0) > 0 then\n      return 'Failure'\n    end\n    return 'Success'\n  elseif raw == 'None' then\n    return 'None'\n  end\n  return 'Unknown'\nend\n\nlocal function parse_get_ping_common(response)\n  local param_map = response_param_map(response)\n\n  local timeout = to_int(param_map['Timeout'], 5000)\n  local timeout_seconds = math.floor(timeout / 1000)\n  local repetitions = to_int(param_map['NumberOfRepetitions'], 3)\n  local block_size = to_int(param_map['DataBlockSize'], 32)\n  if block_size == 0 then\n    block_size = 32\n  end\n\n  local failure_count = to_int(param_map['FailureCount'], 0)\n  local success_count = to_int(param_map['SuccessCount'], 0)\n  local avg_rtt = to_int(param_map['AverageResponseTime'], 0)\n  local min_rtt = to_int(param_map['MinimumResponseTime'], 0)\n  local max_rtt = to_int(param_map['MaximumResponseTime'], 0)\n\n  local diagnostic = param_map['DiagnosticsState'] or ''\n\n  return {\n    interface = pd(false, param_map['Interface']),\n    timeout = pd(true, timeout_seconds),\n    host = pd(true, param_map['Host']),\n    number_of_repetitions = pd(true, repetitions),\n    data_block_size = pd(true, block_size),\n    processing = pd(false, diagnostic == 'Requested' or diagnostic == 'Request'),\n    last_result = {\n      result = parse_diagnostic_state(diagnostic, failure_count),\n      failure_count = failure_count,\n      success_count = success_count,\n      average_rtt = avg_rtt,\n      minimum_rtt = min_rtt,\n      maximum_rtt = max_rtt,\n    },\n  }\nend\n\nlocal function parse_get_ping_result_common(response)\n  local param_map = response_param_map(response)\n\n  local failure_count = to_int(param_map['FailureCount'], 0)\n  local success_count = to_int(param_map['SuccessCount'], 0)\n  local average_rtt = to_int(param_map['AverageResponseTime'], 0)\n  local minimum_rtt = to_int(param_map['MinimumResponseTime'], 0)\n  local maximum_rtt = to_int(param_map['MaximumResponseTime'], 0)\n  local diagnostic_state = param_map['DiagnosticsState'] or ''\n\n  return {\n    result = parse_diagnostic_state(diagnostic_state, failure_count),\n    failure_count = failure_count,\n    success_count = success_count,\n    average_rtt = average_rtt,\n    minimum_rtt = minimum_rtt,\n    maximum_rtt = maximum_rtt,\n  }\nend\n\nlocal function set_voice_line_common(line)\n  local values = {}\n  local line_path = line and line.path or ''\n  if line_path == '' then\n    return values\n  end\n\n  if line.username and line.username.value and line.username.value ~= '' then\n    values[line_path .. 'SIP.AuthUserName'] = line.username.value\n  end\n  if line.password and line.password.value and line.password.value ~= '' then\n    values[line_path .. 'SIP.AuthPassword'] = line.password.value\n  end\n  if line.uri and line.uri.value and line.uri.value ~= '' then\n    values[line_path .. 'SIP.URI'] = line.uri.value\n  end\n\n  return values\nend\n\nlocal function parse_get_voice_common(response)\n  local voices = {}\n  local voice_profiles = {}\n  local voice_lines = {}\n\n  for _, param in ipairs((response and response.list) or {}) do\n    local name = param.name or ''\n    if name:find('VoiceProfile%.') then\n      if name:find('%.Line%.') then\n        local profile_number, line_number, param_type = name:match('InternetGatewayDevice%.Services%.VoiceService%.1%.VoiceProfile%.(%d+)%.Line%.(%d+)%.(.+)')\n        if profile_number and line_number and param_type then\n          profile_number = tonumber(profile_number)\n          line_number = tonumber(line_number)\n          voice_lines[profile_number] = voice_lines[profile_number] or {}\n          voice_lines[profile_number][line_number] = voice_lines[profile_number][line_number] or {}\n          voice_lines[profile_number][line_number][param_type] = param.value\n        end\n      else\n        local profile_number, param_type = name:match('InternetGatewayDevice%.Services%.VoiceService%.1%.VoiceProfile%.(%d+)%.(.+)')\n        if profile_number and param_type then\n          profile_number = tonumber(profile_number)\n          voice_profiles[profile_number] = voice_profiles[profile_number] or {}\n          voice_profiles[profile_number][param_type] = param.value\n        end\n      end\n    end\n  end\n\n  for profile_num, profile_data in pairs(voice_profiles) do\n    local name = profile_data['Name']\n    if name == nil or name == '' then\n      name = 'Voice Profile ' .. tostring(profile_num)\n    end\n\n    local voice = {\n      path = 'InternetGatewayDevice.Services.VoiceService.1.VoiceProfile.' .. tostring(profile_num) .. '.',\n      name = pd(false, name),\n      proxy_server = pd(true, profile_data['SIP.ProxyServer']),\n      registrar_server = pd(true, profile_data['SIP.RegistrarServer']),\n      domain = pd(true, profile_data['SIP.UserAgentDomain']),\n      lines = {},\n    }\n\n    if voice_lines[profile_num] ~= nil then\n      for line_num, line_data in pairs(voice_lines[profile_num]) do\n        table.insert(voice.lines, {\n          path = 'InternetGatewayDevice.Services.VoiceService.1.VoiceProfile.' .. tostring(profile_num) .. '.Line.' .. tostring(line_num) .. '.',\n          status = pd(false, string.lower(tostring(line_data['Enable'] or ''))),\n          username = pd(true, line_data['SIP.AuthUserName']),\n          password = pd(true, line_data['SIP.AuthPassword']),\n          uri = pd(true, line_data['SIP.URI']),\n        })\n      end\n    end\n\n    table.insert(voices, voice)\n  end\n\n  return voices\nend\n\nlocal function set_voice_common(voice)\n  local values = {}\n  local path = voice and voice.path or ''\n\n  if path ~= '' then\n    if voice.name and voice.name.value and voice.name.value ~= '' then\n      values[path .. 'Name'] = voice.name.value\n    end\n    if voice.proxy_server and voice.proxy_server.value and voice.proxy_server.value ~= '' then\n      values[path .. 'SIP.ProxyServer'] = voice.proxy_server.value\n    end\n    if voice.registrar_server and voice.registrar_server.value and voice.registrar_server.value ~= '' then\n      values[path .. 'SIP.RegistrarServer'] = voice.registrar_server.value\n    end\n    if voice.domain and voice.domain.value and voice.domain.value ~= '' then\n      values[path .. 'SIP.UserAgentDomain'] = voice.domain.value\n    end\n  end\n\n  for _, line in ipairs((voice and voice.lines) or {}) do\n    local line_values = set_voice_line_common(line)\n    for k, v in pairs(line_values) do\n      values[k] = v\n    end\n  end\n\n  return values\nend\n\nlocal function get_ip_origin(value)\n  if value == nil or value == '' then\n    return 'PPPoE'\n  end\n  return value\nend\n\nlocal function ip_to_octets(ip)\n  if ip == nil then\n    return nil\n  end\n  local a, b, c, d = tostring(ip):match('^(%d+)%.(%d+)%.(%d+)%.(%d+)$')\n  if not a then\n    return nil\n  end\n  a, b, c, d = tonumber(a), tonumber(b), tonumber(c), tonumber(d)\n  if a > 255 or b > 255 or c > 255 or d > 255 then\n    return nil\n  end\n  return a, b, c, d\nend\n\nlocal function band(a, b)\n  local res = 0\n  local bit = 1\n  while a > 0 or b > 0 do\n    local a_bit = a % 2\n    local b_bit = b % 2\n    if a_bit == 1 and b_bit == 1 then\n      res = res + bit\n    end\n    a = math.floor(a / 2)\n    b = math.floor(b / 2)\n    bit = bit * 2\n  end\n  return res\nend\n\nlocal function is_valid_ipv4(ip)\n  return ip_to_octets(ip) ~= nil\nend\n\nlocal function is_valid_subnet_mask(mask)\n  local a, b, c, d = ip_to_octets(mask)\n  if not a then\n    return false\n  end\n  local mask_value = ((a * 256 + b) * 256 + c) * 256 + d\n  if mask_value == 0 then\n    return false\n  end\n  local inverted = 0xFFFFFFFF - mask_value + 1\n  if inverted == 0 then\n    return true\n  end\n  return band(inverted, inverted - 1) == 0\nend\n\nlocal function are_ips_in_same_subnet(ip1, ip2, mask)\n  local a1, b1, c1, d1 = ip_to_octets(ip1)\n  local a2, b2, c2, d2 = ip_to_octets(ip2)\n  local m1, m2, m3, m4 = ip_to_octets(mask)\n  if not a1 or not a2 or not m1 then\n    return false\n  end\n  return band(a1, m1) == band(a2, m1)\n    and band(b1, m2) == band(b2, m2)\n    and band(c1, m3) == band(c2, m3)\n    and band(d1, m4) == band(d2, m4)\nend\n\nlocal function typed_param(name, value, type_name)\n  return { name = name, value = value, type = type_name }\nend\n\n-- Identity / capabilities\nfunction get_vendor() return 'AVM' end\nfunction get_data_model() return 'TR-098' end\n\nfunction get_device_capabilities()\n  return {\n    Radio = true,\n    Ssid = true,\n    SiteSurvey = false,\n    SpeedTest = false,\n    Diagnostic = true,\n    Ping = true,\n    Traceroute = true,\n    Reboot = true,\n    ConnectedDevices = true,\n    Voice = true,\n    Interfaces = true,\n    Ports = true,\n    Logs = true,\n    Wan = true,\n  }\nend\n\nfunction get_device_specs()\n  return {\n    TimeTraceRoute = 3,\n    DirectResult = true,\n  }\nend\n\nfunction is_real_time() return false end\nfunction get_wan_options() return nil end\n\n-- WiFi\nfunction get_radio()\n  return {\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.2.',\n  }\nend\n\nfunction parse_radio(response)\n  local radios = {}\n  local tmp = {}\n\n  for _, param in ipairs((response and response.list) or {}) do\n    local wlan_number, param_type = (param.name or ''):match('InternetGatewayDevice%.LANDevice%.1%.WLANConfiguration%.(%d+)%.(.+)')\n    if wlan_number then\n      wlan_number = tonumber(wlan_number)\n      tmp[wlan_number] = tmp[wlan_number] or {}\n      tmp[wlan_number][param_type] = param.value\n    end\n  end\n\n  local wlan_indices = { 1, 2 }\n  for i, wlan_index in ipairs(wlan_indices) do\n    local wlan = tmp[wlan_index] or {}\n    local channel = to_int(wlan['Channel'], 0)\n    local radio_frequency = '2.4GHz'\n    if wlan_index == 2 then\n      radio_frequency = '5GHz'\n    end\n\n    radios[i] = {\n      path = 'InternetGatewayDevice.LANDevice.1.WLANConfiguration.' .. tostring(wlan_index) .. '.',\n      enable = pd(true, bool_val(wlan['RadioEnabled'])),\n      name = pd(false, radio_frequency),\n      auto_channel_enable = pd(true, bool_val(wlan['AutoChannelEnable'])),\n      channel = pd(true, channel),\n      possible_channels = pd(false, split_int(wlan['PossibleChannels'], ',')),\n      operating_frequency_band = pd(false, radio_frequency),\n      transmit_power = pd(true, wlan['TransmitPower'] and (wlan['TransmitPower'] .. '%') or nil),\n      transmit_power_supported = pd(false, format_transmit_power_supported(wlan['TransmitPowerSupported'])),\n      supported_frequency_bands = pd(false, split(radio_frequency, ',')),\n      operating_channel_bandwidth = pd(false, ''),\n      supported_operating_channel_bandwidth = pd(false, split('', ',')),\n      supported_standards = pd(false, split(wlan['Standard'], ',')),\n      operating_standards = pd(false, split(wlan['Standard'], ',')),\n    }\n  end\n\n  return radios\nend\n\nfunction set_radio(radios)\n  return nil\nend\n\nfunction get_ssid()\n  return {\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.2.',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.3.',\n  }\nend\n\nfunction parse_ssid(response)\n  local ssids = {}\n  local tmp = {}\n\n  for _, param in ipairs((response and response.list) or {}) do\n    local wlan_number, param_type = (param.name or ''):match('InternetGatewayDevice%.LANDevice%.1%.WLANConfiguration%.(%d+)%.(.+)')\n    if wlan_number then\n      wlan_number = tonumber(wlan_number)\n      tmp[wlan_number] = tmp[wlan_number] or {}\n      tmp[wlan_number][param_type] = param.value\n    end\n  end\n\n  local wlan_indices = { 1, 2, 3 }\n  for i, wlan_index in ipairs(wlan_indices) do\n    local wlan = tmp[wlan_index] or {}\n    local radio_frequency = ''\n    local ssid_type = 'Guests'\n    if wlan_index == 1 then\n      radio_frequency = ' 2.4GHz'\n      ssid_type = 'Primary'\n    elseif wlan_index == 2 then\n      radio_frequency = ' 5GHz'\n      ssid_type = 'Primary'\n    end\n\n    local beacon_type = wlan['BeaconType']\n    ssids[i] = {\n      ssid_path = 'InternetGatewayDevice.LANDevice.1.WLANConfiguration.' .. tostring(wlan_index) .. '.',\n      name = pd(false, tostring(wlan['Name'] or '') .. radio_frequency),\n      type = pd(false, ssid_type),\n      ssid = pd(true, wlan['SSID']),\n      status = pd(false, wlan['Status']),\n      enable = pd(true, bool_val(wlan['Enable'])),\n      ssid_advertisement_enabled = pd(true, bool_val(wlan['SSIDAdvertisementEnabled'])),\n      has_band_steering = pd(false, false),\n      bytes_received = pd(false, wlan['TotalBytesReceived']),\n      bytes_sent = pd(false, wlan['TotalBytesSent']),\n      mac_address = pd(false, wlan['BSSID']),\n      security = {\n        security_modes_supported = pd(false, { 'None', 'WPA2', 'WPA2/WPA3' }),\n        security_mode_enabled = pd(true, translate_beacon_type_to_human(beacon_type)),\n        password = pd(is_password_writable(beacon_type), nil),\n      },\n    }\n  end\n\n  return ssids\nend\n\nfunction set_ssid(ssids)\n  return nil\nend\n\n-- Site survey\nfunction get_site_survey_diagnostic_state() return '' end\nfunction get_site_survey_results() return nil end\nfunction parse_get_site_survey(response) return nil end\n\n-- Connected devices\nfunction get_connected_devices()\n  return {\n    'InternetGatewayDevice.LANDevice.1.Hosts.Host.',\n  }\nend\n\nfunction parse_get_connected_devices(response)\n  local connected_devices = {}\n  local tmp = {}\n\n  for _, param in ipairs((response and response.list) or {}) do\n    local device_number, param_type = (param.name or ''):match('InternetGatewayDevice%.LANDevice%.1%.Hosts%.Host%.(%d+)%.(.+)')\n    if device_number then\n      device_number = tonumber(device_number)\n      tmp[device_number] = tmp[device_number] or {}\n      tmp[device_number][param_type] = param.value\n    end\n  end\n\n  for _, dev in pairs(tmp) do\n    local iface = dev['InterfaceType'] or ''\n    local resource = {\n      mac = dev['MACAddress'],\n      ip_adress = dev['IPAddress'],\n      adress_source = dev['AddressSource'],\n      active = bool_val(dev['Active']),\n      hostname = dev['HostName'],\n    }\n    connected_devices[iface] = connected_devices[iface] or {}\n    table.insert(connected_devices[iface], resource)\n  end\n\n  return {\n    model = model,\n    hostname = sn,\n    connected_devices = connected_devices,\n  }\nend\n\n-- Speedtest unsupported\nfunction set_speed_test(speed) return nil end\nfunction get_speed_test_result(speed_test_type) return nil end\nfunction parse_get_speed_test_result(speed_test_type, response) return {}, nil end\nfunction get_download_diagnostic_state() return '' end\nfunction get_upload_diagnostic_state() return '' end\n\n-- Statistics unsupported\nfunction get_statistics() return nil end\nfunction parse_get_statistics(response) return nil end\n\n-- Interfaces / Ports (TR-098)\nfunction get_interface_wan()\n  return {\n    'InternetGatewayDevice.WANDevice.',\n  }\nend\n\nfunction parse_get_interface_wan(response)\n  local ports_wan = {}\n  local ports_wan_tmp = {}\n\n  for _, param in ipairs((response and response.list) or {}) do\n    local name = param.name or ''\n    local wan_dev, wan_conn_dev, conn_type, conn_idx, parameter =\n      name:match('^InternetGatewayDevice%.WANDevice%.(%d+)%.WANConnectionDevice%.(%d+)%.(WANIPConnection|WANPPPConnection)%.(%d+)%.(.+)$')\n    if wan_dev and wan_conn_dev and conn_type and conn_idx and parameter then\n      local wan_path = 'InternetGatewayDevice.WANDevice.' .. wan_dev\n        .. '.WANConnectionDevice.' .. wan_conn_dev\n        .. '.' .. conn_type .. '.' .. conn_idx .. '.'\n      ports_wan_tmp[wan_path] = ports_wan_tmp[wan_path] or {}\n      ports_wan_tmp[wan_path][parameter] = param.value\n    end\n  end\n\n  local idx = 0\n  for path, param in pairs(ports_wan_tmp) do\n    local conn_name = param['Name']\n    if conn_name == nil or conn_name == '' then\n      conn_name = 'Connection ' .. tostring(idx)\n    end\n\n    ports_wan[path] = {\n      path = path,\n      enable = pd(true, bool_val(param['Enable'])),\n      alias = pd(false, 'Logical WAN Connection ' .. tostring(idx)),\n      upstream = pd(false, true),\n      mac_address = pd(false, param['MACAddress']),\n      status = pd(false, param['ConnectionStatus']),\n      tx = pd(false, to_int(param['Stats.EthernetBytesSent'], 0)),\n      rx = pd(false, to_int(param['Stats.EthernetBytesReceived'], 0)),\n      ip = {\n        {\n          path = path,\n          enable = pd(true, tostring(param['Enable'] or '') == '1'),\n          name = pd(false, conn_name),\n          ipv4 = {\n            enable = pd(false, true),\n            origin = pd(false, param['AddressingType']),\n            ip_address = pd(false, param['ExternalIPAddress']),\n            gateway = pd(false, param['DefaultGateway']),\n            dns_servers = {\n              dns_servers = pd(false, param['DNSServers']),\n            },\n          },\n          pppoe = {\n            path = (get_ip_origin(param['AddressingType']) == 'PPPoE') and '-' or '',\n            connection_status = pd(false, param['ConnectionStatus']),\n            username = pd(true, param['Username']),\n            password = pd(true, param['Password']),\n          },\n          vlan = {},\n          ipv6 = {},\n        },\n      },\n    }\n    idx = idx + 1\n  end\n\n  return ports_wan\nend\n\nfunction get_interface_lan()\n  return {\n    'InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.1.X_AVM-DE_EthPort.',\n    'InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.1.MACAddress',\n  }\nend\n\nfunction parse_get_interface_lan(response)\n  local ports_lan = {}\n  local ports_lan_tmp = {}\n  local mac_address = ''\n\n  for _, param in ipairs((response and response.list) or {}) do\n    local name = param.name or ''\n    local lan_number, param_type = name:match('InternetGatewayDevice%.LANDevice%.1%.LANEthernetInterfaceConfig%.1%.X_AVM%-DE_EthPort%.(%d+)%.(.+)')\n    if lan_number then\n      lan_number = tonumber(lan_number)\n      ports_lan_tmp[lan_number] = ports_lan_tmp[lan_number] or {}\n      ports_lan_tmp[lan_number][param_type] = param.value\n    elseif name == 'InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.1.MACAddress' then\n      mac_address = param.value or ''\n    end\n  end\n\n  for lan_number, port in pairs(ports_lan_tmp) do\n    local key = port['Name'] or ('LAN ' .. tostring(lan_number))\n    ports_lan[key] = {\n      path = 'InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.1.X_AVM-DE_EthPort.' .. tostring(lan_number) .. '.',\n      enable = pd(false, true),\n      alias = pd(false, 'LAN ' .. tostring(lan_number)),\n      upstream = pd(false, false),\n      mac_address = pd(false, mac_address),\n      status = pd(false, port['Linkstate']),\n    }\n  end\n\n  return ports_lan\nend\n\nfunction get_port() return nil end\nfunction parse_get_port(response) return nil end\n\nfunction set_port(ports)\n  local parameters_to_set = {}\n\n  for port_name, port in pairs(ports or {}) do\n    local path = port.path or ''\n\n    if not port.ip or #port.ip == 0 then\n      return nil, 'error setting port, IP is not set for port ' .. tostring(port_name)\n    end\n\n    for _, ip in ipairs(port.ip) do\n      if ip.enable and ip.enable.value ~= nil then\n        table.insert(parameters_to_set, typed_param(path .. 'Enable', ip.enable.value, 'boolean'))\n      end\n\n      if ip.name and ip.name.value ~= nil then\n        table.insert(parameters_to_set, typed_param(path .. 'Name', ip.name.value, 'string'))\n      end\n\n      if ip.ipv4 and ip.ipv4.ip_address and ip.ipv4.ip_address.value ~= nil then\n        table.insert(parameters_to_set, typed_param(path .. 'ExternalIPAddress', ip.ipv4.ip_address.value, 'string'))\n      end\n\n      if ip.ipv4 and ip.ipv4.dns_servers and ip.ipv4.dns_servers.dns_servers and ip.ipv4.dns_servers.dns_servers.value ~= nil then\n        table.insert(parameters_to_set, typed_param(path .. 'DNSServers', ip.ipv4.dns_servers.dns_servers.value, 'string'))\n      end\n\n      if ip.ipv4 and ip.ipv4.subnet_mask and ip.ipv4.subnet_mask.value ~= nil then\n        table.insert(parameters_to_set, typed_param(path .. 'SubnetMask', ip.ipv4.subnet_mask.value, 'string'))\n      end\n\n      if ip.ipv4 and ip.ipv4.gateway and ip.ipv4.gateway.value ~= nil then\n        table.insert(parameters_to_set, typed_param(path .. 'DefaultGateway', ip.ipv4.gateway.value, 'string'))\n      end\n\n      if ip.pppoe and ip.pppoe.username and ip.pppoe.username.value ~= nil then\n        table.insert(parameters_to_set, typed_param(path .. 'Username', ip.pppoe.username.value, 'string'))\n      end\n\n      if ip.pppoe and ip.pppoe.password and ip.pppoe.password.value ~= nil then\n        table.insert(parameters_to_set, typed_param(path .. 'Password', ip.pppoe.password.value, 'string'))\n      end\n    end\n  end\n\n  if #parameters_to_set == 0 then\n    return nil, 'error setting port, no parameters to set'\n  end\n\n  return parameters_to_set, nil\nend\n\nfunction add_port(port)\n  local parameters_to_set = {}\n  local new_port = port and port.ip and port.ip[1]\n  if not new_port then\n    return nil, 'error adding port, IP is not set'\n  end\n\n  local path = new_port.path or ''\n  local addressing_type = new_port.ipv4 and new_port.ipv4.origin and new_port.ipv4.origin.value or nil\n\n  if addressing_type == 'PPPoE' then\n    table.insert(parameters_to_set, typed_param(path .. 'Username', new_port.pppoe.username.value, 'string'))\n    table.insert(parameters_to_set, typed_param(path .. 'Password', new_port.pppoe.password.value, 'string'))\n\n  elseif addressing_type == 'DHCP' then\n    table.insert(parameters_to_set, typed_param(path .. 'AddressingType', 'DHCP', 'string'))\n\n  elseif addressing_type == 'Static' then\n    table.insert(parameters_to_set, typed_param(path .. 'AddressingType', 'Static', 'string'))\n\n    local ip_address = new_port.ipv4 and new_port.ipv4.ip_address and new_port.ipv4.ip_address.value or ''\n    if ip_address == '' or not is_valid_ipv4(ip_address) then\n      return nil, 'error adding port, IP address is not valid'\n    end\n    table.insert(parameters_to_set, typed_param(path .. 'ExternalIPAddress', ip_address, 'string'))\n\n    local subnet_mask = new_port.ipv4 and new_port.ipv4.subnet_mask and new_port.ipv4.subnet_mask.value or ''\n    if subnet_mask == '' or not is_valid_subnet_mask(subnet_mask) then\n      return nil, 'error adding port, subnet mask is not valid'\n    end\n    table.insert(parameters_to_set, typed_param(path .. 'SubnetMask', subnet_mask, 'string'))\n\n    local gateway = new_port.ipv4 and new_port.ipv4.gateway and new_port.ipv4.gateway.value or ''\n    if gateway ~= '' and is_valid_ipv4(gateway) then\n      table.insert(parameters_to_set, typed_param(path .. 'DefaultGateway', gateway, 'string'))\n    end\n\n    if gateway == ip_address then\n      return nil, 'error adding port, gateway cannot be the same as IP address'\n    end\n    if gateway ~= '' and not are_ips_in_same_subnet(gateway, ip_address, subnet_mask) then\n      return nil, 'error adding port, gateway is not in the same subnet as IP address'\n    end\n\n    local dns_servers = ''\n    if new_port.ipv4 and new_port.ipv4.dns_servers and new_port.ipv4.dns_servers.dns_servers then\n      dns_servers = new_port.ipv4.dns_servers.dns_servers.value or ''\n    end\n    if dns_servers ~= '' then\n      table.insert(parameters_to_set, typed_param(path .. 'DNSServers', dns_servers, 'string'))\n    end\n\n  else\n    return nil, 'error adding port, unsupported addressing type: ' .. tostring(addressing_type)\n  end\n\n  return parameters_to_set, nil\nend\n\n-- Ping\nfunction get_ping()\n  return {\n    'InternetGatewayDevice.IPPingDiagnostics.Interface',\n    'InternetGatewayDevice.IPPingDiagnostics.Timeout',\n    'InternetGatewayDevice.IPPingDiagnostics.Host',\n    'InternetGatewayDevice.IPPingDiagnostics.NumberOfRepetitions',\n    'InternetGatewayDevice.IPPingDiagnostics.DataBlockSize',\n    'InternetGatewayDevice.IPPingDiagnostics.FailureCount',\n    'InternetGatewayDevice.IPPingDiagnostics.SuccessCount',\n    'InternetGatewayDevice.IPPingDiagnostics.AverageResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.MinimumResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.MaximumResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.DiagnosticsState',\n  }\nend\n\nfunction parse_get_ping(response)\n  return parse_get_ping_common(response)\nend\n\nfunction get_ping_diagnostic_state()\n  return 'InternetGatewayDevice.IPPingDiagnostics.DiagnosticsState'\nend\n\nfunction set_ping(ping)\n  local data_block = ping and ping.data_block_size and ping.data_block_size.value or nil\n  if data_block == nil or data_block == 0 then\n    data_block = 32\n  end\n\n  return {\n    ['InternetGatewayDevice.IPPingDiagnostics.Interface'] = ping.interface.value,\n    ['InternetGatewayDevice.IPPingDiagnostics.Timeout'] = (ping.timeout.value or 0) * 1000,\n    ['InternetGatewayDevice.IPPingDiagnostics.Host'] = ping.host.value,\n    ['InternetGatewayDevice.IPPingDiagnostics.NumberOfRepetitions'] = ping.number_of_repetitions.value,\n    ['InternetGatewayDevice.IPPingDiagnostics.DiagnosticsState'] = 'Requested',\n    ['InternetGatewayDevice.IPPingDiagnostics.DataBlockSize'] = data_block,\n  }\nend\n\nfunction get_ping_result()\n  return {\n    'InternetGatewayDevice.IPPingDiagnostics.FailureCount',\n    'InternetGatewayDevice.IPPingDiagnostics.SuccessCount',\n    'InternetGatewayDevice.IPPingDiagnostics.AverageResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.MinimumResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.MaximumResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.DiagnosticsState',\n  }\nend\n\nfunction parse_get_ping_result(response)\n  return parse_get_ping_result_common(response)\nend\n\n-- Traceroute (AVM paths)\nfunction get_traceroute()\n  return {\n    'InternetGatewayDevice.X_AVM-DE_DiagnosticTools.TraceRouteDiagnostics.Timeout',\n    'InternetGatewayDevice.X_AVM-DE_DiagnosticTools.TraceRouteDiagnostics.Host',\n    'InternetGatewayDevice.X_AVM-DE_DiagnosticTools.TraceRouteDiagnostics.NumberOfTries',\n    'InternetGatewayDevice.X_AVM-DE_DiagnosticTools.TraceRouteDiagnostics.MaxHopCount',\n  }\nend\n\nfunction parse_get_traceroute(response)\n  local list = response and response.list or {}\n  if #list < 4 then\n    return nil\n  end\n\n  local timeout = to_int(list[1].value, 0)\n  local number_of_tries = to_int(list[3].value, 0)\n  local max_hop_count = to_int(list[4].value, 0)\n\n  return {\n    timeout = pd(true, timeout),\n    host = pd(true, list[2].value),\n    number_of_tries = pd(true, number_of_tries),\n    max_hop_count = pd(true, max_hop_count),\n  }\nend\n\nfunction get_traceroute_diagnostic_state()\n  return 'InternetGatewayDevice.X_AVM-DE_DiagnosticTools.TraceRouteDiagnostics.DiagnosticsState'\nend\n\nfunction set_traceroute(traceroute)\n  return {\n    ['InternetGatewayDevice.X_AVM-DE_DiagnosticTools.TraceRouteDiagnostics.Timeout'] = traceroute.timeout.value,\n    ['InternetGatewayDevice.X_AVM-DE_DiagnosticTools.TraceRouteDiagnostics.Host'] = traceroute.host.value,\n    ['InternetGatewayDevice.X_AVM-DE_DiagnosticTools.TraceRouteDiagnostics.NumberOfTries'] = traceroute.number_of_tries.value,\n    ['InternetGatewayDevice.X_AVM-DE_DiagnosticTools.TraceRouteDiagnostics.MaxHopCount'] = traceroute.max_hop_count.value,\n    ['InternetGatewayDevice.X_AVM-DE_DiagnosticTools.TraceRouteDiagnostics.DiagnosticsState'] = 'Requested',\n  }\nend\n\nfunction get_traceroute_result_number_of_hops()\n  return ''\nend\n\nfunction get_traceroute_result(hop)\n  return {\n    'InternetGatewayDevice.X_AVM-DE_DiagnosticTools.TraceRouteDiagnostics.DiagnosticsState',\n    'InternetGatewayDevice.X_AVM-DE_DiagnosticTools.TraceRouteDiagnostics.Result',\n  }\nend\n\nfunction parse_get_traceroute_result(response)\n  local list = response and response.list or {}\n  if #list < 2 then\n    return {}\n  end\n  return {\n    result = parse_diagnostic_state(list[1].value or '', 0),\n    raw_result = list[2].value,\n  }\nend\n\n-- Cellular unsupported\nfunction get_cellular() return nil end\nfunction parse_get_cellular(response) return '[]' end\nfunction set_cellular(cellular) return nil end\n\n-- Hardware info / PON unsupported\nfunction get_hwinfo() return nil end\nfunction parse_get_hwinfo(response) return {} end\nfunction get_pon() return nil end\nfunction parse_get_pon(response) return {} end\n\n-- Voice\nfunction get_voice()\n  return {\n    'InternetGatewayDevice.Services.VoiceService.',\n  }\nend\n\nfunction parse_get_voice(response)\n  return parse_get_voice_common(response)\nend\n\nfunction add_voice(voice) return nil, nil end\n\nfunction set_voice(voice)\n  return set_voice_common(voice), nil\nend\n\nfunction add_line(line) return nil, nil end\n\nfunction set_line(line)\n  return set_voice_line_common(line), nil\nend\n\n-- Bridge unsupported\nfunction set_bridge(bridges) return nil end\nfunction get_bridge() return nil end\nfunction parse_get_bridge(response) return nil end\n\n-- xDSL unsupported\nfunction get_xdsl() return nil end\nfunction parse_xdsl(response) return nil end\n"
              },
              {
                  "name": "LN14",
                  "model": "LN14",
                  "protocol": "cwmp",
                  "content": "-- model:LN14\n-- protocol:cwmp\n\n-- Helpers\nlocal function trim(s)\n  return (s:gsub('^%s+', ''):gsub('%s+$', ''))\nend\n\nlocal function split(s, sep)\n  local t = {}\n  if s == nil or s == '' then\n    return t\n  end\n  sep = sep or ','\n  local pattern = '([^' .. sep .. ']+)'\n  for part in string.gmatch(s, pattern) do\n    t[#t+1] = trim(part)\n  end\n  return t\nend\n\nlocal function split_int(s, sep)\n  local out = {}\n  for _, v in ipairs(split(s, sep)) do\n    local n = tonumber(v)\n    if n ~= nil then\n      out[#out+1] = n\n    end\n  end\n  return out\nend\n\nlocal function trim_prefix(value, prefix)\n  if value == nil then\n    return nil\n  end\n  if value:sub(1, #prefix) == prefix then\n    return value:sub(#prefix + 1)\n  end\n  return value\nend\n\nlocal function trim_suffix(value, suffix)\n  if value == nil then\n    return nil\n  end\n  if value:sub(-#suffix) == suffix then\n    return value:sub(1, #value - #suffix)\n  end\n  return value\nend\n\nlocal function bool_val(v)\n  if v == nil then\n    return false\n  end\n  if type(v) == 'boolean' then\n    return v\n  end\n  local s = tostring(v):lower()\n  if s == '1' or s == 'true' then\n    return true\n  end\n  if s == '0' or s == 'false' then\n    return false\n  end\n  return false\nend\n\nlocal function to_int(v, default)\n  local n = tonumber(v)\n  if n == nil then\n    return default\n  end\n  return math.floor(n)\nend\n\nlocal function to_uint64(v)\n  local n = tonumber(v)\n  if n == nil or n < 0 then\n    return 0\n  end\n  return math.floor(n)\nend\n\nlocal function pd(writable, value)\n  return { writable = writable, value = value }\nend\n\nlocal function response_param_map(response)\n  local param_map = {}\n  local list = response and response.list or {}\n  for _, param in ipairs(list) do\n    local name = param.name or ''\n    local value = param.value\n    local last = name:match('([^.]+)$') or name\n    param_map[last] = value\n  end\n  return param_map\nend\n\nlocal function format_transmit_power_supported(raw)\n  if raw == nil then\n    return nil\n  end\n  local out = {}\n  for _, power in ipairs(split(raw, ',')) do\n    if power == '-1' then\n      out[#out+1] = 'Auto'\n    else\n      out[#out+1] = power .. '%'\n    end\n  end\n  return out\nend\n\nlocal function translate_beacon_type_to_human(value)\n  if value == '11i' then\n    return 'WPA2'\n  elseif value == 'WPAand11i' then\n    return 'WPA/WPA2'\n  elseif value == '11iandWPA3' then\n    return 'WPA2/WPA3'\n  end\n  return value\nend\n\nlocal function translate_beacon_type_to_cwmp(value)\n  if value == 'WPA2' then\n    return '11i'\n  elseif value == 'WPA/WPA2' then\n    return 'WPAand11i'\n  elseif value == 'WPA2/WPA3' then\n    return '11iandWPA3'\n  end\n  return value\nend\n\nlocal function is_password_writable(beacon_type)\n  return not (beacon_type == 'Basic' or beacon_type == 'None')\nend\n\nlocal function duration_string(seconds)\n  if seconds == nil then\n    return ''\n  end\n  local total = math.floor(seconds)\n  if total < 60 then\n    return string.format('%ds', total)\n  end\n  local mins = math.floor(total / 60)\n  local secs = total - mins * 60\n  if mins < 60 then\n    return string.format('%dm%ds', mins, secs)\n  end\n  local hours = math.floor(mins / 60)\n  mins = mins - hours * 60\n  return string.format('%dh%dm%ds', hours, mins, secs)\nend\n\nlocal function human_readable_bits(bits)\n  local sizes = { 'bits p/s', 'Kbps', 'Mbps', 'Gbps', 'Tbps', 'Pbps', 'Ebps' }\n  local value = bits\n  local i = 1\n  while value >= 1000 and i < #sizes do\n    value = value / 1000\n    i = i + 1\n  end\n  return string.format('%.2f%s', value, sizes[i])\nend\n\nlocal function parse_iso_time(raw)\n  if raw == nil then\n    return nil\n  end\n  if raw:sub(-1) == 'Z' then\n    raw = raw:sub(1, -2)\n  end\n  local y, mo, d, h, mi, s = raw:match('^(%d+)%-(%d+)%-(%d+)T(%d+):(%d+):(%d+)')\n  if not y then\n    return nil\n  end\n  return os.time({ year = tonumber(y), month = tonumber(mo), day = tonumber(d), hour = tonumber(h), min = tonumber(mi), sec = tonumber(s) })\nend\n\nlocal function get_ip_origin(value)\n  if value == nil or value == '' then\n    return 'PPPoE'\n  end\n  return value\nend\n\nlocal function ip_attribute_is_writable(attribute)\n  return get_ip_origin(attribute) == 'Static'\nend\n\nlocal function parse_diagnostic_state(raw, failure_count)\n  if raw == 'Error_CannotResolveHostName' then\n    return 'Cannot resolve host name'\n  elseif raw == 'Error_MaxHopCountExceeded' then\n    return 'Max hop count exceeded'\n  elseif raw == 'Requested' or raw == 'Running' then\n    return 'In progress'\n  elseif raw == 'Complete' or raw == 'Completed' then\n    if failure_count > 0 then\n      return 'Failure'\n    end\n    return 'Success'\n  elseif raw == 'None' then\n    return 'None'\n  end\n  return 'Unknown'\nend\n\nlocal function ip_to_octets(ip)\n  if ip == nil then\n    return nil\n  end\n  local a, b, c, d = ip:match('^(%d+)%.(%d+)%.(%d+)%.(%d+)$')\n  if not a then\n    return nil\n  end\n  a, b, c, d = tonumber(a), tonumber(b), tonumber(c), tonumber(d)\n  if a > 255 or b > 255 or c > 255 or d > 255 then\n    return nil\n  end\n  return a, b, c, d\nend\n\nlocal function band(a, b)\n  local res = 0\n  local bit = 1\n  while a > 0 or b > 0 do\n    local a_bit = a % 2\n    local b_bit = b % 2\n    if a_bit == 1 and b_bit == 1 then\n      res = res + bit\n    end\n    a = math.floor(a / 2)\n    b = math.floor(b / 2)\n    bit = bit * 2\n  end\n  return res\nend\n\nlocal function is_valid_ipv4(ip)\n  return ip_to_octets(ip) ~= nil\nend\n\nlocal function is_valid_subnet_mask(mask)\n  local a, b, c, d = ip_to_octets(mask)\n  if not a then\n    return false\n  end\n  local mask_value = ((a * 256 + b) * 256 + c) * 256 + d\n  if mask_value == 0 then\n    return false\n  end\n  local inverted = 0xFFFFFFFF - mask_value + 1\n  if inverted == 0 then\n    return true\n  end\n  return band(inverted, inverted - 1) == 0\nend\n\nlocal function are_ips_in_same_subnet(ip1, ip2, mask)\n  local a1, b1, c1, d1 = ip_to_octets(ip1)\n  local a2, b2, c2, d2 = ip_to_octets(ip2)\n  local m1, m2, m3, m4 = ip_to_octets(mask)\n  if not a1 or not a2 or not m1 then\n    return false\n  end\n  return band(a1, m1) == band(a2, m1)\n    and band(b1, m2) == band(b2, m2)\n    and band(c1, m3) == band(c2, m3)\n    and band(d1, m4) == band(d2, m4)\nend\n\nlocal function wan_stats(ip_data)\n  return {\n    bytes_sent = to_uint64(ip_data['Stats.EthernetBytesSent']),\n    bytes_received = to_uint64(ip_data['Stats.EthernetBytesReceived']),\n    packets_sent = to_uint64(ip_data['Stats.EthernetPacketsSent']),\n    packets_received = to_uint64(ip_data['Stats.EthernetPacketsReceived']),\n    errors_sent = to_uint64(ip_data['Stats.EthernetErrorsSent']),\n    errors_received = to_uint64(ip_data['Stats.EthernetErrorsReceived']),\n    discard_packets_sent = to_uint64(ip_data['Stats.EthernetDiscardPacketsSent']),\n    discard_packets_received = to_uint64(ip_data['Stats.EthernetDiscardPacketsReceived']),\n    unicast_packets_sent = to_uint64(ip_data['Stats.EthernetUnicastPacketsSent']),\n    unicast_packets_received = to_uint64(ip_data['Stats.EthernetUnicastPacketsReceived']),\n    multicast_packets_sent = to_uint64(ip_data['Stats.EthernetMulticastPacketsSent']),\n    multicast_packets_received = to_uint64(ip_data['Stats.EthernetMulticastPacketsReceived']),\n    broadcast_packets_sent = to_uint64(ip_data['Stats.EthernetBroadcastPacketsSent']),\n    broadcast_packets_received = to_uint64(ip_data['Stats.EthernetBroadcastPacketsReceived']),\n    unknown_packets_received = to_uint64(ip_data['Stats.EthernetUnknownProtoPacketsReceived']),\n  }\nend\n\n-- Model identity and capabilities\nfunction get_vendor() return 'LinkSys' end\nfunction get_data_model() return 'TR-181' end\nfunction get_device_specs() return { TimeTraceRoute = 3 } end\nfunction get_device_capabilities()\n  return {\n    Radio = true,\n    Ssid = true,\n    SiteSurvey = true,\n    SpeedTest = true,\n    DownloadSpeedTest = true,\n    UploadSpeedTest = false,\n    Diagnostic = true,\n    Ping = true,\n    Traceroute = true,\n    Reboot = true,\n    ConnectedDevices = true,\n  }\nend\nfunction is_real_time() return false end\n\nlocal function format_transmit_power(raw)\n  if raw == nil then\n    return nil\n  end\n  if raw == '-1' then\n    return 'Auto'\n  end\n  return raw .. '%'\nend\n\n-- WiFi Radio\nfunction get_radio()\n  return { 'Device.WiFi.Radio.' }\nend\n\nfunction parse_radio(response)\n  local radios = {}\n  local ports_wlan_tmp = {}\n\n  for _, param in ipairs(response.list or {}) do\n    local radio_number, param_type = string.match(param.name or '', 'Device%.WiFi%.Radio%.(%d+)%.(.+)')\n    if radio_number then\n      radio_number = tonumber(radio_number)\n      ports_wlan_tmp[radio_number] = ports_wlan_tmp[radio_number] or {}\n      ports_wlan_tmp[radio_number][param_type] = param.value\n    end\n  end\n\n  for radio_number, params in pairs(ports_wlan_tmp) do\n    local channel = to_int(params['Channel'], 0)\n    local current_bw = params['CurrentOperatingChannelBandwidth']\n    table.insert(radios, {\n      path = string.format('Device.WiFi.Radio.%d.', radio_number),\n      enable = pd(true, bool_val(params['Enable'])),\n      name = pd(true, params['Name']),\n      auto_channel_enable = pd(true, bool_val(params['AutoChannelEnable'])),\n      channel = pd(true, channel),\n      possible_channels = pd(true, split_int(params['PossibleChannels'], ',')),\n      operating_channel_bandwidth = pd(false, current_bw),\n      supported_operating_channel_bandwidth = pd(false, current_bw and { current_bw } or nil),\n      operating_frequency_band = pd(false, params['OperatingFrequencyBand']),\n      supported_frequency_bands = pd(false, split(params['SupportedFrequencyBands'], ',')),\n      transmit_power = pd(true, format_transmit_power(params['TransmitPower'])),\n      transmit_power_supported = pd(true, format_transmit_power_supported(params['TransmitPowerSupported'])),\n      operating_standards = pd(true, split(params['OperatingStandards'], ',')),\n      supported_standards = pd(true, split(params['SupportedStandards'], ',')),\n    })\n  end\n\n  return radios\nend\n\nfunction set_radio(radios)\n  local values = {}\n  for _, r in ipairs(radios or {}) do\n    local path = r.path or ''\n\n    if r.enable and r.enable.value ~= nil then\n      values[#values + 1] = { name = path .. 'Enable', value = r.enable.value, type = 'boolean' }\n    end\n    if r.auto_channel_enable and r.auto_channel_enable.value ~= nil then\n      values[#values + 1] = { name = path .. 'AutoChannelEnable', value = r.auto_channel_enable.value, type = 'boolean' }\n    end\n    if r.channel and r.channel.value ~= nil then\n      values[#values + 1] = { name = path .. 'Channel', value = tostring(r.channel.value), type = 'unsignedint' }\n    end\n    if r.transmit_power and r.transmit_power.value ~= nil then\n      if r.transmit_power.value == 'Auto' then\n        values[#values + 1] = { name = path .. 'TransmitPower', value = -1, type = 'int' }\n      else\n        local tx = to_int(trim_suffix(r.transmit_power.value, '%'), 0)\n        values[#values + 1] = { name = path .. 'TransmitPower', value = tx, type = 'int' }\n      end\n    end\n  end\n  return values\nend\n\n-- WiFi SSID\nfunction get_ssid()\n  return {\n    'Device.WiFi.SSID.',\n    'Device.WiFi.AccessPoint.',\n    'Device.WiFi.Radio.',\n  }\nend\n\nfunction parse_ssid(response)\n  local ssids = {}\n  local ssids_tmp = {}\n  local aps_tmp = {}\n  local radio_frequency_band = {}\n\n  for _, param in ipairs(response.list or {}) do\n    local name = param.name or ''\n\n    if string.find(name, '^Device%.WiFi%.AccessPoint%.') then\n      local aps_number, param_type = string.match(name, 'Device%.WiFi%.AccessPoint%.(%d+)%.(.+)')\n      if aps_number then\n        aps_number = tonumber(aps_number)\n        aps_tmp[aps_number] = aps_tmp[aps_number] or {}\n        aps_tmp[aps_number][param_type] = param.value\n      end\n    elseif string.find(name, '^Device%.WiFi%.Radio%.') and string.find(name, 'OperatingFrequencyBand') then\n      radio_frequency_band[name] = param.value\n    elseif string.find(name, '^Device%.WiFi%.SSID%.') then\n      local ssid_number, param_type = string.match(name, 'Device%.WiFi%.SSID%.(%d+)%.(.+)')\n      if ssid_number then\n        ssid_number = tonumber(ssid_number)\n        ssids_tmp[ssid_number] = ssids_tmp[ssid_number] or {}\n        ssids_tmp[ssid_number][param_type] = param.value\n      end\n    end\n  end\n\n  for ssid_number, params in pairs(ssids_tmp) do\n    local ssid_type = 'Primary'\n    if ssid_number > 3 then\n      ssid_type = 'Guests'\n    end\n\n    local lower = params['LowerLayers']\n    local band = lower and radio_frequency_band[lower .. '.OperatingFrequencyBand'] or nil\n    local name = params['Name']\n    local composed_name = nil\n    if name and band then\n      composed_name = name .. '_' .. band\n    else\n      composed_name = name\n    end\n\n    table.insert(ssids, {\n      type = pd(false, ssid_type),\n      ssid_path = string.format('Device.WiFi.SSID.%d.', ssid_number),\n      enable = pd(true, bool_val(params['Enable'])),\n      name = pd(true, composed_name),\n      mac_address = pd(false, params['MACAddress']),\n      ssid = pd(true, params['SSID']),\n      status = pd(false, params['Status']),\n      bytes_sent = pd(false, params['Stats.BytesSent']),\n      bytes_received = pd(false, params['Stats.BytesReceived']),\n      associated_radio = lower,\n      has_band_steering = pd(false, false),\n      security = {},\n    })\n  end\n\n  for aps_number, params in pairs(aps_tmp) do\n    local aps_path = string.format('Device.WiFi.AccessPoint.%d.', aps_number)\n    local ssid_ref = params['SSIDReference']\n    if ssid_ref then\n      for i, ssid in ipairs(ssids) do\n        if ssid.ssid_path == (ssid_ref .. '.') then\n          ssids[i].ap_path = aps_path\n          ssids[i].ap_isolation = pd(true, bool_val(params['IsolationEnable']))\n          ssids[i].ssid_advertisement_enabled = pd(true, bool_val(params['SSIDAdvertisementEnabled']))\n          ssids[i].security = {\n            path = string.format('%sSecurity.', aps_path),\n            security_modes_supported = pd(false, split(params['Security.ModesSupported'], ',')),\n            security_mode_enabled = pd(true, params['Security.ModeEnabled']),\n            password = pd(true, ''),\n          }\n        end\n      end\n    end\n  end\n\n  return ssids\nend\n\nfunction set_ssid(ssids)\n  local values = {}\n  for _, s in ipairs(ssids or {}) do\n    local ssid_path = s.ssid_path or ''\n    local ap_path = s.ap_path or ''\n    local sec_path = (s.security and s.security.path) or ''\n\n    if s.enable and s.enable.value ~= nil then\n      values[ssid_path .. 'Enable'] = s.enable.value\n    end\n    if s.ssid and s.ssid.value ~= nil then\n      values[ssid_path .. 'SSID'] = s.ssid.value\n    end\n    if s.ssid_advertisement_enabled and s.ssid_advertisement_enabled.value ~= nil then\n      values[ap_path .. 'SSIDAdvertisementEnabled'] = s.ssid_advertisement_enabled.value\n    end\n    if s.ap_isolation and s.ap_isolation.value ~= nil then\n      values[ap_path .. 'IsolationEnable'] = s.ap_isolation.value\n    end\n    if s.security and s.security.security_mode_enabled and s.security.security_mode_enabled.value ~= nil then\n      values[sec_path .. 'ModeEnabled'] = s.security.security_mode_enabled.value\n    end\n    if s.security and s.security.password and s.security.password.value ~= nil and s.security.password.value ~= '' then\n      values[sec_path .. 'KeyPassphrase'] = s.security.password.value\n    end\n  end\n  return values\nend\n\n-- Site Survey\nfunction get_site_survey_diagnostic_state()\n  return 'Device.WiFi.NeighboringWiFiDiagnostic.DiagnosticsState'\nend\n\nfunction get_site_survey_results()\n  return { 'Device.WiFi.NeighboringWiFiDiagnostic.Result.' }\nend\n\nfunction parse_get_site_survey(response)\n  local site_survey = {}\n  local tmp = {}\n  for _, param in ipairs(response.list or {}) do\n    local entry, param_type = string.match(param.name or '', 'Device%.WiFi%.NeighboringWiFiDiagnostic%.Result%.(%d+)%.(.+)')\n    if entry then\n      entry = tonumber(entry)\n      tmp[entry] = tmp[entry] or {}\n      tmp[entry][param_type] = param.value\n    end\n  end\n\n  for _, params in pairs(tmp) do\n    local neighbor = {\n      signal_level = params['SignalStrength'],\n      ssid = params['SSID'],\n      channel = params['Channel'],\n      standard = params['OperatingStandards'],\n      bandwidth = params['OperatingChannelBandwidth'],\n      bssid = params['BSSID'],\n    }\n\n    if params['Radio'] == 'Device.WiFi.Radio.1' then\n      site_survey['2.4GHz'] = site_survey['2.4GHz'] or {}\n      table.insert(site_survey['2.4GHz'], neighbor)\n    elseif params['Radio'] == 'Device.WiFi.Radio.2' then\n      site_survey['5GHz'] = site_survey['5GHz'] or {}\n      table.insert(site_survey['5GHz'], neighbor)\n    elseif params['Radio'] == 'Device.WiFi.Radio.3' then\n      site_survey['6GHz'] = site_survey['6GHz'] or {}\n      table.insert(site_survey['6GHz'], neighbor)\n    else\n      site_survey['Unknown Frequency'] = site_survey['Unknown Frequency'] or {}\n      table.insert(site_survey['Unknown Frequency'], neighbor)\n    end\n  end\n\n  return site_survey\nend\n\n-- Connected Devices\nfunction get_connected_devices()\n  return {\n    'Device.WiFi.SSID.',\n    'Device.WiFi.Radio.',\n    'Device.WiFi.AccessPoint.',\n    'Device.Hosts.Host.',\n  }\nend\n\nfunction parse_get_connected_devices(response)\n  local tmp_connected_devices = {}\n  local tmp_devices_connected_to_ap = {}\n  local radio_frequency_band = {}\n  local ssid_association_to_radio = {}\n  local access_point_association_to_ssid = {}\n\n  for _, param in ipairs(response.list or {}) do\n    local name = param.name or ''\n\n    if string.find(name, '^Device%.WiFi%.AccessPoint%.') then\n      if string.find(name, 'SSIDReference$') then\n        local parameter_name = string.gsub(name, '%.SSIDReference$', '')\n        access_point_association_to_ssid[parameter_name] = param.value\n      elseif string.find(name, 'AssociatedDevice%.') then\n        local ap_id, device_number, param_name = string.match(name, 'Device%.WiFi%.AccessPoint%.(%d+)%.AssociatedDevice%.(%d+)%.(.+)')\n        if ap_id and device_number and param_name then\n          ap_id = tonumber(ap_id)\n          tmp_devices_connected_to_ap[ap_id] = tmp_devices_connected_to_ap[ap_id] or {}\n          tmp_devices_connected_to_ap[ap_id][param_name] = param.value\n        end\n      end\n    elseif string.find(name, '^Device%.WiFi%.SSID%.') and string.find(name, 'LowerLayers$') then\n      local parameter_name = string.gsub(name, '%.LowerLayers$', '')\n      ssid_association_to_radio[parameter_name] = param.value\n    elseif string.find(name, '^Device%.WiFi%.Radio%.') and string.find(name, 'OperatingFrequencyBand$') then\n      local parameter_name = string.gsub(name, '%.OperatingFrequencyBand$', '')\n      radio_frequency_band[parameter_name] = param.value\n    elseif string.find(name, '^Device%.Hosts%.Host%.') then\n      local host_number, param_name = string.match(name, 'Device%.Hosts%.Host%.(%d+)%.(.+)')\n      if host_number and param_name then\n        host_number = tonumber(host_number)\n        tmp_connected_devices[host_number] = tmp_connected_devices[host_number] or {}\n        tmp_connected_devices[host_number][param_name] = param.value\n      end\n    end\n  end\n\n  local connected_devices_per_interface = {}\n  local mesh_nodes = {}\n\n  for _, dev in pairs(tmp_connected_devices) do\n    if dev['DeviceRole'] == 'slave' then\n      local connected_device_name = dev['Hostname']\n      if dev['FriendlyName'] and dev['FriendlyName'] ~= '' then\n        connected_device_name = dev['FriendlyName']\n      end\n      mesh_nodes[dev['DeviceID']] = {\n        mac = dev['PhysAddress'],\n        hostname = connected_device_name,\n        ip_adress = dev['IPAddress'],\n        adress_source = dev['AddressSource'],\n        active = bool_val(dev['Active']),\n        router_mesh = true,\n      }\n    end\n  end\n\n  for _, dev in pairs(tmp_connected_devices) do\n    if dev['DeviceRole'] ~= 'slave' then\n      local connected_device_name = dev['Hostname']\n      if dev['FriendlyName'] and dev['FriendlyName'] ~= '' then\n        connected_device_name = dev['FriendlyName']\n      end\n\n      local connected_device = {\n        mac = dev['PhysAddress'],\n        ip_adress = dev['IPAddress'],\n        adress_source = dev['AddressSource'],\n        active = bool_val(dev['Active']),\n        hostname = connected_device_name,\n      }\n\n      local interface_name = 'Ethernet'\n      if dev['AssociatedDevice'] and dev['AssociatedDevice'] ~= '' then\n        local ap_instance = tonumber((dev['AssociatedDevice']:match('%.(%d+)$')))\n        local ap_device = ap_instance and tmp_devices_connected_to_ap[ap_instance] or nil\n        if ap_device then\n          connected_device.rssi = ap_device['SignalStrength']\n          connected_device.stats = {\n            bytes_received = to_uint64(ap_device['Stats.BytesReceived']),\n            bytes_sent = to_uint64(ap_device['Stats.BytesSent']),\n          }\n          connected_device.router_mesh = (dev['DeviceRole'] == 'slave')\n\n          local access_point = dev['AssociatedDevice']\n          local idx = string.find(access_point, '%.AssociatedDevice')\n          if idx then\n            access_point = string.sub(access_point, 1, idx - 1)\n          end\n          interface_name = radio_frequency_band[ssid_association_to_radio[access_point_association_to_ssid[access_point]]] or interface_name\n        end\n      end\n\n      local is_connected_to_slave = false\n      for mesh_node_id, mesh_node in pairs(mesh_nodes) do\n        if dev['ParentNodeID'] == mesh_node_id then\n          mesh_node.connected_devices = mesh_node.connected_devices or {}\n          mesh_node.connected_devices[interface_name] = mesh_node.connected_devices[interface_name] or {}\n          table.insert(mesh_node.connected_devices[interface_name], connected_device)\n          mesh_nodes[mesh_node_id] = mesh_node\n          is_connected_to_slave = true\n          break\n        end\n      end\n\n      if not is_connected_to_slave then\n        connected_devices_per_interface[interface_name] = connected_devices_per_interface[interface_name] or {}\n        table.insert(connected_devices_per_interface[interface_name], connected_device)\n      end\n    end\n  end\n\n  for _, dev in pairs(tmp_connected_devices) do\n    if dev['DeviceRole'] == 'slave' then\n      local interface_name = 'Ethernet'\n\n      if dev['AssociatedDevice'] and dev['AssociatedDevice'] ~= '' then\n        local ap_instance = tonumber((dev['AssociatedDevice']:match('%.(%d+)$')))\n        local ap_device = ap_instance and tmp_devices_connected_to_ap[ap_instance] or nil\n        if ap_device then\n          local mesh_node = mesh_nodes[dev['DeviceID']] or {}\n          mesh_node.rssi = ap_device['SignalStrength']\n          mesh_node.stats = {\n            bytes_received = to_uint64(ap_device['Stats.BytesReceived']),\n            bytes_sent = to_uint64(ap_device['Stats.BytesSent']),\n          }\n          mesh_node.router_mesh = true\n          mesh_nodes[dev['DeviceID']] = mesh_node\n\n          local access_point = dev['AssociatedDevice']\n          local idx = string.find(access_point, '%.AssociatedDevice')\n          if idx then\n            access_point = string.sub(access_point, 1, idx - 1)\n          end\n          interface_name = radio_frequency_band[ssid_association_to_radio[access_point_association_to_ssid[access_point]]] or interface_name\n        end\n      end\n\n      connected_devices_per_interface[interface_name] = connected_devices_per_interface[interface_name] or {}\n      table.insert(connected_devices_per_interface[interface_name], mesh_nodes[dev['DeviceID']])\n    end\n  end\n\n  return {\n    model = model,\n    hostname = sn,\n    connected_devices = connected_devices_per_interface,\n  }\nend\n\n-- Speed Test\nfunction parse_get_speed_test_result(speed_test_type, response)\n  local params = response_param_map(response)\n\n  local diagnostic = params['DiagnosticsState']\n  if diagnostic and diagnostic ~= 'Complete' and diagnostic ~= 'Completed' then\n    return nil, diagnostic .. ' state received'\n  end\n\n  local bytes_received = tonumber(params['TotalBytesReceived'] or '0') or 0\n  local raw_eom = params['EOMTime'] or ''\n  local raw_rom = params['ROMTime'] or ''\n  local raw_bom = params['BOMTime'] or ''\n\n  local eom = parse_iso_time(raw_eom)\n  local rom = parse_iso_time(raw_rom)\n  local bom = parse_iso_time(raw_bom)\n  if not eom or not rom or not bom then\n    return nil, 'Time parsing error'\n  end\n\n  local rtt = duration_string(os.difftime(bom, rom))\n  local resp_time = duration_string(os.difftime(eom, rom))\n  local elapsed = os.difftime(eom, bom)\n  local throughput = '0'\n  if elapsed > 0 then\n    if speed_test_type == 'upload' then\n      local bytes_sent = tonumber(params['TotalBytesSent'] or '0') or 0\n      throughput = human_readable_bits(math.floor(8 * bytes_sent / elapsed))\n    else\n      throughput = human_readable_bits(math.floor(8 * bytes_received / elapsed))\n    end\n  end\n\n  return {\n    bytes_received = bytes_received,\n    rtt = rtt,\n    resp_time = resp_time,\n    throughput = throughput,\n    action = speed_test_type,\n  }, nil\nend\n\nfunction get_speed_test_result(speed_test_type)\n  local diagnostic_prefix = 'Device.IP.Diagnostics.DownloadDiagnostics.'\n  if speed_test_type == 'upload' then\n    diagnostic_prefix = 'Device.IP.Diagnostics.UploadDiagnostics.'\n  end\n\n  return {\n    diagnostic_prefix .. 'ROMTime',\n    diagnostic_prefix .. 'BOMTime',\n    diagnostic_prefix .. 'EOMTime',\n    diagnostic_prefix .. 'TotalBytesReceived',\n    diagnostic_prefix .. 'TotalBytesSent',\n  }\nend\n\nfunction set_speed_test(test)\n  local action = test.action or test.type\n  local values = {}\n\n  if action == 'upload' then\n    if test.url and test.url ~= '' then\n      values['Device.IP.Diagnostics.UploadDiagnostics.UploadURL'] = test.url\n    end\n    values['Device.IP.Diagnostics.UploadDiagnostics.DiagnosticsState'] = 'Requested'\n    values['Device.IP.Diagnostics.UploadDiagnostics.TestFileLength'] = 209715200\n    values['Device.IP.Diagnostics.UploadDiagnostics.NumberOfConnections'] = 3\n  else\n    if test.url and test.url ~= '' then\n      values['Device.IP.Diagnostics.DownloadDiagnostics.DownloadURL'] = test.url\n    end\n    if test.interface and test.interface ~= '' then\n      values['Device.IP.Diagnostics.DownloadDiagnostics.Interface'] = test.interface\n    end\n    values['Device.IP.Diagnostics.DownloadDiagnostics.DiagnosticsState'] = 'Requested'\n  end\n\n  return values\nend\n\nfunction get_download_diagnostic_state()\n  return 'Device.IP.Diagnostics.DownloadDiagnostics.DiagnosticsState'\nend\n\nfunction get_upload_diagnostic_state()\n  return 'Device.IP.Diagnostics.UploadDiagnostics.DiagnosticsState'\nend\n\n-- Ping\nfunction get_ping()\n  return {\n    'Device.IP.Diagnostics.IPPing.Interface',\n    'Device.IP.Diagnostics.IPPing.Timeout',\n    'Device.IP.Diagnostics.IPPing.Host',\n    'Device.IP.Diagnostics.IPPing.NumberOfRepetitions',\n    'Device.IP.Diagnostics.IPPing.DataBlockSize',\n    'Device.IP.Diagnostics.IPPing.FailureCount',\n    'Device.IP.Diagnostics.IPPing.SuccessCount',\n    'Device.IP.Diagnostics.IPPing.AverageResponseTime',\n    'Device.IP.Diagnostics.IPPing.MinimumResponseTime',\n    'Device.IP.Diagnostics.IPPing.MaximumResponseTime',\n    'Device.IP.Diagnostics.IPPing.DiagnosticsState',\n  }\nend\n\nfunction parse_get_ping(response)\n  local params = response_param_map(response)\n\n  local timeout = to_int(params['Timeout'], 5000)\n  local timeout_seconds = math.floor(timeout / 1000)\n  local repetitions = to_int(params['NumberOfRepetitions'], 3)\n  local block_size = to_int(params['DataBlockSize'], 32)\n  if block_size == 0 then\n    block_size = 32\n  end\n\n  local failure_count = to_int(params['FailureCount'], 0)\n  local success_count = to_int(params['SuccessCount'], 0)\n  local avg_rtt = to_int(params['AverageResponseTime'], 0)\n  local min_rtt = to_int(params['MinimumResponseTime'], 0)\n  local max_rtt = to_int(params['MaximumResponseTime'], 0)\n\n  local diagnostic = params['DiagnosticsState'] or ''\n  local interface_value = params['Interface']\n  local host = params['Host']\n\n  local last_result = {\n    result = parse_diagnostic_state(diagnostic, failure_count),\n    failure_count = failure_count,\n    success_count = success_count,\n    average_rtt = avg_rtt,\n    minimum_rtt = min_rtt,\n    maximum_rtt = max_rtt,\n  }\n\n  return {\n    interface = pd(false, interface_value),\n    timeout = pd(true, timeout_seconds),\n    host = pd(true, host),\n    number_of_repetitions = pd(true, repetitions),\n    data_block_size = pd(true, block_size),\n    processing = pd(false, diagnostic == 'Requested' or diagnostic == 'Request'),\n    last_result = last_result,\n  }\nend\n\nfunction get_ping_diagnostic_state()\n  return 'Device.IP.Diagnostics.IPPing.DiagnosticsState'\nend\n\nfunction set_ping(ping)\n  local values = {}\n  values['Device.IP.Diagnostics.IPPing.Interface'] = ping.interface.value\n  values['Device.IP.Diagnostics.IPPing.Timeout'] = (ping.timeout.value or 0) * 1000\n  values['Device.IP.Diagnostics.IPPing.Host'] = ping.host.value\n  values['Device.IP.Diagnostics.IPPing.NumberOfRepetitions'] = ping.number_of_repetitions.value\n  values['Device.IP.Diagnostics.IPPing.DiagnosticsState'] = 'Requested'\n  values['Device.IP.Diagnostics.IPPing.DataBlockSize'] = ping.data_block_size.value\n  return values\nend\n\nfunction get_ping_result()\n  return {\n    'Device.IP.Diagnostics.IPPing.FailureCount',\n    'Device.IP.Diagnostics.IPPing.SuccessCount',\n    'Device.IP.Diagnostics.IPPing.AverageResponseTime',\n    'Device.IP.Diagnostics.IPPing.MinimumResponseTime',\n    'Device.IP.Diagnostics.IPPing.MaximumResponseTime',\n    'Device.IP.Diagnostics.IPPing.DiagnosticsState',\n  }\nend\n\nfunction parse_get_ping_result(response)\n  local list = response.list or {}\n  if #list < 6 then\n    return nil\n  end\n\n  local failure_count = to_int(list[1].value, 0)\n  local success_count = to_int(list[2].value, 0)\n  local avg_rtt = to_int(list[3].value, 0)\n  local min_rtt = to_int(list[4].value, 0)\n  local max_rtt = to_int(list[5].value, 0)\n  local diagnostic_state = list[6].value or ''\n\n  if diagnostic_state == 'Error_CannotResolveHostName' then\n    diagnostic_state = 'Cannot resolve host name'\n  elseif diagnostic_state == 'Error_MaxHopCountExceeded' then\n    diagnostic_state = 'Max hop count exceeded'\n  elseif diagnostic_state == 'Requested' then\n    diagnostic_state = 'In progress'\n  elseif diagnostic_state == 'Complete' then\n    if failure_count > 0 then\n      diagnostic_state = 'Failure'\n    else\n      diagnostic_state = 'Success'\n    end\n  elseif diagnostic_state == 'None' then\n    diagnostic_state = 'None'\n  else\n    diagnostic_state = 'Unknown'\n  end\n\n  return {\n    result = diagnostic_state,\n    failure_count = failure_count,\n    success_count = success_count,\n    average_rtt = avg_rtt,\n    minimum_rtt = min_rtt,\n    maximum_rtt = max_rtt,\n  }\nend\n\n-- Traceroute\nfunction get_traceroute()\n  return {\n    'Device.IP.Diagnostics.TraceRoute.Interface',\n    'Device.IP.Diagnostics.TraceRoute.Timeout',\n    'Device.IP.Diagnostics.TraceRoute.Host',\n    'Device.IP.Diagnostics.TraceRoute.NumberOfTries',\n    'Device.IP.Diagnostics.TraceRoute.MaxHopCount',\n  }\nend\n\nfunction parse_get_traceroute(response)\n  local list = response.list or {}\n  if #list < 5 then\n    return nil\n  end\n\n  local timeout = to_int(list[2].value, 30000)\n  local number_of_tries = to_int(list[4].value, 0)\n  local max_hop_count = to_int(list[5].value, 0)\n\n  return {\n    interface = pd(false, list[1].value),\n    timeout = pd(true, math.floor(timeout / 1000)),\n    host = pd(true, list[3].value),\n    number_of_tries = pd(true, number_of_tries),\n    max_hop_count = pd(true, max_hop_count),\n  }\nend\n\nfunction get_traceroute_diagnostic_state()\n  return 'Device.IP.Diagnostics.TraceRoute.DiagnosticsState'\nend\n\nfunction set_traceroute(traceroute)\n  return {\n    ['Device.IP.Diagnostics.TraceRoute.Timeout'] = (traceroute.timeout.value or 0) * 1000,\n    ['Device.IP.Diagnostics.TraceRoute.Host'] = traceroute.host.value,\n    ['Device.IP.Diagnostics.TraceRoute.NumberOfTries'] = traceroute.number_of_tries.value,\n    ['Device.IP.Diagnostics.TraceRoute.MaxHopCount'] = traceroute.max_hop_count.value,\n    ['Device.IP.Diagnostics.TraceRoute.DiagnosticsState'] = 'Requested',\n  }\nend\n\nfunction get_traceroute_result_number_of_hops()\n  return 'Device.IP.Diagnostics.TraceRoute.RouteHopsNumberOfEntries'\nend\n\nfunction get_traceroute_result(number_of_hops)\n  local params = {\n    'Device.IP.Diagnostics.TraceRoute.DiagnosticsState',\n    'Device.IP.Diagnostics.TraceRoute.ResponseTime',\n    'Device.IP.Diagnostics.TraceRoute.RouteHopsNumberOfEntries',\n  }\n  for i = 1, number_of_hops do\n    local entry = tostring(i)\n    params[#params + 1] = 'Device.IP.Diagnostics.TraceRoute.RouteHops.' .. entry .. '.Host'\n    params[#params + 1] = 'Device.IP.Diagnostics.TraceRoute.RouteHops.' .. entry .. '.RTTimes'\n    params[#params + 1] = 'Device.IP.Diagnostics.TraceRoute.RouteHops.' .. entry .. '.HostAddress'\n  end\n  return params\nend\n\nfunction parse_get_traceroute_result(response)\n  local list = response.list or {}\n  if #list < 3 then\n    return nil\n  end\n\n  local result = {}\n  local diagnostic_state = list[1].value or ''\n  if diagnostic_state == 'Error_CannotResolveHostName' then\n    result.result = 'Cannot resolve host name'\n  elseif diagnostic_state == 'Error_MaxHopCountExceeded' then\n    result.result = 'Max hop count exceeded'\n  elseif diagnostic_state == 'Requested' then\n    result.result = 'In progress'\n  elseif diagnostic_state == 'Complete' then\n    result.result = 'Success'\n  elseif diagnostic_state == 'None' then\n    result.result = 'None'\n  else\n    result.result = 'Success'\n  end\n\n  result.response_time = to_int(list[2].value, 0)\n  result.hop_count = to_int(list[3].value, 0)\n\n  local hops = {}\n  local index = 4\n  for i = 1, result.hop_count do\n    local host = list[index] and list[index].value or nil\n    local addr = list[index + 2] and list[index + 2].value or nil\n    if host == nil or host == '' then\n      host = addr\n    end\n    hops[i] = {\n      host = host,\n      rtt = list[index + 1] and list[index + 1].value or nil,\n      addr = addr,\n    }\n    index = index + 3\n  end\n  result.hops = hops\n\n  return result\nend\n\n-- Statistics / Interfaces / Ports / Hwinfo / PON are not implemented in ln14.go\nfunction get_statistics() return nil end\nfunction parse_get_statistics(response) return nil end\nfunction get_interface_wan() return nil end\nfunction get_interface_lan() return nil end\nfunction parse_get_interface_wan(response) return nil end\nfunction parse_get_interface_lan(response) return nil end\nfunction set_port(ports) return nil, nil end\nfunction add_port(port) return nil, nil end\nfunction get_hwinfo() return nil end\nfunction parse_get_hwinfo(response) return {} end\nfunction get_pon() return nil end\nfunction parse_get_pon(response) return {} end\n\n-- The following functions are also not implemented in ln14.go\nfunction get_wan_options() return nil end\nfunction get_port() return nil end\nfunction parse_get_port(response) return nil end\nfunction get_bridge() return nil end\nfunction parse_get_bridge(response) return nil end\nfunction set_bridge(bridges) return nil end\nfunction get_voice() return nil end\nfunction parse_get_voice(response) return nil end\nfunction add_voice(voice) return nil, nil end\nfunction set_voice(voice) return nil, nil end\nfunction add_line(line) return nil, nil end\nfunction set_line(line) return nil, nil end\nfunction get_cellular() return nil end\nfunction parse_get_cellular(response) return '[]' end\nfunction set_cellular(cellular) return nil end\nfunction get_xdsl() return nil end\nfunction parse_xdsl(response) return nil end\n"
