                  "content": "-- model:VMG8623-T50B\n-- protocol:cwmp\n\n-- Helpers\nlocal function trim(s)\n  return (tostring(s or ''):gsub('^%s+', ''):gsub('%s+$', ''))\nend\n\nlocal function split(s, sep)\n  local out = {}\n  if s == nil or s == '' then\n    return out\n  end\n  sep = sep or ','\n  local pattern = '([^' .. sep .. ']+)'\n  for part in string.gmatch(s, pattern) do\n    out[#out + 1] = trim(part)\n  end\n  return out\nend\n\nlocal function split_int(s, sep)\n  local out = {}\n  for _, item in ipairs(split(s, sep)) do\n    local n = tonumber(item)\n    if n ~= nil then\n      out[#out + 1] = math.floor(n)\n    end\n  end\n  return out\nend\n\nlocal function trim_suffix(value, suffix)\n  if value == nil then\n    return nil\n  end\n  if suffix ~= '' and value:sub(-#suffix) == suffix then\n    return value:sub(1, #value - #suffix)\n  end\n  return value\nend\n\nlocal function table_len(t)\n  local n = 0\n  for _ in pairs(t or {}) do\n    n = n + 1\n  end\n  return n\nend\n\nlocal function pd(writable, value)\n  return { writable = writable, value = value }\nend\n\nlocal function bool_val(v)\n  if v == nil then\n    return false\n  end\n  if type(v) == 'boolean' then\n    return v\n  end\n  local s = tostring(v):lower()\n  return s == '1' or s == 'true'\nend\n\nlocal function to_int(v, default)\n  local n = tonumber(v)\n  if n == nil then\n    return default\n  end\n  return math.floor(n)\nend\n\nlocal function to_uint64(v)\n  local n = tonumber(v)\n  if n == nil or n < 0 then\n    return 0\n  end\n  return math.floor(n)\nend\n\nlocal function response_param_map(response)\n  local param_map = {}\n  for _, param in ipairs((response and response.list) or {}) do\n    local name = param.name or ''\n    local last = name:match('([^.]+)$') or name\n    param_map[last] = param.value\n  end\n  return param_map\nend\n\nlocal function safe_get_string_array(value_to_convert, separator)\n  if value_to_convert == nil or value_to_convert == '' then\n    return {}\n  end\n  return split(value_to_convert, separator)\nend\n\nlocal function safe_get_int_array(value_to_convert, separator)\n  if value_to_convert == nil or value_to_convert == '' then\n    return {}\n  end\n  return split_int(value_to_convert, separator)\nend\n\nlocal function safe_format_transmit_power(raw)\n  if raw == nil or raw == '' or raw == '-1' then\n    return 'Auto'\n  end\n  if tonumber(raw) == nil then\n    return 'Auto'\n  end\n  return tostring(math.floor(tonumber(raw))) .. '%'\nend\n\nlocal function safe_format_transmit_power_supported(raw)\n  if raw == nil or raw == '' then\n    return { 'Auto' }\n  end\n  local out = {}\n  for _, item in ipairs(split(raw, ',')) do\n    if item == '-1' then\n      out[#out + 1] = 'Auto'\n    elseif tonumber(item) ~= nil then\n      out[#out + 1] = tostring(math.floor(tonumber(item))) .. '%'\n    end\n  end\n  if #out == 0 then\n    return { 'Auto' }\n  end\n  return out\nend\n\nlocal function translate_beacon_type_to_human(value)\n  if value == '11i' then\n    return 'WPA2'\n  elseif value == 'WPAand11i' then\n    return 'WPA/WPA2'\n  elseif value == '11iandWPA3' then\n    return 'WPA2/WPA3'\n  end\n  return value\nend\n\nlocal function translate_beacon_type_to_cwmp(value)\n  if value == 'WPA2' then\n    return '11i'\n  elseif value == 'WPA/WPA2' then\n    return 'WPAand11i'\n  elseif value == 'WPA2/WPA3' then\n    return '11iandWPA3'\n  end\n  return value\nend\n\nlocal function is_password_writable(beacon_type)\n  return not (beacon_type == 'Basic' or beacon_type == 'None')\nend\n\nlocal function duration_string(seconds)\n  if seconds == nil then\n    return '0'\n  end\n  local total = tonumber(seconds) or 0\n  if total == 0 then\n    return '0'\n  end\n  total = math.floor(total)\n  if total < 60 then\n    return string.format('%ds', total)\n  end\n  local mins = math.floor(total / 60)\n  local secs = total - mins * 60\n  if mins < 60 then\n    if secs == 0 then\n      return string.format('%dm0s', mins)\n    end\n    return string.format('%dm%ds', mins, secs)\n  end\n  local hours = math.floor(mins / 60)\n  mins = mins - hours * 60\n  return string.format('%dh%dm%ds', hours, mins, secs)\nend\n\nlocal function human_readable_bits(bits)\n  local sizes = { 'bits p/s', 'Kbps', 'Mbps', 'Gbps', 'Tbps', 'Pbps', 'Ebps' }\n  local value = tonumber(bits) or 0\n  local i = 1\n  while value >= 1000 and i < #sizes do\n    value = value / 1000\n    i = i + 1\n  end\n  return string.format('%.2f%s', value, sizes[i])\nend\n\nlocal function parse_iso_time(raw)\n  if raw == nil or raw == '' then\n    return nil\n  end\n  raw = tostring(raw)\n  if raw:sub(-1) == 'Z' then\n    raw = raw:sub(1, -2)\n  end\n  local y, mo, d, h, mi, s = raw:match('^(%d+)%-(%d+)%-(%d+)T(%d+):(%d+):(%d+)')\n  if not y then\n    return nil\n  end\n  return os.time({\n    year = tonumber(y),\n    month = tonumber(mo),\n    day = tonumber(d),\n    hour = tonumber(h),\n    min = tonumber(mi),\n    sec = tonumber(s),\n  })\nend\n\nlocal function parse_diagnostic_state(raw, failure_count)\n  if raw == 'Error_CannotResolveHostName' then\n    return 'Cannot resolve host name'\n  elseif raw == 'Error_MaxHopCountExceeded' then\n    return 'Max hop count exceeded'\n  elseif raw == 'Requested' or raw == 'Running' then\n    return 'In progress'\n  elseif raw == 'Complete' or raw == 'Completed' then\n    if (failure_count or 0) > 0 then\n      return 'Failure'\n    end\n    return 'Success'\n  elseif raw == 'None' then\n    return 'None'\n  end\n  return 'Unknown'\nend\n\nlocal function parse_get_ping_common(response)\n  local param_map = response_param_map(response)\n  local timeout = to_int(param_map['Timeout'], 5000)\n  local timeout_seconds = math.floor(timeout / 1000)\n  local repetitions = to_int(param_map['NumberOfRepetitions'], 3)\n  local data_block_size = to_int(param_map['DataBlockSize'], 32)\n  if data_block_size == 0 then\n    data_block_size = 32\n  end\n\n  local failure_count = to_int(param_map['FailureCount'], 0)\n  local success_count = to_int(param_map['SuccessCount'], 0)\n  local average_rtt = to_int(param_map['AverageResponseTime'], 0)\n  local minimum_rtt = to_int(param_map['MinimumResponseTime'], 0)\n  local maximum_rtt = to_int(param_map['MaximumResponseTime'], 0)\n  local diagnostic_state = param_map['DiagnosticsState'] or ''\n\n  return {\n    interface = pd(false, param_map['Interface']),\n    timeout = pd(true, timeout_seconds),\n    host = pd(true, param_map['Host']),\n    number_of_repetitions = pd(true, repetitions),\n    data_block_size = pd(true, data_block_size),\n    processing = pd(false, diagnostic_state == 'Requested' or diagnostic_state == 'Request'),\n    last_result = {\n      result = parse_diagnostic_state(diagnostic_state, failure_count),\n      failure_count = failure_count,\n      success_count = success_count,\n      average_rtt = average_rtt,\n      minimum_rtt = minimum_rtt,\n      maximum_rtt = maximum_rtt,\n    },\n  }\nend\n\nlocal function parse_get_ping_result_common(response)\n  local param_map = response_param_map(response)\n  local failure_count = to_int(param_map['FailureCount'], 0)\n  return {\n    result = parse_diagnostic_state(param_map['DiagnosticsState'] or '', failure_count),\n    failure_count = failure_count,\n    success_count = to_int(param_map['SuccessCount'], 0),\n    average_rtt = to_int(param_map['AverageResponseTime'], 0),\n    minimum_rtt = to_int(param_map['MinimumResponseTime'], 0),\n    maximum_rtt = to_int(param_map['MaximumResponseTime'], 0),\n  }\nend\n\nlocal function get_ip_origin(value)\n  if value == nil or value == '' then\n    return 'PPPoE'\n  end\n  return value\nend\n\nlocal function ip_to_octets(ip)\n  if ip == nil then\n    return nil\n  end\n  local a, b, c, d = tostring(ip):match('^(%d+)%.(%d+)%.(%d+)%.(%d+)$')\n  if not a then\n    return nil\n  end\n  a, b, c, d = tonumber(a), tonumber(b), tonumber(c), tonumber(d)\n  if a > 255 or b > 255 or c > 255 or d > 255 then\n    return nil\n  end\n  return a, b, c, d\nend\n\nlocal function band(a, b)\n  local res = 0\n  local bit = 1\n  while a > 0 or b > 0 do\n    local a_bit = a % 2\n    local b_bit = b % 2\n    if a_bit == 1 and b_bit == 1 then\n      res = res + bit\n    end\n    a = math.floor(a / 2)\n    b = math.floor(b / 2)\n    bit = bit * 2\n  end\n  return res\nend\n\nlocal function is_valid_ipv4(ip)\n  return ip_to_octets(ip) ~= nil\nend\n\nlocal function is_valid_subnet_mask(mask)\n  local a, b, c, d = ip_to_octets(mask)\n  if not a then\n    return false\n  end\n  local mask_value = ((a * 256 + b) * 256 + c) * 256 + d\n  if mask_value == 0 then\n    return false\n  end\n  local inverted = 0xFFFFFFFF - mask_value + 1\n  if inverted == 0 then\n    return true\n  end\n  return band(inverted, inverted - 1) == 0\nend\n\nlocal function are_ips_in_same_subnet(ip1, ip2, mask)\n  local a1, b1, c1, d1 = ip_to_octets(ip1)\n  local a2, b2, c2, d2 = ip_to_octets(ip2)\n  local m1, m2, m3, m4 = ip_to_octets(mask)\n  if not a1 or not a2 or not m1 then\n    return false\n  end\n  return band(a1, m1) == band(a2, m1)\n    and band(b1, m2) == band(b2, m2)\n    and band(c1, m3) == band(c2, m3)\n    and band(d1, m4) == band(d2, m4)\nend\n\nlocal function typed_param(name, value, type_name)\n  return {\n    name = name,\n    value = value,\n    type = type_name,\n  }\nend\n\nlocal function wan_stats(ip_data)\n  return {\n    bytes_sent = to_uint64(ip_data['Stats.EthernetBytesSent']),\n    bytes_received = to_uint64(ip_data['Stats.EthernetBytesReceived']),\n    packets_sent = to_uint64(ip_data['Stats.EthernetPacketsSent']),\n    packets_received = to_uint64(ip_data['Stats.EthernetPacketsReceived']),\n    errors_sent = to_uint64(ip_data['Stats.EthernetErrorsSent']),\n    errors_received = to_uint64(ip_data['Stats.EthernetErrorsReceived']),\n    discard_packets_sent = to_uint64(ip_data['Stats.EthernetDiscardPacketsSent']),\n    discard_packets_received = to_uint64(ip_data['Stats.EthernetDiscardPacketsReceived']),\n    unicast_packets_sent = to_uint64(ip_data['Stats.EthernetUnicastPacketsSent']),\n    unicast_packets_received = to_uint64(ip_data['Stats.EthernetUnicastPacketsReceived']),\n    multicast_packets_sent = to_uint64(ip_data['Stats.EthernetMulticastPacketsSent']),\n    multicast_packets_received = to_uint64(ip_data['Stats.EthernetMulticastPacketsReceived']),\n    broadcast_packets_sent = to_uint64(ip_data['Stats.EthernetBroadcastPacketsSent']),\n    broadcast_packets_received = to_uint64(ip_data['Stats.EthernetBroadcastPacketsReceived']),\n    unknown_packets_received = to_uint64(ip_data['Stats.EthernetUnknownProtoPacketsReceived']),\n  }\nend\n\nlocal function get_bridge_common()\n  return {\n    'InternetGatewayDevice.LANDevice.1.LANHostConfigManagement.',\n  }\nend\n\nlocal function parse_get_bridge_common(response)\n  local path = 'InternetGatewayDevice.LANDevice.1.LANHostConfigManagement.'\n  local dhcpserver = {}\n\n  for _, param in ipairs((response and response.list) or {}) do\n    local name = param.name or ''\n    local value = param.value\n    if name == path .. 'DHCPServerEnable' then\n      dhcpserver.enable = pd(true, bool_val(value))\n    elseif name == path .. 'MinAddress' then\n      dhcpserver.min_address = pd(true, value)\n    elseif name == path .. 'MaxAddress' then\n      dhcpserver.max_address = pd(true, value)\n    elseif name == path .. 'SubnetMask' then\n      dhcpserver.subnet_mask = pd(true, value)\n    elseif name == path .. 'DNSServers' then\n      dhcpserver.dns_servers = pd(true, value)\n    elseif name == path .. 'DHCPLeaseTime' then\n      dhcpserver.lease_time = pd(true, value)\n    end\n  end\n\n  dhcpserver.path = path\n\n  return {\n    {\n      dhcp_v4 = {\n        server = { dhcpserver },\n      },\n    },\n  }\nend\n\nlocal function set_bridge_common(bridges)\n  local body = {}\n  local first = bridges and bridges[1]\n  local server = first and first.dhcp_v4 and first.dhcp_v4.server and first.dhcp_v4.server[1]\n  if not server then\n    return body\n  end\n\n  local path = server.path or ''\n  if path == '' then\n    return body\n  end\n\n  local function add_typed(suffix, field, type_name)\n    if field and field.value ~= nil then\n      table.insert(body, { name = path .. suffix, value = field.value, type = type_name })\n    end\n  end\n\n  add_typed('DHCPServerEnable', server.enable, 'boolean')\n  add_typed('MaxAddress', server.max_address, 'string')\n  add_typed('MinAddress', server.min_address, 'string')\n  add_typed('SubnetMask', server.subnet_mask, 'string')\n  add_typed('DNSServers', server.dns_servers, 'string')\n  add_typed('DHCPLeaseTime', server.lease_time, 'int')\n\n  return body\nend\n\nlocal function set_voice_line_common(line)\n  local values = {}\n  local path = line and line.path or ''\n  if path == '' then\n    return values\n  end\n\n  if line.username and line.username.value and line.username.value ~= '' then\n    values[path .. 'SIP.AuthUserName'] = line.username.value\n  end\n  if line.password and line.password.value and line.password.value ~= '' then\n    values[path .. 'SIP.AuthPassword'] = line.password.value\n  end\n  if line.uri and line.uri.value and line.uri.value ~= '' then\n    values[path .. 'SIP.URI'] = line.uri.value\n  end\n\n  return values\nend\n\nlocal function parse_get_voice_common(response)\n  local voices = {}\n  local voice_profiles = {}\n  local voice_lines = {}\n\n  for _, param in ipairs((response and response.list) or {}) do\n    local name = param.name or ''\n    if name:find('VoiceProfile%.') then\n      if name:find('%.Line%.') then\n        local profile_number, line_number, param_type = name:match('InternetGatewayDevice%.Services%.VoiceService%.1%.VoiceProfile%.(%d+)%.Line%.(%d+)%.(.+)')\n        if profile_number and line_number and param_type then\n          profile_number = tonumber(profile_number)\n          line_number = tonumber(line_number)\n          voice_lines[profile_number] = voice_lines[profile_number] or {}\n          voice_lines[profile_number][line_number] = voice_lines[profile_number][line_number] or {}\n          voice_lines[profile_number][line_number][param_type] = param.value\n        end\n      else\n        local profile_number, param_type = name:match('InternetGatewayDevice%.Services%.VoiceService%.1%.VoiceProfile%.(%d+)%.(.+)')\n        if profile_number and param_type then\n          profile_number = tonumber(profile_number)\n          voice_profiles[profile_number] = voice_profiles[profile_number] or {}\n          voice_profiles[profile_number][param_type] = param.value\n        end\n      end\n    end\n  end\n\n  for profile_num, profile_data in pairs(voice_profiles) do\n    local voice_name = profile_data['Name']\n    if voice_name == nil or voice_name == '' then\n      voice_name = 'Voice Profile ' .. tostring(profile_num)\n    end\n\n    local voice = {\n      path = 'InternetGatewayDevice.Services.VoiceService.1.VoiceProfile.' .. tostring(profile_num) .. '.',\n      name = pd(false, voice_name),\n      proxy_server = pd(true, profile_data['SIP.ProxyServer']),\n      registrar_server = pd(true, profile_data['SIP.RegistrarServer']),\n      domain = pd(true, profile_data['SIP.UserAgentDomain']),\n      lines = {},\n    }\n\n    local lines = voice_lines[profile_num]\n    if lines then\n      for line_num, line_data in pairs(lines) do\n        table.insert(voice.lines, {\n          path = 'InternetGatewayDevice.Services.VoiceService.1.VoiceProfile.' .. tostring(profile_num) .. '.Line.' .. tostring(line_num) .. '.',\n          status = pd(false, string.lower(tostring(line_data['Enable'] or ''))),\n          username = pd(true, line_data['SIP.AuthUserName']),\n          password = pd(true, line_data['SIP.AuthPassword']),\n          uri = pd(true, line_data['SIP.URI']),\n        })\n      end\n    end\n\n    table.insert(voices, voice)\n  end\n\n  return voices\nend\n\nlocal function set_voice_common(voice)\n  local values = {}\n  local path = voice and voice.path or ''\n  if path ~= '' then\n    if voice.proxy_server and voice.proxy_server.value and voice.proxy_server.value ~= '' then\n      values[path .. 'SIP.ProxyServer'] = voice.proxy_server.value\n    end\n    if voice.registrar_server and voice.registrar_server.value and voice.registrar_server.value ~= '' then\n      values[path .. 'SIP.RegistrarServer'] = voice.registrar_server.value\n    end\n    if voice.domain and voice.domain.value and voice.domain.value ~= '' then\n      values[path .. 'SIP.UserAgentDomain'] = voice.domain.value\n    end\n    if voice.name and voice.name.value and voice.name.value ~= '' then\n      values[path .. 'Name'] = voice.name.value\n    end\n  end\n\n  for _, line in ipairs((voice and voice.lines) or {}) do\n    local line_values = set_voice_line_common(line)\n    for k, v in pairs(line_values) do\n      values[k] = v\n    end\n  end\n\n  return values\nend\n\nlocal function parse_speed_test_result_common(response, speed_test_type)\n  local speed_test = {}\n  local list = (response and response.list) or {}\n  if #list < 4 then\n    return nil, 'not enough parameters in SpeedTest result'\n  end\n\n  local param_map = response_param_map(response)\n  local diagnostic_state = param_map['DiagnosticsState']\n  if diagnostic_state ~= nil and diagnostic_state ~= '' then\n    if diagnostic_state ~= 'Complete' and diagnostic_state ~= 'Completed' then\n      return nil, diagnostic_state .. ' state received'\n    end\n  end\n\n  speed_test.bytes_received = to_int(param_map['TotalBytesReceived'], 0)\n\n  local raw_eom = tostring(param_map['EOMTime'] or '')\n  if raw_eom ~= '' and raw_eom:sub(-1) ~= 'Z' then raw_eom = raw_eom .. 'Z' end\n  local raw_rom = tostring(param_map['ROMTime'] or '')\n  if raw_rom ~= '' and raw_rom:sub(-1) ~= 'Z' then raw_rom = raw_rom .. 'Z' end\n  local raw_bom = tostring(param_map['BOMTime'] or '')\n  if raw_bom ~= '' and raw_bom:sub(-1) ~= 'Z' then raw_bom = raw_bom .. 'Z' end\n\n  local eom = parse_iso_time(raw_eom)\n  if eom == nil then return nil, 'EOMTime parsing error' end\n  local rom = parse_iso_time(raw_rom)\n  if rom == nil then return nil, 'ROMTime parsing error' end\n  local bom = parse_iso_time(raw_bom)\n  if bom == nil then return nil, 'BOMTime parsing error' end\n\n  local rtt_elapsed = os.difftime(bom, rom)\n  if rtt_elapsed == 0 then\n    speed_test.rtt = '0'\n  else\n    speed_test.rtt = duration_string(rtt_elapsed)\n  end\n\n  local resp_elapsed = os.difftime(eom, rom)\n  if resp_elapsed == 0 then\n    speed_test.resp_time = '0'\n  else\n    speed_test.resp_time = duration_string(resp_elapsed)\n  end\n\n  local elapsed = os.difftime(eom, bom)\n  if elapsed == 0 then\n    speed_test.throughput = '0'\n  else\n    if speed_test_type == 'upload' then\n      local total_bytes_sent = to_int(param_map['TotalBytesSent'], 0)\n      speed_test.throughput = human_readable_bits(math.floor(8 * total_bytes_sent / elapsed))\n    else\n      speed_test.throughput = human_readable_bits(math.floor(8 * speed_test.bytes_received / elapsed))\n    end\n  end\n\n  return speed_test, nil\nend\n\nlocal function get_radio_frequency_from_channel(channel, fallback)\n  if channel == nil or channel <= 0 then\n    return fallback or ''\n  end\n  if channel <= 14 then\n    return '2.4GHz'\n  elseif channel >= 36 and channel <= 165 then\n    return '5GHz'\n  elseif channel >= 1 and channel <= 233 then\n    return '6GHz'\n  end\n  return ''\nend\n\n-- Stubs that intentionally stay unsupported\nfunction add_line(...) return nil, nil end\nfunction add_voice(...) return nil, nil end\n\n-- Identity / capabilities\nfunction get_vendor(...) return 'Zyxel' end\n\nfunction get_data_model(...)\n  return datamodel or nil\nend\n\nfunction get_device_capabilities(...)\n  return {\n    NotHomologated = false,\n    Radio = true,\n    Ssid = true,\n    SiteSurvey = true,\n    ConnectedDevices = true,\n    Diagnostic = true,\n    Ping = true,\n    Traceroute = false,\n    SpeedTest = true,\n    DownloadSpeedTest = true,\n    UploadSpeedTest = true,\n    Ports = true,\n    Reboot = true,\n    FactoryReset = false,\n    FirmwareUpgrade = true,\n    FirmwareRollback = false,\n    FactoryDefault = false,\n    Logs = false,\n    Stats = false,\n    Interfaces = true,\n    Hwinfo = true,\n    Pon = false,\n    Lan = true,\n    Wan = true,\n    Voice = true,\n    NTP = true,\n    XDSL = true,\n  }\nend\n\nfunction get_device_specs(...)\n  return {\n    TimeTraceRoute = 3,\n    DirectResult = false,\n  }\nend\n\nfunction is_real_time(...) return false end\n\n-- Wi-Fi Radio\nfunction get_radio(...)\n  return {\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.',\n  }\nend\n\nfunction parse_radio(response)\n  local radios = {}\n  local ports_wlan_tmp = {}\n\n  for _, param in ipairs((response and response.list) or {}) do\n    local wlan_number, param_type = (param.name or ''):match('^InternetGatewayDevice%.LANDevice%.1%.WLANConfiguration%.(%d+)%.(.+)$')\n    if wlan_number and param_type then\n      wlan_number = tonumber(wlan_number)\n      ports_wlan_tmp[wlan_number] = ports_wlan_tmp[wlan_number] or {}\n      ports_wlan_tmp[wlan_number][param_type] = param.value\n    end\n  end\n\n  local current_wifi_channel = 0\n  local i = 1\n  local total = table_len(ports_wlan_tmp)\n  while i <= total do\n    local next_i = i + 1\n    local wlan = ports_wlan_tmp[i]\n    if wlan then\n      local channel = to_int(wlan['Channel'], 0) or 0\n      local skip_radio = false\n      if channel ~= 0 then\n        if channel == current_wifi_channel then\n          skip_radio = true\n        end\n        current_wifi_channel = channel\n      end\n\n      if not skip_radio and not (wlan['SSIDAdvertisementEnabled'] ~= nil and not bool_val(wlan['SSIDAdvertisementEnabled'])) then\n        local radio_frequency = 'Unknown Frequency'\n        if i == 5 then\n          radio_frequency = '5GHz'\n        elseif i == 1 then\n          radio_frequency = '2.4GHz'\n        elseif channel > 0 and channel <= 14 then\n          radio_frequency = '2.4GHz'\n        elseif channel >= 36 and channel <= 165 then\n          radio_frequency = '5GHz'\n        elseif channel >= 1 and channel <= 233 then\n          radio_frequency = '6GHz'\n        end\n\n        local bandwidth = wlan['X_ZYXEL_OperatingChannelBandwidth']\n        local supported_bandwidth = nil\n        if bandwidth ~= nil then\n          supported_bandwidth = { bandwidth }\n        end\n\n        table.insert(radios, {\n          path = 'InternetGatewayDevice.LANDevice.1.WLANConfiguration.' .. tostring(i) .. '.',\n          enable = pd(false, bool_val(wlan['RadioEnabled'])),\n          name = pd(false, radio_frequency),\n          auto_channel_enable = pd(true, bool_val(wlan['AutoChannelEnable'])),\n          channel = pd(true, channel),\n          possible_channels = pd(false, safe_get_int_array(wlan['PossibleChannels'], ',')),\n          operating_frequency_band = pd(false, radio_frequency),\n          supported_frequency_bands = pd(false, { radio_frequency }),\n          transmit_power = pd(true, safe_format_transmit_power(wlan['TransmitPower'])),\n          transmit_power_supported = pd(false, safe_format_transmit_power_supported(wlan['TransmitPowerSupported'])),\n          operating_channel_bandwidth = pd(false, bandwidth),\n          supported_operating_channel_bandwidth = pd(false, supported_bandwidth),\n          supported_standards = pd(false, safe_get_string_array(wlan['Standard'], ',')),\n          operating_standards = pd(false, safe_get_string_array(wlan['Standard'], ',')),\n        })\n        next_i = 5\n      end\n    end\n    i = next_i\n  end\n\n  return radios\nend\n\nfunction set_radio(radios)\n  local values = {}\n  for _, r in ipairs(radios or {}) do\n    local path = r.path or ''\n    if r.auto_channel_enable and r.auto_channel_enable.value ~= nil then\n      values[path .. 'AutoChannelEnable'] = r.auto_channel_enable.value\n    end\n    if r.channel and r.channel.value ~= nil then\n      values[path .. 'Channel'] = r.channel.value\n    end\n    if r.transmit_power and r.transmit_power.value ~= nil then\n      local raw = trim_suffix(r.transmit_power.value, '%')\n      local n = tonumber(raw)\n      if n ~= nil then\n        values[path .. 'TransmitPower'] = math.floor(n)\n      end\n    end\n  end\n  return values\nend\n\n-- Wi-Fi SSID\nfunction get_ssid(...)\n  return {\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.',\n    'InternetGatewayDevice.X_ZYXEL_EXT.X_ZYXEL_ONESSID.Enable',\n  }\nend\n\nfunction parse_ssid(response)\n  local ssids = {}\n  local ports_wlan_tmp = {}\n  local band_steering_enabled = false\n\n  for _, param in ipairs((response and response.list) or {}) do\n    local name = param.name or ''\n    if name == 'InternetGatewayDevice.X_ZYXEL_EXT.X_ZYXEL_ONESSID.Enable' then\n      band_steering_enabled = bool_val(param.value)\n    else\n      local wlan_number, param_type = name:match('^InternetGatewayDevice%.LANDevice%.1%.WLANConfiguration%.(%d+)%.(.+)$')\n      if wlan_number and param_type then\n        wlan_number = tonumber(wlan_number)\n        ports_wlan_tmp[wlan_number] = ports_wlan_tmp[wlan_number] or {}\n        ports_wlan_tmp[wlan_number][param_type] = param.value\n      end\n    end\n  end\n\n  for idx, wlan in pairs(ports_wlan_tmp) do\n    local channel = to_int(wlan['Channel'], 0) or 0\n    local radio_frequency = '2.4GHz'\n    if channel > 0 and channel <= 14 then\n      radio_frequency = '2.4GHz'\n    elseif channel >= 36 and channel <= 165 then\n      radio_frequency = '5GHz'\n    elseif channel >= 1 and channel <= 233 then\n      radio_frequency = '6GHz'\n    end\n\n    local ssid_name = tostring(wlan['Name'] or '')\n    local ssid_type = 'Unknown'\n    if ssid_name ~= '' and ssid_name:sub(-1) == '0' then\n      ssid_type = 'Primary'\n    else\n      ssid_type = 'Guest'\n    end\n\n    local beacon_type = wlan['BeaconType'] or ''\n    table.insert(ssids, {\n      ssid_path = 'InternetGatewayDevice.LANDevice.1.WLANConfiguration.' .. tostring(idx) .. '.',\n      band_steering = pd(false, band_steering_enabled),\n      name = pd(false, ssid_name .. ' ' .. (radio_frequency or '')),\n      type = pd(false, ssid_type),\n      ssid = pd(true, wlan['SSID']),\n      status = pd(false, wlan['Status']),\n      enable = pd(true, bool_val(wlan['Enable'])),\n      ssid_advertisement_enabled = pd(false, bool_val(wlan['SSIDAdvertisementEnabled'])),\n      has_band_steering = pd(false, true),\n      bytes_received = pd(false, wlan['TotalBytesReceived']),\n      bytes_sent = pd(false, wlan['TotalBytesSent']),\n      mac_address = pd(false, wlan['BSSID']),\n      security = {\n        security_modes_supported = pd(false, { 'None', 'WPA2', 'WPA2/WPA3' }),\n        security_mode_enabled = pd(true, translate_beacon_type_to_human(beacon_type)),\n        password = pd(is_password_writable(beacon_type), nil),\n      },\n    })\n  end\n\n  table.sort(ssids, function(a, b)\n    local ta = a.type and a.type.value or ''\n    local tb = b.type and b.type.value or ''\n    if ta == 'Primary' and tb ~= 'Primary' then\n      return true\n    end\n    if ta ~= 'Primary' and tb == 'Primary' then\n      return false\n    end\n    return (a.ssid_path or '') < (b.ssid_path or '')\n  end)\n\n  return ssids\nend\n\nfunction set_ssid(ssids)\n  local values = {}\n  for _, s in ipairs(ssids or {}) do\n    local path = s.ssid_path or ''\n\n    if s.enable and s.enable.value ~= nil then\n      values[path .. 'Enable'] = s.enable.value\n    end\n\n    local path_for_ssid = path\n    if path_for_ssid == 'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.' then\n      path_for_ssid = 'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.'\n    end\n\n    if s.ssid and s.ssid.value ~= nil then\n      values[path_for_ssid .. 'SSID'] = s.ssid.value\n    end\n\n    if s.ssid_advertisement_enabled and s.ssid_advertisement_enabled.value ~= nil then\n      values[path_for_ssid .. 'SSIDAdvertisementEnabled'] = s.ssid_advertisement_enabled.value\n    end\n\n    if s.security and s.security.security_mode_enabled and s.security.security_mode_enabled.value ~= nil then\n      values[path_for_ssid .. 'BeaconType'] = translate_beacon_type_to_cwmp(s.security.security_mode_enabled.value)\n    end\n\n    if s.security and s.security.password and s.security.password.value ~= nil then\n      if s.security.password.value ~= '' then\n        values[path_for_ssid .. 'PreSharedKey.1.KeyPassphrase'] = s.security.password.value\n      end\n    end\n\n    if s.band_steering and s.band_steering.value ~= nil then\n      values['InternetGatewayDevice.X_ZYXEL_EXT.X_ZYXEL_ONESSID.Enable'] = s.band_steering.value\n    end\n  end\n  return values\nend\n\n-- Site Survey\nfunction get_site_survey_diagnostic_state(...)\n  return 'InternetGatewayDevice.X_ZYXEL_NeighboringWiFiDiagnostic.DiagnosticsState'\nend\n\nfunction get_site_survey_results(...)\n  return {\n    'InternetGatewayDevice.X_ZYXEL_NeighboringWiFiDiagnostic.Result.',\n  }\nend\n\nfunction parse_get_site_survey(response)\n  local site_survey = {}\n  local tmp = {}\n\n  for _, param in ipairs((response and response.list) or {}) do\n    local entry, param_type = (param.name or ''):match('^InternetGatewayDevice%.X_ZYXEL_NeighboringWiFiDiagnostic%.Result%.(%d+)%.(.+)$')\n    if entry and param_type then\n      entry = tonumber(entry)\n      tmp[entry] = tmp[entry] or {}\n      tmp[entry][param_type] = param.value\n    end\n  end\n\n  for _, params in pairs(tmp) do\n    local neighbor_site = {\n      signal_level = params['SignalStrength'],\n      ssid = params['SSID'],\n      channel = params['Channel'],\n      standard = params['OperatingStandards'],\n      bandwidth = trim_suffix(params['OperatingChannelBandwidth'] or '', 'MHz'),\n      bssid = params['BSSID'],\n    }\n\n    local channel = tonumber(params['Channel'])\n    if channel == nil then\n      return nil\n    end\n\n    local band_name = 'Unknown Frequency'\n    if channel > 0 and channel <= 14 then\n      band_name = '2.4GHz'\n    elseif channel >= 36 and channel <= 165 then\n      band_name = '5GHz'\n    end\n\n    site_survey[band_name] = site_survey[band_name] or {}\n    table.insert(site_survey[band_name], neighbor_site)\n  end\n\n  return site_survey\nend\n\n-- Connected devices\nfunction get_connected_devices(...)\n  return {\n    'InternetGatewayDevice.LANDevice.1.Hosts.Host.',\n  }\nend\n\nfunction parse_get_connected_devices(response)\n  local connected_devices = {}\n  local tmp = {}\n\n  for _, param in ipairs((response and response.list) or {}) do\n    local device_number, param_type = (param.name or ''):match('^InternetGatewayDevice%.LANDevice%.1%.Hosts%.Host%.(%d+)%.(.+)$')\n    if device_number and param_type then\n      device_number = tonumber(device_number)\n      tmp[device_number] = tmp[device_number] or {}\n      tmp[device_number][param_type] = param.value\n    end\n  end\n\n  for _, dev in pairs(tmp) do\n    local iface = 'Ethernet'\n    local l2 = dev['Layer2Interface'] or ''\n    if l2:find('InternetGatewayDevice.LANDevice.1.WLANConfiguration.1', 1, true) then\n      iface = '2.4GHz'\n    elseif l2:find('InternetGatewayDevice.LANDevice.1.WLANConfiguration.5', 1, true) then\n      iface = '5GHz'\n    end\n\n    local resource = {\n      mac = dev['MACAddress'],\n      ip_adress = dev['IPAddress'],\n      adress_source = dev['AddressSource'],\n      active = bool_val(dev['Active']),\n      hostname = dev['HostName'],\n      rssi = dev['X_ZYXEL_RSSI'],\n    }\n\n    connected_devices[iface] = connected_devices[iface] or {}\n    table.insert(connected_devices[iface], resource)\n  end\n\n  return {\n    model = model,\n    hostname = sn,\n    connected_devices = connected_devices,\n  }\nend\n\n-- Speedtest\nfunction parse_get_speed_test_result(speed_test_type, response)\n  local speed_test = {}\n  local param_map = response_param_map(response)\n\n  local required = { 'ROMTime', 'BOMTime', 'EOMTime', 'TotalBytesReceived' }\n  for _, key in ipairs(required) do\n    if param_map[key] == nil then\n      return nil, 'missing required parameter: ' .. key\n    end\n  end\n\n  speed_test.bytes_received = to_int(param_map['TotalBytesReceived'], 0)\n  if param_map['TotalBytesSent'] ~= nil then\n    speed_test.bytes_sent = to_int(param_map['TotalBytesSent'], 0)\n  end\n\n  local raw_eom = tostring(param_map['EOMTime'] or '')\n  if raw_eom ~= '' and raw_eom:sub(-1) ~= 'Z' then raw_eom = raw_eom .. 'Z' end\n  local raw_rom = tostring(param_map['ROMTime'] or '')\n  if raw_rom ~= '' and raw_rom:sub(-1) ~= 'Z' then raw_rom = raw_rom .. 'Z' end\n  local raw_bom = tostring(param_map['BOMTime'] or '')\n  if raw_bom ~= '' and raw_bom:sub(-1) ~= 'Z' then raw_bom = raw_bom .. 'Z' end\n\n  local eom = parse_iso_time(raw_eom)\n  if eom == nil then return nil, 'EOMTime parsing error' end\n  local rom = parse_iso_time(raw_rom)\n  if rom == nil then return nil, 'ROMTime parsing error' end\n  local bom = parse_iso_time(raw_bom)\n  if bom == nil then return nil, 'BOMTime parsing error' end\n\n  local rtt_elapsed = os.difftime(bom, rom)\n  if rtt_elapsed == 0 then\n    speed_test.rtt = '0'\n  else\n    speed_test.rtt = duration_string(rtt_elapsed)\n  end\n\n  local resp_elapsed = os.difftime(eom, rom)\n  if resp_elapsed == 0 then\n    speed_test.resp_time = '0'\n  else\n    speed_test.resp_time = duration_string(resp_elapsed)\n  end\n\n  local elapsed = os.difftime(eom, bom)\n  if elapsed == 0 then\n    speed_test.throughput = '0'\n  else\n    if speed_test_type == 'upload' then\n      if param_map['TotalBytesSent'] ~= nil then\n        speed_test.throughput = human_readable_bits(math.floor(8 * to_int(param_map['TotalBytesSent'], 0) / elapsed))\n      else\n        speed_test.throughput = '0'\n      end\n    else\n      speed_test.throughput = human_readable_bits(math.floor(8 * speed_test.bytes_received / elapsed))\n    end\n  end\n\n  return speed_test, nil\nend\n\nfunction get_speed_test_result(speed_test_type)\n  local prefix = 'InternetGatewayDevice.DownloadDiagnostics.'\n  if speed_test_type == 'upload' then\n    prefix = 'InternetGatewayDevice.UploadDiagnostics.'\n  end\n  return {\n    prefix .. 'ROMTime',\n    prefix .. 'BOMTime',\n    prefix .. 'EOMTime',\n    prefix .. 'TotalBytesReceived',\n    prefix .. 'TotalBytesSent',\n    prefix .. 'DiagnosticsState',\n  }\nend\n\nfunction get_wan_options(...)\n  return {\n    { path = 'InternetGatewayDevice.WANDevice.1.', type = 'Ethernet' },\n    { path = 'InternetGatewayDevice.WANDevice.2.', type = 'xDSL' },\n    { path = 'InternetGatewayDevice.WANDevice.3.', type = 'xDSL' },\n    { path = 'InternetGatewayDevice.WANDevice.4.', type = '3G' },\n  }\nend\n\nfunction set_speed_test(st)\n  local test = st or {}\n  local values = {}\n  if test.type == 'upload' then\n    if test.url and test.url ~= '' then\n      values['InternetGatewayDevice.UploadDiagnostics.UploadURL'] = test.url\n    end\n    values['InternetGatewayDevice.UploadDiagnostics.DiagnosticsState'] = 'Requested'\n    values['InternetGatewayDevice.UploadDiagnostics.TestFileLength'] = 209715200\n    values['InternetGatewayDevice.UploadDiagnostics.NumberOfConnections'] = 3\n  else\n    if test.url and test.url ~= '' then\n      values['InternetGatewayDevice.DownloadDiagnostics.DownloadURL'] = test.url\n    end\n    if test.interface and test.interface ~= '' then\n      values['InternetGatewayDevice.DownloadDiagnostics.Interface'] = test.interface\n    end\n    values['InternetGatewayDevice.DownloadDiagnostics.DiagnosticsState'] = 'Requested'\n  end\n  return values\nend\n\nfunction get_download_diagnostic_state(...)\n  return 'InternetGatewayDevice.DownloadDiagnostics.DiagnosticsState'\nend\n\nfunction get_upload_diagnostic_state(...)\n  return 'InternetGatewayDevice.UploadDiagnostics.DiagnosticsState'\nend\n\n-- Statistics unsupported\nfunction get_statistics(...) return nil end\nfunction parse_get_statistics(response) return {} end\n\n-- Interfaces (TR-098)\nfunction get_interface_wan(...)\n  return {\n    'InternetGatewayDevice.WANDevice.',\n  }\nend\n\nfunction parse_get_interface_wan(response)\n  local ports_wan = {}\n  local ports_wan_tmp = {}\n\n  for _, param in ipairs((response and response.list) or {}) do\n    local name = param.name or ''\n    local wan_dev, wan_conn_dev, conn_type, conn_idx, parameter =\n      name:match('^InternetGatewayDevice%.WANDevice%.(%d+)%.WANConnectionDevice%.(%d+)%.(WANPPPConnection|WANIPConnection)%.(%d+)%.(.+)$')\n    if wan_dev and wan_conn_dev and conn_type and conn_idx and parameter then\n      local wan_path = 'InternetGatewayDevice.WANDevice.' .. wan_dev\n        .. '.WANConnectionDevice.' .. wan_conn_dev\n        .. '.' .. conn_type .. '.' .. conn_idx .. '.'\n      ports_wan_tmp[wan_path] = ports_wan_tmp[wan_path] or {}\n      ports_wan_tmp[wan_path][parameter] = param.value\n    end\n  end\n\n  if next(ports_wan_tmp) == nil then\n    return ports_wan\n  end\n\n  local idx = 0\n  for path, param in pairs(ports_wan_tmp) do\n    local conn_name = param['Name']\n    if conn_name == nil or conn_name == '' then\n      conn_name = 'Connection ' .. tostring(idx)\n    end\n\n    local vlan_id = to_int(param['X_ZYXEL_VlanMuxID'], nil)\n    if vlan_id == -1 then\n      vlan_id = nil\n    end\n\n    ports_wan[path] = {\n      path = path,\n      enable = pd(true, bool_val(param['Enable'])),\n      alias = pd(false, 'Logical WAN Connection ' .. tostring(idx)),\n      upstream = pd(false, true),\n      mac_address = pd(false, param['MACAddress']),\n      status = pd(false, param['ConnectionStatus']),\n      tx = pd(false, to_int(param['Stats.EthernetBytesSent'], 0)),\n      rx = pd(false, to_int(param['Stats.EthernetBytesReceived'], 0)),\n      ip = {\n        {\n          path = path,\n          enable = pd(true, tostring(param['Enable'] or '') == '1'),\n          name = pd(false, conn_name),\n          ipv4 = {\n            enable = pd(true, bool_val(param['X_ZYXEL_IPv4Enable'])),\n            origin = pd(false, param['AddressingType']),\n            ip_address = pd(false, param['ExternalIPAddress']),\n            gateway = pd(false, param['DefaultGateway']),\n            dns_servers = {\n              dns_servers = pd(false, param['DNSServers']),\n            },\n          },\n          pppoe = {\n            path = (get_ip_origin(param['AddressingType']) == 'PPPoE') and '-' or '',\n            connection_status = pd(false, param['ConnectionStatus']),\n            username = pd(true, param['Username']),\n            password = pd(true, param['Password']),\n          },\n          vlan = {\n            path = '-',\n            enable = pd(true, bool_val(param['X_ZYXEL_VlanEnable'])),\n            id = pd(true, vlan_id),\n          },\n          ipv6 = {\n            enable = pd(true, tostring(param['X_ZYXEL_IPv6Enable'] or '') == '1'),\n            prefix = pd(false, param['X_ZYXEL_SPIPv6Prefix']),\n            dns_servers = {\n              dns_servers = pd(false, param['X_ZYXEL_IPv6DNSServers']),\n            },\n          },\n        },\n      },\n    }\n    idx = idx + 1\n  end\n\n  return ports_wan\nend\n\nfunction get_interface_lan(...)\n  return {\n    'InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.',\n  }\nend\n\nfunction parse_get_interface_lan(response)\n  local ports_lan = {}\n  local ports_lan_tmp = {}\n\n  for _, param in ipairs((response and response.list) or {}) do\n    local lan_number, param_type = (param.name or ''):match('^InternetGatewayDevice%.LANDevice%.1%.LANEthernetInterfaceConfig%.(%d+)%.(.+)$')\n    if lan_number and param_type then\n      lan_number = tonumber(lan_number)\n      ports_lan_tmp[lan_number] = ports_lan_tmp[lan_number] or {}\n      ports_lan_tmp[lan_number][param_type] = param.value\n    end\n  end\n\n  for lan_number, port in pairs(ports_lan_tmp) do\n    local key = port['Name'] or ('LAN ' .. tostring(lan_number))\n    ports_lan[key] = {\n      path = 'InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.' .. tostring(lan_number) .. '.',\n      enable = pd(false, tostring(port['Enable'] or '') == '1'),\n      alias = pd(false, 'LAN ' .. tostring(lan_number)),\n      upstream = pd(false, false),\n      mac_address = pd(false, port['MACAddress']),\n      status = pd(false, port['Status']),\n      tx = pd(false, to_int(port['Stats.BytesSent'], 0)),\n      rx = pd(false, to_int(port['Stats.BytesReceived'], 0)),\n      stats = {\n        bytes_sent = to_uint64(port['Stats.BytesSent']),\n        bytes_received = to_uint64(port['Stats.BytesReceived']),\n        packets_sent = to_uint64(port['Stats.PacketsSent']),\n        packets_received = to_uint64(port['Stats.PacketsReceived']),\n        errors_sent = to_uint64(port['Stats.ErrorsSent']),\n        errors_received = to_uint64(port['Stats.ErrorsReceived']),\n        discard_packets_sent = to_uint64(port['Stats.DiscardPacketsSent']),\n        discard_packets_received = to_uint64(port['Stats.DiscardPacketsReceived']),\n        unicast_packets_sent = to_uint64(port['Stats.UnicastPacketsSent']),\n        unicast_packets_received = to_uint64(port['Stats.UnicastPacketsReceived']),\n        multicast_packets_sent = to_uint64(port['Stats.MulticastPacketsSent']),\n        multicast_packets_received = to_uint64(port['Stats.MulticastPacketsReceived']),\n        broadcast_packets_sent = to_uint64(port['Stats.BroadcastPacketsSent']),\n        broadcast_packets_received = to_uint64(port['Stats.BroadcastPacketsReceived']),\n        unknown_packets_received = to_uint64(port['Stats.UnknownProtoPacketsReceived']),\n      },\n    }\n  end\n\n  return ports_lan\nend\n\n-- Ports (TR-181 unsupported for get, but set/add supported as per Go)\nfunction get_port(...) return nil end\nfunction parse_get_port(response) return {} end\n\nfunction set_port(ports)\n  local parameters_to_set = {}\n\n  for port_name, port in pairs(ports or {}) do\n    local path = port.path or ''\n    if not port.ip or #port.ip == 0 then\n      return nil, 'error setting port, IP is not set for port ' .. tostring(port_name)\n    end\n\n    for _, ip in ipairs(port.ip) do\n      if ip.enable and ip.enable.value ~= nil then\n        table.insert(parameters_to_set, typed_param(path .. 'Enable', ip.enable.value, 'boolean'))\n      end\n      if ip.name and ip.name.value ~= nil then\n        table.insert(parameters_to_set, typed_param(path .. 'Name', ip.name.value, 'string'))\n      end\n      if ip.ipv4 and ip.ipv4.enable and ip.ipv4.enable.value ~= nil then\n        table.insert(parameters_to_set, typed_param(path .. 'X_ZYXEL_IPv4Enable', ip.ipv4.enable.value, 'boolean'))\n      end\n      if ip.ipv4 and ip.ipv4.ip_address and ip.ipv4.ip_address.value ~= nil then\n        table.insert(parameters_to_set, typed_param(path .. 'ExternalIPAddress', ip.ipv4.ip_address.value, 'string'))\n      end\n      if ip.ipv4 and ip.ipv4.dns_servers and ip.ipv4.dns_servers.dns_servers and ip.ipv4.dns_servers.dns_servers.value ~= nil then\n        table.insert(parameters_to_set, typed_param(path .. 'DNSServers', ip.ipv4.dns_servers.dns_servers.value, 'string'))\n      end\n      if ip.ipv4 and ip.ipv4.subnet_mask and ip.ipv4.subnet_mask.value ~= nil then\n        table.insert(parameters_to_set, typed_param(path .. 'SubnetMask', ip.ipv4.subnet_mask.value, 'string'))\n      end\n      if ip.ipv4 and ip.ipv4.gateway and ip.ipv4.gateway.value ~= nil then\n        table.insert(parameters_to_set, typed_param(path .. 'DefaultGateway', ip.ipv4.gateway.value, 'string'))\n      end\n      if ip.ipv6 and ip.ipv6.enable and ip.ipv6.enable.value ~= nil then\n        table.insert(parameters_to_set, typed_param(path .. 'X_ZYXEL_IPv6Enable', ip.ipv6.enable.value, 'boolean'))\n      end\n      if ip.pppoe and ip.pppoe.username and ip.pppoe.username.value ~= nil then\n        table.insert(parameters_to_set, typed_param(path .. 'Username', ip.pppoe.username.value, 'string'))\n      end\n      if ip.pppoe and ip.pppoe.password and ip.pppoe.password.value ~= nil then\n        table.insert(parameters_to_set, typed_param(path .. 'Password', ip.pppoe.password.value, 'string'))\n      end\n\n      if ip.vlan and ip.vlan.enable and ip.vlan.enable.value ~= nil then\n        if ip.vlan.enable.value then\n          if ip.vlan.id and ip.vlan.id.value ~= nil then\n            table.insert(parameters_to_set, typed_param(path .. 'X_ZYXEL_VlanMuxID', ip.vlan.id.value, 'int'))\n          end\n          table.insert(parameters_to_set, typed_param(path .. 'X_ZYXEL_VlanEnable', true, 'boolean'))\n        else\n          table.insert(parameters_to_set, typed_param(path .. 'X_ZYXEL_VlanEnable', false, 'boolean'))\n        end\n      else\n        if ip.vlan and ip.vlan.id and ip.vlan.id.value ~= nil then\n          table.insert(parameters_to_set, typed_param(path .. 'X_ZYXEL_VlanMuxID', ip.vlan.id.value, 'int'))\n        end\n      end\n    end\n  end\n\n  if #parameters_to_set == 0 then\n    return nil, 'error setting port, no parameters to set'\n  end\n\n  return parameters_to_set, nil\nend\n\nfunction add_port(port)\n  local parameters_to_set = {}\n  local new_port = port and port.ip and port.ip[1]\n  if not new_port then\n    return nil, 'error adding port, IP is not set'\n  end\n\n  local path = new_port.path or ''\n  local addressing_type = new_port.ipv4 and new_port.ipv4.origin and new_port.ipv4.origin.value or ''\n\n  if addressing_type == 'PPPoE' then\n    table.insert(parameters_to_set, typed_param(path .. 'Username', new_port.pppoe and new_port.pppoe.username and new_port.pppoe.username.value or '', 'string'))\n    table.insert(parameters_to_set, typed_param(path .. 'Password', new_port.pppoe and new_port.pppoe.password and new_port.pppoe.password.value or '', 'string'))\n\n  elseif addressing_type == 'DHCP' then\n    table.insert(parameters_to_set, typed_param(path .. 'AddressingType', 'DHCP', 'string'))\n\n  elseif addressing_type == 'Static' then\n    table.insert(parameters_to_set, typed_param(path .. 'AddressingType', 'Static', 'string'))\n\n    local ip_address = new_port.ipv4 and new_port.ipv4.ip_address and new_port.ipv4.ip_address.value or ''\n    if ip_address == '' or not is_valid_ipv4(ip_address) then\n      return nil, 'error adding port, IP address is not valid'\n    end\n    table.insert(parameters_to_set, typed_param(path .. 'ExternalIPAddress', ip_address, 'string'))\n\n    local subnet_mask = new_port.ipv4 and new_port.ipv4.subnet_mask and new_port.ipv4.subnet_mask.value or ''\n    if subnet_mask == '' or not is_valid_subnet_mask(subnet_mask) then\n      return nil, 'error adding port, subnet mask is not valid'\n    end\n    table.insert(parameters_to_set, typed_param(path .. 'SubnetMask', subnet_mask, 'string'))\n\n    local gateway = new_port.ipv4 and new_port.ipv4.gateway and new_port.ipv4.gateway.value or ''\n    if gateway ~= '' and is_valid_ipv4(gateway) then\n      table.insert(parameters_to_set, typed_param(path .. 'DefaultGateway', gateway, 'string'))\n    end\n\n    if gateway == ip_address then\n      return nil, 'error adding port, gateway cannot be the same as IP address'\n    end\n\n    if gateway ~= '' and not are_ips_in_same_subnet(gateway, ip_address, subnet_mask) then\n      return nil, 'error adding port, gateway is not in the same subnet as IP address'\n    end\n\n    local dns_servers = ''\n    if new_port.ipv4 and new_port.ipv4.dns_servers and new_port.ipv4.dns_servers.dns_servers then\n      dns_servers = new_port.ipv4.dns_servers.dns_servers.value or ''\n    end\n    if dns_servers ~= '' then\n      table.insert(parameters_to_set, typed_param(path .. 'DNSServers', dns_servers, 'string'))\n    end\n\n  else\n    return nil, 'error adding port, unsupported addressing type: ' .. tostring(addressing_type)\n  end\n\n  if new_port.ipv6 and new_port.ipv6.enable and new_port.ipv6.enable.value ~= nil then\n    table.insert(parameters_to_set, typed_param(path .. 'X_ZYXEL_IPv6Enable', new_port.ipv6.enable.value and true or false, 'boolean'))\n  end\n\n  if new_port.vlan and new_port.vlan.enable and new_port.vlan.enable.value ~= nil then\n    if new_port.vlan.enable.value then\n      local vlan = new_port.vlan.id and new_port.vlan.id.value or nil\n      if vlan == nil or vlan <= 0 or vlan > 4094 then\n        return nil, 'error adding port, VLAN ID is not valid'\n      end\n      table.insert(parameters_to_set, typed_param(path .. 'X_ZYXEL_VlanEnable', true, 'boolean'))\n      table.insert(parameters_to_set, typed_param(path .. 'X_ZYXEL_VlanMuxID', vlan, 'int'))\n    else\n      table.insert(parameters_to_set, typed_param(path .. 'X_ZYXEL_VlanEnable', false, 'boolean'))\n    end\n  else\n    table.insert(parameters_to_set, typed_param(path .. 'X_ZYXEL_VlanEnable', false, 'boolean'))\n  end\n\n  table.insert(parameters_to_set, typed_param(path .. 'X_ZYXEL_IPv4Enable', true, 'boolean'))\n\n  return parameters_to_set, nil\nend\n\n-- Bridge\nfunction get_bridge(...) return get_bridge_common() end\nfunction parse_get_bridge(response) return parse_get_bridge_common(response) end\nfunction set_bridge(bridges) return set_bridge_common(bridges) end\n\n-- Ping\nfunction get_ping(...)\n  return {\n    'InternetGatewayDevice.IPPingDiagnostics.Interface',\n    'InternetGatewayDevice.IPPingDiagnostics.Timeout',\n    'InternetGatewayDevice.IPPingDiagnostics.Host',\n    'InternetGatewayDevice.IPPingDiagnostics.NumberOfRepetitions',\n    'InternetGatewayDevice.IPPingDiagnostics.DataBlockSize',\n    'InternetGatewayDevice.IPPingDiagnostics.FailureCount',\n    'InternetGatewayDevice.IPPingDiagnostics.SuccessCount',\n    'InternetGatewayDevice.IPPingDiagnostics.AverageResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.MinimumResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.MaximumResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.DiagnosticsState',\n  }\nend\n\nfunction parse_get_ping(response)\n  return parse_get_ping_common(response)\nend\n\nfunction get_ping_diagnostic_state(...)\n  return 'InternetGatewayDevice.IPPingDiagnostics.DiagnosticsState'\nend\n\nfunction set_ping(ping)\n  local data_block_size = ping and ping.data_block_size and ping.data_block_size.value or nil\n  if data_block_size == nil or data_block_size == 0 then\n    data_block_size = 32\n  end\n\n  return {\n    ['InternetGatewayDevice.IPPingDiagnostics.Interface'] = ping.interface.value,\n    ['InternetGatewayDevice.IPPingDiagnostics.Timeout'] = (ping.timeout.value or 0) * 1000,\n    ['InternetGatewayDevice.IPPingDiagnostics.Host'] = ping.host.value,\n    ['InternetGatewayDevice.IPPingDiagnostics.NumberOfRepetitions'] = ping.number_of_repetitions.value,\n    ['InternetGatewayDevice.IPPingDiagnostics.DiagnosticsState'] = 'Requested',\n    ['InternetGatewayDevice.IPPingDiagnostics.DataBlockSize'] = data_block_size,\n  }\nend\n\nfunction get_ping_result(...)\n  return {\n    'InternetGatewayDevice.IPPingDiagnostics.FailureCount',\n    'InternetGatewayDevice.IPPingDiagnostics.SuccessCount',\n    'InternetGatewayDevice.IPPingDiagnostics.AverageResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.MinimumResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.MaximumResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.DiagnosticsState',\n  }\nend\n\nfunction parse_get_ping_result(response)\n  return parse_get_ping_result_common(response)\nend\n\n-- Traceroute\nfunction get_traceroute(...)\n  return {\n    'InternetGatewayDevice.TraceRouteDiagnostics.Interface',\n    'InternetGatewayDevice.TraceRouteDiagnostics.Timeout',\n    'InternetGatewayDevice.TraceRouteDiagnostics.Host',\n    'InternetGatewayDevice.TraceRouteDiagnostics.NumberOfTries',\n    'InternetGatewayDevice.TraceRouteDiagnostics.MaxHopCount',\n  }\nend\n\nfunction parse_get_traceroute(response)\n  local list = (response and response.list) or {}\n  if #list < 5 then\n    return nil\n  end\n  local timeout = to_int(list[2].value, 30000)\n  local number_of_tries = to_int(list[4].value, 0)\n  local max_hop_count = to_int(list[5].value, 0)\n  return {\n    interface = pd(false, list[1].value),\n    timeout = pd(true, math.floor(timeout / 1000)),\n    host = pd(true, list[3].value),\n    number_of_tries = pd(true, number_of_tries),\n    max_hop_count = pd(true, max_hop_count),\n  }\nend\n\nfunction get_traceroute_diagnostic_state(...)\n  return 'InternetGatewayDevice.TraceRouteDiagnostics.DiagnosticsState'\nend\n\nfunction set_traceroute(traceroute)\n  return {\n    ['InternetGatewayDevice.TraceRouteDiagnostics.Timeout'] = traceroute.timeout.value,\n    ['InternetGatewayDevice.TraceRouteDiagnostics.Host'] = traceroute.host.value,\n    ['InternetGatewayDevice.TraceRouteDiagnostics.NumberOfTries'] = traceroute.number_of_tries.value,\n    ['InternetGatewayDevice.TraceRouteDiagnostics.MaxHopCount'] = traceroute.max_hop_count.value,\n    ['InternetGatewayDevice.TraceRouteDiagnostics.DiagnosticsState'] = 'Requested',\n  }\nend\n\nfunction get_traceroute_result_number_of_hops(...)\n  return 'InternetGatewayDevice.TraceRouteDiagnostics.RouteHopsNumberOfEntries'\nend\n\nfunction get_traceroute_result(number_of_hops)\n  local params = {\n    'InternetGatewayDevice.TraceRouteDiagnostics.DiagnosticsState',\n    'InternetGatewayDevice.TraceRouteDiagnostics.ResponseTime',\n    'InternetGatewayDevice.TraceRouteDiagnostics.RouteHopsNumberOfEntries',\n  }\n  for i = 1, (number_of_hops or 0) do\n    local entry = tostring(i)\n    params[#params + 1] = 'InternetGatewayDevice.TraceRouteDiagnostics.RouteHops.' .. entry .. '.HopHost'\n    params[#params + 1] = 'InternetGatewayDevice.TraceRouteDiagnostics.RouteHops.' .. entry .. '.HopRTTimes'\n    params[#params + 1] = 'InternetGatewayDevice.TraceRouteDiagnostics.RouteHops.' .. entry .. '.HopHostAddress'\n  end\n  return params\nend\n\nfunction parse_get_traceroute_result(response)\n  local list = (response and response.list) or {}\n  if #list < 3 then\n    return nil\n  end\n  local result = {}\n  local diagnostic_state = list[1].value or ''\n  if diagnostic_state == 'Error_CannotResolveHostName' then\n    result.result = 'Cannot resolve host name'\n  elseif diagnostic_state == 'Error_MaxHopCountExceeded' then\n    result.result = 'Max hop count exceeded'\n  elseif diagnostic_state == 'Requested' then\n    result.result = 'In progress'\n  elseif diagnostic_state == 'Complete' then\n    result.result = 'Success'\n  elseif diagnostic_state == 'None' then\n    result.result = 'None'\n  else\n    result.result = 'Success'\n  end\n\n  result.response_time = to_int(list[2].value, 0)\n  result.hop_count = to_int(list[3].value, 0)\n\n  local hops = {}\n  local index = 4\n  for i = 1, result.hop_count do\n    hops[i] = {\n      host = list[index] and list[index].value or nil,\n      rtt = list[index + 1] and list[index + 1].value or nil,\n      addr = list[index + 2] and list[index + 2].value or nil,\n    }\n    index = index + 3\n  end\n  result.hops = hops\n\n  return result\nend\n\n-- Hardware info / PON\nfunction get_hwinfo(...)\n  return {\n    'InternetGatewayDevice.DeviceInfo.UpTime',\n    'InternetGatewayDevice.DeviceInfo.MemoryStatus.Total',\n    'InternetGatewayDevice.DeviceInfo.MemoryStatus.Free',\n    'InternetGatewayDevice.DeviceInfo.ProcessStatus.CPUUsage',\n    'InternetGatewayDevice.DeviceInfo.HardwareVersion',\n  }\nend\n\nfunction parse_get_hwinfo(response)\n  local uptime = 0\n  local hw_version = ''\n  local mem_total = 0\n  local mem_free = 0\n  local cpu_usage = 0\n\n  for _, param in ipairs((response and response.list) or {}) do\n    local name = param.name or ''\n    local value = param.value\n    if name == 'InternetGatewayDevice.DeviceInfo.UpTime' then\n      uptime = to_uint64(value)\n    elseif name == 'InternetGatewayDevice.DeviceInfo.MemoryStatus.Total' then\n      mem_total = to_uint64(value)\n    elseif name == 'InternetGatewayDevice.DeviceInfo.MemoryStatus.Free' then\n      mem_free = to_uint64(value)\n    elseif name == 'InternetGatewayDevice.DeviceInfo.ProcessStatus.CPUUsage' then\n      cpu_usage = tonumber(value) or 0\n    elseif name == 'InternetGatewayDevice.DeviceInfo.HardwareVersion' then\n      hw_version = value or ''\n    end\n  end\n\n  local mem_use = mem_total - mem_free\n  if mem_use < 0 then mem_use = 0 end\n  local memory_usage = 0\n  if mem_total > 0 then\n    memory_usage = tonumber(string.format('%.2f', (mem_use * 100) / mem_total)) or 0\n  end\n\n  return {\n    uptime = uptime,\n    hw_version = hw_version,\n    memory_total = mem_total,\n    memory_free = mem_free,\n    memory_use = mem_use,\n    memory_usage = memory_usage,\n    cpu_usage = cpu_usage,\n  }\nend\n\nfunction get_pon(...) return nil end\nfunction parse_get_pon(response) return {} end\n\n-- Voice\nfunction get_voice(...)\n  return {\n    'InternetGatewayDevice.Services.VoiceService.1.',\n  }\nend\n\nfunction parse_get_voice(response)\n  return parse_get_voice_common(response)\nend\n\nfunction set_voice(voice)\n  return set_voice_common(voice), nil\nend\n\nfunction set_line(line)\n  return set_voice_line_common(line), nil\nend\n\n-- Cellular unsupported\nfunction get_cellular(...) return nil end\nfunction parse_get_cellular(response) return '[]' end\nfunction set_cellular(cellular) return nil end\n\n-- xDSL\nfunction get_xdsl(...)\n  return {\n    'InternetGatewayDevice.WANDevice.3.WANDSLInterfaceConfig.Enable',\n    'InternetGatewayDevice.WANDevice.3.WANDSLInterfaceConfig.Status',\n    'InternetGatewayDevice.WANDevice.3.WANDSLInterfaceConfig.UpstreamCurrRate',\n    'InternetGatewayDevice.WANDevice.3.WANDSLInterfaceConfig.DownstreamCurrRate',\n    'InternetGatewayDevice.WANDevice.3.WANDSLInterfaceConfig.UpstreamMaxRate',\n    'InternetGatewayDevice.WANDevice.3.WANDSLInterfaceConfig.DownstreamMaxRate',\n    'InternetGatewayDevice.WANDevice.3.WANDSLInterfaceConfig.ModulationType',\n  }\nend\n\nfunction parse_xdsl(response)\n  local xdsl = {}\n\n  for _, param in ipairs((response and response.list) or {}) do\n    local name = param.name or ''\n    local value = param.value\n    if name == 'InternetGatewayDevice.WANDevice.3.WANDSLInterfaceConfig.Enable' then\n      xdsl.enable = pd(false, bool_val(value))\n    elseif name == 'InternetGatewayDevice.WANDevice.3.WANDSLInterfaceConfig.Status' then\n      xdsl.status = pd(false, value)\n    elseif name == 'InternetGatewayDevice.WANDevice.3.WANDSLInterfaceConfig.UpstreamCurrRate' then\n      xdsl.upstream_rate = pd(false, to_int(value, 0))\n    elseif name == 'InternetGatewayDevice.WANDevice.3.WANDSLInterfaceConfig.DownstreamCurrRate' then\n      xdsl.downstream_rate = pd(false, to_int(value, 0))\n    elseif name == 'InternetGatewayDevice.WANDevice.3.WANDSLInterfaceConfig.UpstreamMaxRate' then\n      xdsl.upstream_max_rate = pd(false, to_int(value, 0))\n    elseif name == 'InternetGatewayDevice.WANDevice.3.WANDSLInterfaceConfig.DownstreamMaxRate' then\n      xdsl.downstream_max_rate = pd(false, to_int(value, 0))\n    elseif name == 'InternetGatewayDevice.WANDevice.3.WANDSLInterfaceConfig.ModulationType' then\n      xdsl.modulation_type = pd(false, value)\n    end\n  end\n\n  return { xdsl }\nend\n"
