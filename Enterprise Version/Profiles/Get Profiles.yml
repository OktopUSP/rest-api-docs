                  "content": "-- model:FAST3896\n-- protocol:cwmp\n\n-- Helpers\nlocal function trim(s)\n  return (s:gsub('^%s+', ''):gsub('%s+$', ''))\nend\n\nlocal function split(s, sep)\n  local t = {}\n  if s == nil or s == '' then\n    return t\n  end\n  sep = sep or ','\n  local pattern = '([^' .. sep .. ']+)'\n  for part in string.gmatch(s, pattern) do\n    t[#t+1] = trim(part)\n  end\n  return t\nend\n\nlocal function split_int(s, sep)\n  local out = {}\n  for _, v in ipairs(split(s, sep)) do\n    local n = tonumber(v)\n    if n ~= nil then\n      out[#out+1] = n\n    end\n  end\n  return out\nend\n\nlocal function trim_prefix(value, prefix)\n  if value == nil then\n    return nil\n  end\n  if value:sub(1, #prefix) == prefix then\n    return value:sub(#prefix + 1)\n  end\n  return value\nend\n\nlocal function trim_suffix(value, suffix)\n  if value == nil then\n    return nil\n  end\n  if value:sub(-#suffix) == suffix then\n    return value:sub(1, #value - #suffix)\n  end\n  return value\nend\n\nlocal function bool_val(v)\n  if v == nil then\n    return false\n  end\n  if type(v) == 'boolean' then\n    return v\n  end\n  local s = tostring(v):lower()\n  if s == '1' or s == 'true' then\n    return true\n  end\n  if s == '0' or s == 'false' then\n    return false\n  end\n  return false\nend\n\nlocal function to_int(v, default)\n  local n = tonumber(v)\n  if n == nil then\n    return default\n  end\n  return math.floor(n)\nend\n\nlocal function to_uint64(v)\n  local n = tonumber(v)\n  if n == nil or n < 0 then\n    return 0\n  end\n  return math.floor(n)\nend\n\nlocal function pd(writable, value)\n  return { writable = writable, value = value }\nend\n\nlocal function response_param_map(response)\n  local param_map = {}\n  local list = response and response.list or {}\n  for _, param in ipairs(list) do\n    local name = param.name or ''\n    local value = param.value\n    local last = name:match('([^.]+)$') or name\n    param_map[last] = value\n  end\n  return param_map\nend\n\nlocal function format_transmit_power_supported(raw)\n  if raw == nil then\n    return nil\n  end\n  local out = {}\n  for _, power in ipairs(split(raw, ',')) do\n    if power == '-1' then\n      out[#out+1] = 'Auto'\n    else\n      out[#out+1] = power .. '%'\n    end\n  end\n  return out\nend\n\nlocal function translate_beacon_type_to_human(value)\n  if value == '11i' then\n    return 'WPA2'\n  elseif value == 'WPAand11i' then\n    return 'WPA/WPA2'\n  elseif value == '11iandWPA3' then\n    return 'WPA2/WPA3'\n  end\n  return value\nend\n\nlocal function translate_beacon_type_to_cwmp(value)\n  if value == 'WPA2' then\n    return '11i'\n  elseif value == 'WPA/WPA2' then\n    return 'WPAand11i'\n  elseif value == 'WPA2/WPA3' then\n    return '11iandWPA3'\n  end\n  return value\nend\n\nlocal function is_password_writable(beacon_type)\n  return not (beacon_type == 'Basic' or beacon_type == 'None')\nend\n\nlocal function duration_string(seconds)\n  if seconds == nil then\n    return ''\n  end\n  local total = math.floor(seconds)\n  if total < 60 then\n    return string.format('%ds', total)\n  end\n  local mins = math.floor(total / 60)\n  local secs = total - mins * 60\n  if mins < 60 then\n    return string.format('%dm%ds', mins, secs)\n  end\n  local hours = math.floor(mins / 60)\n  mins = mins - hours * 60\n  return string.format('%dh%dm%ds', hours, mins, secs)\nend\n\nlocal function human_readable_bits(bits)\n  local sizes = { 'bits p/s', 'Kbps', 'Mbps', 'Gbps', 'Tbps', 'Pbps', 'Ebps' }\n  local value = bits\n  local i = 1\n  while value >= 1000 and i < #sizes do\n    value = value / 1000\n    i = i + 1\n  end\n  return string.format('%.2f%s', value, sizes[i])\nend\n\nlocal function parse_iso_time(raw)\n  if raw == nil then\n    return nil\n  end\n  if raw:sub(-1) == 'Z' then\n    raw = raw:sub(1, -2)\n  end\n  local y, mo, d, h, mi, s = raw:match('^(%d+)%-(%d+)%-(%d+)T(%d+):(%d+):(%d+)')\n  if not y then\n    return nil\n  end\n  return os.time({ year = tonumber(y), month = tonumber(mo), day = tonumber(d), hour = tonumber(h), min = tonumber(mi), sec = tonumber(s) })\nend\n\nlocal function get_ip_origin(value)\n  if value == nil or value == '' then\n    return 'PPPoE'\n  end\n  return value\nend\n\nlocal function ip_attribute_is_writable(attribute)\n  return get_ip_origin(attribute) == 'Static'\nend\n\nlocal function parse_diagnostic_state(raw, failure_count)\n  if raw == 'Error_CannotResolveHostName' then\n    return 'Cannot resolve host name'\n  elseif raw == 'Error_MaxHopCountExceeded' then\n    return 'Max hop count exceeded'\n  elseif raw == 'Requested' or raw == 'Running' then\n    return 'In progress'\n  elseif raw == 'Complete' or raw == 'Completed' then\n    if failure_count > 0 then\n      return 'Failure'\n    end\n    return 'Success'\n  elseif raw == 'None' then\n    return 'None'\n  end\n  return 'Unknown'\nend\n\nlocal function ip_to_octets(ip)\n  if ip == nil then\n    return nil\n  end\n  local a, b, c, d = ip:match('^(%d+)%.(%d+)%.(%d+)%.(%d+)$')\n  if not a then\n    return nil\n  end\n  a, b, c, d = tonumber(a), tonumber(b), tonumber(c), tonumber(d)\n  if a > 255 or b > 255 or c > 255 or d > 255 then\n    return nil\n  end\n  return a, b, c, d\nend\n\nlocal function band(a, b)\n  local res = 0\n  local bit = 1\n  while a > 0 or b > 0 do\n    local a_bit = a % 2\n    local b_bit = b % 2\n    if a_bit == 1 and b_bit == 1 then\n      res = res + bit\n    end\n    a = math.floor(a / 2)\n    b = math.floor(b / 2)\n    bit = bit * 2\n  end\n  return res\nend\n\nlocal function is_valid_ipv4(ip)\n  return ip_to_octets(ip) ~= nil\nend\n\nlocal function is_valid_subnet_mask(mask)\n  local a, b, c, d = ip_to_octets(mask)\n  if not a then\n    return false\n  end\n  local mask_value = ((a * 256 + b) * 256 + c) * 256 + d\n  if mask_value == 0 then\n    return false\n  end\n  local inverted = 0xFFFFFFFF - mask_value + 1\n  if inverted == 0 then\n    return true\n  end\n  return band(inverted, inverted - 1) == 0\nend\n\nlocal function are_ips_in_same_subnet(ip1, ip2, mask)\n  local a1, b1, c1, d1 = ip_to_octets(ip1)\n  local a2, b2, c2, d2 = ip_to_octets(ip2)\n  local m1, m2, m3, m4 = ip_to_octets(mask)\n  if not a1 or not a2 or not m1 then\n    return false\n  end\n  return band(a1, m1) == band(a2, m1)\n    and band(b1, m2) == band(b2, m2)\n    and band(c1, m3) == band(c2, m3)\n    and band(d1, m4) == band(d2, m4)\nend\n\nlocal function wan_stats(ip_data)\n  return {\n    bytes_sent = to_uint64(ip_data['Stats.EthernetBytesSent']),\n    bytes_received = to_uint64(ip_data['Stats.EthernetBytesReceived']),\n    packets_sent = to_uint64(ip_data['Stats.EthernetPacketsSent']),\n    packets_received = to_uint64(ip_data['Stats.EthernetPacketsReceived']),\n    errors_sent = to_uint64(ip_data['Stats.EthernetErrorsSent']),\n    errors_received = to_uint64(ip_data['Stats.EthernetErrorsReceived']),\n    discard_packets_sent = to_uint64(ip_data['Stats.EthernetDiscardPacketsSent']),\n    discard_packets_received = to_uint64(ip_data['Stats.EthernetDiscardPacketsReceived']),\n    unicast_packets_sent = to_uint64(ip_data['Stats.EthernetUnicastPacketsSent']),\n    unicast_packets_received = to_uint64(ip_data['Stats.EthernetUnicastPacketsReceived']),\n    multicast_packets_sent = to_uint64(ip_data['Stats.EthernetMulticastPacketsSent']),\n    multicast_packets_received = to_uint64(ip_data['Stats.EthernetMulticastPacketsReceived']),\n    broadcast_packets_sent = to_uint64(ip_data['Stats.EthernetBroadcastPacketsSent']),\n    broadcast_packets_received = to_uint64(ip_data['Stats.EthernetBroadcastPacketsReceived']),\n    unknown_packets_received = to_uint64(ip_data['Stats.EthernetUnknownProtoPacketsReceived']),\n  }\nend\n\n-- Model identity and capabilities\nfunction get_vendor() return 'Sagemcom' end\nfunction get_data_model() return 'TR-181' end\nfunction get_device_specs() return { TimeTraceRoute = 3 } end\nfunction get_device_capabilities()\n  return {\n    Radio = true,\n    Ssid = true,\n    SiteSurvey = true,\n    SpeedTest = true,\n    DownloadSpeedTest = true,\n    UploadSpeedTest = false,\n    Diagnostic = true,\n    Ping = true,\n    Traceroute = true,\n    Reboot = true,\n    ConnectedDevices = true,\n    Interfaces = true,\n    Ports = true,\n    Wan = true,\n  }\nend\nfunction is_real_time() return false end\n\nlocal function format_transmit_power(raw)\n  if raw == nil then\n    return nil\n  end\n  if raw == '-1' then\n    return 'Auto'\n  end\n  return raw .. '%'\nend\n\nlocal function format_supported_operating_channel_bandwidths(items)\n  local out = {}\n  for _, bw in ipairs(items or {}) do\n    local trimmed = trim(bw)\n    if trimmed ~= '' then\n      if trimmed == 'AUTO' then\n        out[#out + 1] = 'Auto'\n      elseif trimmed:sub(-3) == 'MHz' then\n        out[#out + 1] = trimmed\n      else\n        out[#out + 1] = trimmed .. 'MHz'\n      end\n    end\n  end\n  if #out == 0 then\n    return { 'Auto' }\n  end\n  return out\nend\n\nlocal function format_ssid_name(alias, lower_layers, radio_frequency_band)\n  if alias == nil then\n    return nil\n  end\n  local key\n  if lower_layers and lower_layers:sub(-1) == '.' then\n    key = lower_layers .. 'OperatingFrequencyBand'\n  else\n    key = tostring(lower_layers or '') .. '.OperatingFrequencyBand'\n  end\n  local band = radio_frequency_band and radio_frequency_band[key] or nil\n  if band == nil or band == '' then\n    return alias\n  end\n  return alias .. '_' .. band\nend\n\n-- WiFi Radio\nfunction get_radio()\n  return { 'Device.WiFi.Radio.' }\nend\n\nfunction parse_radio(response)\n  local radios = {}\n  local ports_wlan_tmp = {}\n\n  for _, param in ipairs(response.list or {}) do\n    local radio_number, param_type = string.match(param.name or '', 'Device%.WiFi%.Radio%.(%d+)%.(.+)')\n    if radio_number then\n      radio_number = tonumber(radio_number)\n      ports_wlan_tmp[radio_number] = ports_wlan_tmp[radio_number] or {}\n      ports_wlan_tmp[radio_number][param_type] = param.value\n    end\n  end\n\n  for radio_number, params in pairs(ports_wlan_tmp) do\n    local channel = to_int(params['Channel'], 0)\n    local alias = params['Alias']\n    local current_bw = params['OperatingChannelBandwidth']\n    table.insert(radios, {\n      path = string.format('Device.WiFi.Radio.%d.', radio_number),\n      enable = pd(true, bool_val(params['Enable'])),\n      name = pd(true, alias),\n      auto_channel_enable = pd(true, bool_val(params['AutoChannelEnable'])),\n      channel = pd(true, channel),\n      possible_channels = pd(true, split_int(params['PossibleChannels'], ',')),\n      operating_channel_bandwidth = pd(true, current_bw),\n      supported_operating_channel_bandwidth = pd(false, format_supported_operating_channel_bandwidths(split(params['SupportedOperatingChannelBandwidths'], ','))),\n      operating_frequency_band = pd(false, params['OperatingFrequencyBand']),\n      supported_frequency_bands = pd(false, split(params['SupportedFrequencyBands'], ',')),\n      transmit_power = pd(true, format_transmit_power(params['TransmitPower'])),\n      transmit_power_supported = pd(true, format_transmit_power_supported(params['TransmitPowerSupported'])),\n      operating_standards = pd(true, split(params['OperatingStandards'], ',')),\n      supported_standards = pd(true, split(params['SupportedStandards'], ',')),\n    })\n  end\n\n  return radios\nend\n\nfunction set_radio(radios)\n  local values = {}\n  for _, r in ipairs(radios or {}) do\n    local path = r.path or ''\n\n    if r.enable and r.enable.value ~= nil then\n      values[#values + 1] = { name = path .. 'Enable', value = r.enable.value, type = 'boolean' }\n    end\n    if r.auto_channel_enable and r.auto_channel_enable.value ~= nil then\n      values[#values + 1] = { name = path .. 'AutoChannelEnable', value = r.auto_channel_enable.value, type = 'boolean' }\n    end\n    if r.channel and r.channel.value ~= nil then\n      values[#values + 1] = { name = path .. 'Channel', value = tostring(r.channel.value), type = 'unsignedint' }\n    end\n    if r.transmit_power and r.transmit_power.value ~= nil then\n      if r.transmit_power.value == 'Auto' then\n        values[#values + 1] = { name = path .. 'TransmitPower', value = -1, type = 'int' }\n      else\n        local tx = to_int(trim_suffix(r.transmit_power.value, '%'), 0)\n        values[#values + 1] = { name = path .. 'TransmitPower', value = tx, type = 'int' }\n      end\n    end\n    if r.operating_channel_bandwidth and r.operating_channel_bandwidth.value ~= nil then\n      local bw = r.operating_channel_bandwidth.value\n      if bw == 'Auto' then\n        bw = 'AUTO'\n      end\n      values[#values + 1] = { name = path .. 'OperatingChannelBandwidth', value = bw, type = 'string' }\n    end\n    if r.operating_standards and r.operating_standards.value ~= nil then\n      values[#values + 1] = { name = path .. 'OperatingStandards', value = table.concat(r.operating_standards.value, ','), type = 'string' }\n    end\n  end\n  return values\nend\n\n-- WiFi SSID\nfunction get_ssid()\n  return {\n    'Device.WiFi.SSID.',\n    'Device.WiFi.AccessPoint.',\n    'Device.WiFi.Radio.',\n  }\nend\n\nfunction parse_ssid(response)\n  local ssids = {}\n  local ssids_tmp = {}\n  local aps_tmp = {}\n  local radio_frequency_band = {}\n\n  for _, param in ipairs(response.list or {}) do\n    local name = param.name or ''\n\n    if string.find(name, '^Device%.WiFi%.AccessPoint%.') then\n      local aps_number, param_type = string.match(name, 'Device%.WiFi%.AccessPoint%.(%d+)%.(.+)')\n      if aps_number then\n        aps_number = tonumber(aps_number)\n        aps_tmp[aps_number] = aps_tmp[aps_number] or {}\n        aps_tmp[aps_number][param_type] = param.value\n      end\n    elseif string.find(name, '^Device%.WiFi%.Radio%.') and string.find(name, 'OperatingFrequencyBand') then\n      radio_frequency_band[name] = param.value\n    elseif string.find(name, '^Device%.WiFi%.SSID%.') then\n      local ssid_number, param_type = string.match(name, 'Device%.WiFi%.SSID%.(%d+)%.(.+)')\n      if ssid_number then\n        ssid_number = tonumber(ssid_number)\n        ssids_tmp[ssid_number] = ssids_tmp[ssid_number] or {}\n        ssids_tmp[ssid_number][param_type] = param.value\n      end\n    end\n  end\n\n  for ssid_number, params in pairs(ssids_tmp) do\n    local alias = params['Alias'] or ''\n    local ssid_type = (split(alias, '_')[2] or '')\n    if ssid_type == 'PRIV' then\n      ssid_type = 'Primary'\n    elseif ssid_type == 'GUEST' then\n      ssid_type = 'Guest'\n    elseif ssid_type == 'VIDEO' then\n      ssid_type = 'Video'\n    elseif ssid_type == 'HOSTPOT' then\n      ssid_type = 'Hotspot'\n    end\n\n    local lower = params['LowerLayers']\n    local composed_name = format_ssid_name(alias, lower, radio_frequency_band)\n\n    table.insert(ssids, {\n      type = pd(false, ssid_type),\n      ssid_path = string.format('Device.WiFi.SSID.%d.', ssid_number),\n      enable = pd(true, bool_val(params['Enable'])),\n      name = pd(true, composed_name),\n      mac_address = pd(false, params['MACAddress']),\n      ssid = pd(true, params['SSID']),\n      status = pd(false, params['Status']),\n      bytes_sent = pd(false, params['Stats.BytesSent']),\n      bytes_received = pd(false, params['Stats.BytesReceived']),\n      associated_radio = lower,\n      has_band_steering = pd(false, false),\n      security = {},\n    })\n  end\n\n  for aps_number, params in pairs(aps_tmp) do\n    local aps_path = string.format('Device.WiFi.AccessPoint.%d.', aps_number)\n    local ssid_ref = params['SSIDReference']\n    if ssid_ref then\n      if ssid_ref:sub(-1) ~= '.' then\n        ssid_ref = ssid_ref .. '.'\n      end\n      for i, ssid in ipairs(ssids) do\n        if ssid.ssid_path == ssid_ref then\n          ssids[i].ap_path = aps_path\n          ssids[i].ap_isolation = pd(true, bool_val(params['IsolationEnable']))\n          ssids[i].ssid_advertisement_enabled = pd(true, bool_val(params['SSIDAdvertisementEnabled']))\n          ssids[i].security = {\n            path = string.format('%sSecurity.', aps_path),\n            security_modes_supported = pd(false, split(params['Security.ModesSupported'], ',')),\n            security_mode_enabled = pd(true, params['Security.ModeEnabled']),\n            password = pd(true, ''),\n          }\n        end\n      end\n    end\n  end\n\n  return ssids\nend\n\nfunction set_ssid(ssids)\n  local values = {}\n  for _, s in ipairs(ssids or {}) do\n    local ssid_path = s.ssid_path or ''\n    local ap_path = s.ap_path or ''\n    local sec_path = (s.security and s.security.path) or ''\n\n    if s.enable and s.enable.value ~= nil then\n      values[ssid_path .. 'Enable'] = s.enable.value\n    end\n    if s.ssid and s.ssid.value ~= nil then\n      values[ssid_path .. 'SSID'] = s.ssid.value\n    end\n    if s.ssid_advertisement_enabled and s.ssid_advertisement_enabled.value ~= nil then\n      values[ap_path .. 'SSIDAdvertisementEnabled'] = s.ssid_advertisement_enabled.value\n    end\n    if s.ap_isolation and s.ap_isolation.value ~= nil then\n      values[ap_path .. 'IsolationEnable'] = s.ap_isolation.value\n    end\n    if s.security and s.security.security_mode_enabled and s.security.security_mode_enabled.value ~= nil then\n      values[sec_path .. 'ModeEnabled'] = s.security.security_mode_enabled.value\n    end\n    if s.security and s.security.password and s.security.password.value ~= nil and s.security.password.value ~= '' then\n      values[sec_path .. 'KeyPassphrase'] = s.security.password.value\n    end\n  end\n  return values\nend\n\n-- Site Survey\nfunction get_site_survey_diagnostic_state()\n  return 'Device.WiFi.NeighboringWiFiDiagnostic.DiagnosticsState'\nend\n\nfunction get_site_survey_results()\n  return { 'Device.WiFi.NeighboringWiFiDiagnostic.Result.' }\nend\n\nfunction parse_get_site_survey(response)\n  local site_survey = {}\n  local tmp = {}\n  for _, param in ipairs(response.list or {}) do\n    local entry, param_type = string.match(param.name or '', 'Device%.WiFi%.NeighboringWiFiDiagnostic%.Result%.(%d+)%.(.+)')\n    if entry then\n      entry = tonumber(entry)\n      tmp[entry] = tmp[entry] or {}\n      tmp[entry][param_type] = param.value\n    end\n  end\n\n  for _, params in pairs(tmp) do\n    local neighbor = {\n      signal_level = params['SignalStrength'],\n      ssid = params['SSID'],\n      channel = params['Channel'],\n      standard = params['OperatingStandards'],\n      bandwidth = trim_suffix(params['OperatingChannelBandwidth'] or '', 'MHz'),\n      bssid = params['BSSID'],\n    }\n\n    if params['Radio'] == 'Device/WiFi/Radios/Radio[RADIO2G4]' then\n      site_survey['2.4GHz'] = site_survey['2.4GHz'] or {}\n      table.insert(site_survey['2.4GHz'], neighbor)\n    elseif params['Radio'] == 'Device/WiFi/Radios/Radio[RADIO5G]' then\n      site_survey['5GHz'] = site_survey['5GHz'] or {}\n      table.insert(site_survey['5GHz'], neighbor)\n    elseif params['Radio'] == 'Device/WiFi/Radios/Radio[RADIO6G]' then\n      site_survey['6GHz'] = site_survey['6GHz'] or {}\n      table.insert(site_survey['6GHz'], neighbor)\n    else\n      site_survey['Unknown Frequency'] = site_survey['Unknown Frequency'] or {}\n      table.insert(site_survey['Unknown Frequency'], neighbor)\n    end\n  end\n\n  return site_survey\nend\n\n-- Connected Devices\nfunction get_connected_devices()\n  return {\n    'Device.WiFi.SSID.',\n    'Device.WiFi.Radio.',\n    'Device.WiFi.AccessPoint.',\n    'Device.Hosts.Host.',\n  }\nend\n\nfunction parse_get_connected_devices(response)\n  local tmp_connected_devices = {}\n  local tmp_devices_connected_to_ap = {}\n  local radio_frequency_band = {}\n  local ssid_association_to_radio = {}\n  local access_point_association_to_ssid = {}\n\n  for _, param in ipairs(response.list or {}) do\n    local name = param.name or ''\n\n    if string.find(name, '^Device%.WiFi%.AccessPoint%.') then\n      if string.find(name, 'SSIDReference$') then\n        local parameter_name = string.gsub(name, '%.SSIDReference$', '')\n        access_point_association_to_ssid[parameter_name] = param.value\n      elseif string.find(name, 'AssociatedDevice%.') then\n        local ap_id, device_number, param_name = string.match(name, 'Device%.WiFi%.AccessPoint%.(%d+)%.AssociatedDevice%.(%d+)%.(.+)')\n        if ap_id and device_number and param_name then\n          ap_id = tonumber(ap_id)\n          tmp_devices_connected_to_ap[ap_id] = tmp_devices_connected_to_ap[ap_id] or {}\n          tmp_devices_connected_to_ap[ap_id][param_name] = param.value\n        end\n      end\n    elseif string.find(name, '^Device%.WiFi%.SSID%.') and string.find(name, 'LowerLayers$') then\n      local parameter_name = string.gsub(name, '%.LowerLayers$', '')\n      ssid_association_to_radio[parameter_name] = param.value\n    elseif string.find(name, '^Device%.WiFi%.Radio%.') and string.find(name, 'OperatingFrequencyBand$') then\n      local parameter_name = string.gsub(name, '%.OperatingFrequencyBand$', '')\n      radio_frequency_band[parameter_name] = param.value\n    elseif string.find(name, '^Device%.Hosts%.Host%.') then\n      local host_number, param_name = string.match(name, 'Device%.Hosts%.Host%.(%d+)%.(.+)')\n      if host_number and param_name then\n        host_number = tonumber(host_number)\n        tmp_connected_devices[host_number] = tmp_connected_devices[host_number] or {}\n        tmp_connected_devices[host_number][param_name] = param.value\n      end\n    end\n  end\n\n  local connected_devices_per_interface = {}\n  for _, dev in pairs(tmp_connected_devices) do\n    local connected_device_name = dev['Hostname']\n    if dev['FriendlyName'] and dev['FriendlyName'] ~= '' then\n      connected_device_name = dev['FriendlyName']\n    end\n\n    local connected_device = {\n      mac = dev['PhysAddress'],\n      ip_adress = dev['IPAddress'],\n      adress_source = dev['AddressSource'],\n      active = bool_val(dev['Active']),\n      hostname = connected_device_name,\n    }\n\n    local interface_name = 'Ethernet'\n    if dev['AssociatedDevice'] and dev['AssociatedDevice'] ~= '' then\n      local ap_instance = tonumber((dev['AssociatedDevice']:match('%.(%d+)$')))\n      local ap_device = ap_instance and tmp_devices_connected_to_ap[ap_instance] or nil\n      if ap_device then\n        connected_device.rssi = ap_device['SignalStrength']\n        connected_device.stats = {\n          bytes_received = to_uint64(ap_device['Stats.BytesReceived']),\n          bytes_sent = to_uint64(ap_device['Stats.BytesSent']),\n        }\n        connected_device.router_mesh = (ap_device['DeviceRole'] == 'slave')\n\n        local access_point = dev['AssociatedDevice']\n        local idx = string.find(access_point, '%.AssociatedDevice')\n        if idx then\n          access_point = string.sub(access_point, 1, idx - 1)\n        end\n        interface_name = radio_frequency_band[ssid_association_to_radio[access_point_association_to_ssid[access_point]]] or interface_name\n      end\n    end\n\n    connected_devices_per_interface[interface_name] = connected_devices_per_interface[interface_name] or {}\n    table.insert(connected_devices_per_interface[interface_name], connected_device)\n  end\n\n  return {\n    model = model,\n    hostname = sn,\n    connected_devices = connected_devices_per_interface,\n  }\nend\n\n-- Speed Test\nfunction parse_get_speed_test_result(speed_test_type, response)\n  local params = response_param_map(response)\n\n  local bytes_received = tonumber(params['TotalBytesReceived'] or '0') or 0\n  local raw_eom = params['EOMTime'] or ''\n  local raw_rom = params['ROMTime'] or ''\n  local raw_bom = params['BOMTime'] or ''\n\n  local eom = parse_iso_time(raw_eom)\n  local rom = parse_iso_time(raw_rom)\n  local bom = parse_iso_time(raw_bom)\n  if not eom or not rom or not bom then\n    return nil, 'Time parsing error'\n  end\n\n  local rtt = duration_string(os.difftime(bom, rom))\n  local resp_time = duration_string(os.difftime(eom, rom))\n  local elapsed = os.difftime(eom, bom)\n  local throughput = '0'\n  if elapsed > 0 then\n    if speed_test_type == 'upload' then\n      local bytes_sent = tonumber(params['TotalBytesSent'] or '0') or 0\n      throughput = human_readable_bits(math.floor(8 * bytes_sent / elapsed))\n    else\n      throughput = human_readable_bits(math.floor(8 * bytes_received / elapsed))\n    end\n  end\n\n  return {\n    bytes_received = bytes_received,\n    rtt = rtt,\n    resp_time = resp_time,\n    throughput = throughput,\n  }, nil\nend\n\nfunction get_speed_test_result(speed_test_type)\n  return {\n    'Device.IP.Diagnostics.DownloadDiagnostics.ROMTime',\n    'Device.IP.Diagnostics.DownloadDiagnostics.BOMTime',\n    'Device.IP.Diagnostics.DownloadDiagnostics.EOMTime',\n    'Device.IP.Diagnostics.DownloadDiagnostics.TotalBytesReceived',\n  }\nend\n\nfunction set_speed_test(test)\n  local action = test.action or test.type\n  local values = {}\n\n  if action == 'upload' then\n    -- TODO: upload speedtest not implemented in fast3896.go\n  else\n    if test.url and test.url ~= '' then\n      values['Device.IP.Diagnostics.DownloadDiagnostics.DownloadURL'] = test.url\n    end\n    if test.interface and test.interface ~= '' then\n      values['Device.IP.Diagnostics.DownloadDiagnostics.Interface'] = test.interface\n    end\n    values['Device.IP.Diagnostics.DownloadDiagnostics.DiagnosticsState'] = 'Requested'\n  end\n\n  return values\nend\n\nfunction get_download_diagnostic_state()\n  return 'Device.IP.Diagnostics.DownloadDiagnostics.DiagnosticsState'\nend\n\nfunction get_upload_diagnostic_state()\n  return 'Device.IP.Diagnostics.UploadDiagnostics.DiagnosticsState'\nend\n\n-- Ping\nfunction get_ping()\n  return {\n    'Device.IP.Diagnostics.IPPing.Interface',\n    'Device.IP.Diagnostics.IPPing.Timeout',\n    'Device.IP.Diagnostics.IPPing.Host',\n    'Device.IP.Diagnostics.IPPing.NumberOfRepetitions',\n    'Device.IP.Diagnostics.IPPing.DataBlockSize',\n    'Device.IP.Diagnostics.IPPing.FailureCount',\n    'Device.IP.Diagnostics.IPPing.SuccessCount',\n    'Device.IP.Diagnostics.IPPing.AverageResponseTime',\n    'Device.IP.Diagnostics.IPPing.MinimumResponseTime',\n    'Device.IP.Diagnostics.IPPing.MaximumResponseTime',\n    'Device.IP.Diagnostics.IPPing.DiagnosticsState',\n  }\nend\n\nfunction parse_get_ping(response)\n  local params = response_param_map(response)\n\n  local timeout = to_int(params['Timeout'], 5000)\n  local timeout_seconds = math.floor(timeout / 1000)\n  local repetitions = to_int(params['NumberOfRepetitions'], 3)\n  local block_size = to_int(params['DataBlockSize'], 32)\n  if block_size == 0 then\n    block_size = 32\n  end\n\n  local failure_count = to_int(params['FailureCount'], 0)\n  local success_count = to_int(params['SuccessCount'], 0)\n  local avg_rtt = to_int(params['AverageResponseTime'], 0)\n  local min_rtt = to_int(params['MinimumResponseTime'], 0)\n  local max_rtt = to_int(params['MaximumResponseTime'], 0)\n\n  local diagnostic = params['DiagnosticsState'] or ''\n  local interface_value = params['Interface']\n  local host = params['Host']\n\n  local last_result = {\n    result = parse_diagnostic_state(diagnostic, failure_count),\n    failure_count = failure_count,\n    success_count = success_count,\n    average_rtt = avg_rtt,\n    minimum_rtt = min_rtt,\n    maximum_rtt = max_rtt,\n  }\n\n  return {\n    interface = pd(false, interface_value),\n    timeout = pd(true, timeout_seconds),\n    host = pd(true, host),\n    number_of_repetitions = pd(true, repetitions),\n    data_block_size = pd(true, block_size),\n    processing = pd(false, diagnostic == 'Requested' or diagnostic == 'Request'),\n    last_result = last_result,\n  }\nend\n\nfunction get_ping_diagnostic_state()\n  return 'Device.IP.Diagnostics.IPPing.DiagnosticsState'\nend\n\nfunction set_ping(ping)\n  local values = {}\n  values['Device.IP.Diagnostics.IPPing.Interface'] = ping.interface.value\n  values['Device.IP.Diagnostics.IPPing.Timeout'] = (ping.timeout.value or 0) * 1000\n  values['Device.IP.Diagnostics.IPPing.Host'] = ping.host.value\n  values['Device.IP.Diagnostics.IPPing.NumberOfRepetitions'] = ping.number_of_repetitions.value\n  values['Device.IP.Diagnostics.IPPing.DiagnosticsState'] = 'Requested'\n  values['Device.IP.Diagnostics.IPPing.DataBlockSize'] = ping.data_block_size.value\n  return values\nend\n\nfunction get_ping_result()\n  return {\n    'Device.IP.Diagnostics.IPPing.FailureCount',\n    'Device.IP.Diagnostics.IPPing.SuccessCount',\n    'Device.IP.Diagnostics.IPPing.AverageResponseTime',\n    'Device.IP.Diagnostics.IPPing.MinimumResponseTime',\n    'Device.IP.Diagnostics.IPPing.MaximumResponseTime',\n    'Device.IP.Diagnostics.IPPing.DiagnosticsState',\n  }\nend\n\nfunction parse_get_ping_result(response)\n  local list = response.list or {}\n  if #list < 6 then\n    return nil\n  end\n\n  local failure_count = to_int(list[1].value, 0)\n  local success_count = to_int(list[2].value, 0)\n  local avg_rtt = to_int(list[3].value, 0)\n  local min_rtt = to_int(list[4].value, 0)\n  local max_rtt = to_int(list[5].value, 0)\n  local diagnostic_state = list[6].value or ''\n\n  if diagnostic_state == 'Error_CannotResolveHostName' then\n    diagnostic_state = 'Cannot resolve host name'\n  elseif diagnostic_state == 'Error_MaxHopCountExceeded' then\n    diagnostic_state = 'Max hop count exceeded'\n  elseif diagnostic_state == 'Requested' then\n    diagnostic_state = 'In progress'\n  elseif diagnostic_state == 'Complete' then\n    if failure_count > 0 then\n      diagnostic_state = 'Failure'\n    else\n      diagnostic_state = 'Success'\n    end\n  elseif diagnostic_state == 'None' then\n    diagnostic_state = 'None'\n  else\n    diagnostic_state = 'Unknown'\n  end\n\n  return {\n    result = diagnostic_state,\n    failure_count = failure_count,\n    success_count = success_count,\n    average_rtt = avg_rtt,\n    minimum_rtt = min_rtt,\n    maximum_rtt = max_rtt,\n  }\nend\n\n-- Traceroute\nfunction get_traceroute()\n  return {\n    'Device.IP.Diagnostics.TraceRoute.Interface',\n    'Device.IP.Diagnostics.TraceRoute.Timeout',\n    'Device.IP.Diagnostics.TraceRoute.Host',\n    'Device.IP.Diagnostics.TraceRoute.NumberOfTries',\n    'Device.IP.Diagnostics.TraceRoute.MaxHopCount',\n  }\nend\n\nfunction parse_get_traceroute(response)\n  local list = response.list or {}\n  if #list < 5 then\n    return nil\n  end\n\n  local timeout = to_int(list[2].value, 30000)\n  local number_of_tries = to_int(list[4].value, 0)\n  local max_hop_count = to_int(list[5].value, 0)\n\n  return {\n    interface = pd(false, list[1].value),\n    timeout = pd(true, math.floor(timeout / 1000)),\n    host = pd(true, list[3].value),\n    number_of_tries = pd(true, number_of_tries),\n    max_hop_count = pd(true, max_hop_count),\n  }\nend\n\nfunction get_traceroute_diagnostic_state()\n  return 'Device.IP.Diagnostics.TraceRoute.DiagnosticsState'\nend\n\nfunction set_traceroute(traceroute)\n  return {\n    ['Device.IP.Diagnostics.TraceRoute.Timeout'] = (traceroute.timeout.value or 0) * 1000,\n    ['Device.IP.Diagnostics.TraceRoute.Host'] = traceroute.host.value,\n    ['Device.IP.Diagnostics.TraceRoute.NumberOfTries'] = traceroute.number_of_tries.value,\n    ['Device.IP.Diagnostics.TraceRoute.MaxHopCount'] = traceroute.max_hop_count.value,\n    ['Device.IP.Diagnostics.TraceRoute.DiagnosticsState'] = 'Requested',\n  }\nend\n\nfunction get_traceroute_result_number_of_hops()\n  return 'Device.IP.Diagnostics.TraceRoute.RouteHopsNumberOfEntries'\nend\n\nfunction get_traceroute_result(number_of_hops)\n  local params = {\n    'Device.IP.Diagnostics.TraceRoute.DiagnosticsState',\n    'Device.IP.Diagnostics.TraceRoute.ResponseTime',\n    'Device.IP.Diagnostics.TraceRoute.RouteHopsNumberOfEntries',\n  }\n  for i = 1, number_of_hops do\n    local entry = tostring(i)\n    params[#params + 1] = 'Device.IP.Diagnostics.TraceRoute.RouteHops.' .. entry .. '.Host'\n    params[#params + 1] = 'Device.IP.Diagnostics.TraceRoute.RouteHops.' .. entry .. '.RTTimes'\n    params[#params + 1] = 'Device.IP.Diagnostics.TraceRoute.RouteHops.' .. entry .. '.HostAddress'\n  end\n  return params\nend\n\nfunction parse_get_traceroute_result(response)\n  local list = response.list or {}\n  if #list < 3 then\n    return nil\n  end\n\n  local result = {}\n  local diagnostic_state = list[1].value or ''\n  if diagnostic_state == 'Error_CannotResolveHostName' then\n    result.result = 'Cannot resolve host name'\n  elseif diagnostic_state == 'Error_MaxHopCountExceeded' then\n    result.result = 'Max hop count exceeded'\n  elseif diagnostic_state == 'Requested' then\n    result.result = 'In progress'\n  elseif diagnostic_state == 'Complete' then\n    result.result = 'Success'\n  elseif diagnostic_state == 'None' then\n    result.result = 'None'\n  else\n    result.result = 'Success'\n  end\n\n  result.response_time = to_int(list[2].value, 0)\n  result.hop_count = to_int(list[3].value, 0)\n\n  local hops = {}\n  local index = 4\n  for i = 1, result.hop_count do\n    local host = list[index] and list[index].value or nil\n    local addr = list[index + 2] and list[index + 2].value or nil\n    if host == nil or host == '' then\n      host = addr\n    end\n    hops[i] = {\n      host = host,\n      rtt = list[index + 1] and list[index + 1].value or nil,\n      addr = addr,\n    }\n    index = index + 3\n  end\n  result.hops = hops\n\n  return result\nend\n\n-- Statistics / Interfaces / Hwinfo / PON\nfunction get_statistics() return nil end\nfunction parse_get_statistics(response) return nil end\nfunction get_interface_wan() return nil end\nfunction get_interface_lan() return nil end\nfunction parse_get_interface_wan(response) return nil end\nfunction parse_get_interface_lan(response) return nil end\nfunction get_hwinfo() return nil end\nfunction parse_get_hwinfo(response) return {} end\nfunction get_pon() return nil end\nfunction parse_get_pon(response) return {} end\n\nfunction get_wan_options() return nil end\n\n-- Ports\nfunction get_port()\n  return {\n    'Device.Docsis.Interface.',\n    'Device.Ethernet.Interface.',\n    'Device.Ethernet.Link.',\n    'Device.IP.Interface.',\n    'Device.DNS.Relay.Forwarding.',\n  }\nend\n\nfunction parse_get_port(response)\n  local parsed = {}\n\n  local ip_association_to_link = {}\n  local link_association_to_bridge = {}\n\n  local ethernet_interfaces = {}\n  local docsis_interfaces = {}\n  local links = {}\n  local ip_interfaces = {}\n  local dns_entries = {}\n\n  for _, param in ipairs((response and response.list) or {}) do\n    local name = param.name or ''\n    local value = param.value\n\n    local docsis_number, docsis_param = name:match('^Device%.Docsis%.Interface%.(%d+)%.(.+)$')\n    if docsis_number then\n      docsis_number = tonumber(docsis_number)\n      docsis_interfaces[docsis_number] = docsis_interfaces[docsis_number] or {}\n      docsis_interfaces[docsis_number][docsis_param] = value\n    else\n      local eth_number, eth_param = name:match('^Device%.Ethernet%.Interface%.(%d+)%.(.+)$')\n      if eth_number then\n        eth_number = tonumber(eth_number)\n        ethernet_interfaces[eth_number] = ethernet_interfaces[eth_number] or {}\n        ethernet_interfaces[eth_number][eth_param] = value\n      else\n        local link_number, link_param = name:match('^Device%.Ethernet%.Link%.(%d+)%.(.+)$')\n        if link_number then\n          link_number = tonumber(link_number)\n          links[link_number] = links[link_number] or {}\n          links[link_number][link_param] = value\n        else\n          local ip_number, ip_param = name:match('^Device%.IP%.Interface%.(%d+)%.(.+)$')\n          if ip_number then\n            ip_number = tonumber(ip_number)\n            local ip_path = string.format('Device.IP.Interface.%d.', ip_number)\n            ip_interfaces[ip_path] = ip_interfaces[ip_path] or {}\n            ip_interfaces[ip_path][ip_param] = value\n          else\n            local dns_number, dns_param = name:match('^Device%.DNS%.Relay%.Forwarding%.(%d+)%.(.+)$')\n            if dns_number then\n              dns_number = tonumber(dns_number)\n              dns_entries[dns_number] = dns_entries[dns_number] or {}\n              dns_entries[dns_number][dns_param] = value\n            end\n          end\n        end\n      end\n    end\n  end\n\n  for ethernet_number, params in pairs(ethernet_interfaces) do\n    local mac_address = params['MACAddress'] or ''\n    if mac_address ~= '' then\n      local alias = params['Alias']\n      local status = params['Status']\n      local bytes_sent = to_int(params['Stats.BytesSent'], 0)\n      local bytes_received = to_int(params['Stats.BytesReceived'], 0)\n\n      local path = string.format('Device.Ethernet.Interface.%d.', ethernet_number)\n      parsed[path] = {\n        path = path,\n        enable = pd(true, bool_val(params['Enable'])),\n        alias = pd(true, alias),\n        status = pd(false, status),\n        mac_address = pd(false, mac_address),\n        tx = pd(false, bytes_sent),\n        rx = pd(false, bytes_received),\n      }\n    end\n  end\n\n  for docsis_number, params in pairs(docsis_interfaces) do\n    local upstream = bool_val(params['Upstream'])\n    if upstream then\n      local alias = 'DOCSIS'\n      local status = params['Status']\n      local path = string.format('Device.Docsis.Interface.%d.', docsis_number)\n      parsed[path] = {\n        path = path,\n        enable = pd(true, bool_val(params['Enable'])),\n        alias = pd(true, alias),\n        status = pd(false, status),\n        upstream = pd(false, upstream),\n      }\n    end\n  end\n\n  for eth_link_number, params in pairs(links) do\n    link_association_to_bridge[string.format('Device.Ethernet.Link.%d', eth_link_number)] = params['LowerLayers']\n  end\n\n  for ip_interface_path, params in pairs(ip_interfaces) do\n    ip_association_to_link[ip_interface_path] = params['LowerLayers']\n  end\n\n  for ip_interface_path, logical in pairs(ip_interfaces) do\n    if logical['Alias'] == 'IP_CM_DATA' or logical['Alias'] == 'IP_DATA' then\n      local docsis_port = parsed['Device.Docsis.Interface.1.']\n      if docsis_port then\n        local max_mtu_size = to_int(logical['MaxMTUSize'], 0)\n        local alias = logical['Alias']\n\n        local ipv4_address = logical['IPv4Address.1.IPAddress']\n        local subnet_mask = logical['IPv4Address.1.SubnetMask']\n        local addressing_type = logical['IPv4Address.1.AddressingType']\n\n        local ipv6_state = logical['IPv6Address.1.IPAddressStatus']\n        local ipv6_address = logical['IPv6Address.1.IPAddress']\n        local origin = logical['IPv6Address.1.Origin']\n        local prefix = logical['IPv6Prefix.1.Prefix']\n\n        local dns_servers = {}\n        for _, dns_params in pairs(dns_entries) do\n          if dns_params['Interface'] == ip_interface_path and dns_params['Status'] == 'Enabled' then\n            dns_servers[#dns_servers + 1] = dns_params['DNSServer']\n          end\n        end\n        local fmt_dns_servers = table.concat(dns_servers, ',')\n        local ipv4_is_writable = (addressing_type == 'Static')\n\n        docsis_port.ip = docsis_port.ip or {}\n        docsis_port.ip[#docsis_port.ip + 1] = {\n          path = ip_interface_path,\n          enable = pd(true, bool_val(logical['Enable'])),\n          ipv4 = {\n            path = string.format('%sIPv4Address.1.', ip_interface_path),\n            enable = pd(true, bool_val(logical['IPv4Enable'])),\n            ip_address = pd(ipv4_is_writable, ipv4_address),\n            subnet_mask = pd(ipv4_is_writable, subnet_mask),\n            origin = pd(false, addressing_type),\n            dns_servers = {\n              dns_servers = pd(false, fmt_dns_servers),\n            },\n          },\n          name = pd(false, alias),\n          max_mtu_size = pd(true, max_mtu_size),\n          ipv6 = {\n            path = string.format('%sIPv6Address.1.', ip_interface_path),\n            enable = pd(true, bool_val(logical['IPv6Enable'])),\n            state = pd(false, ipv6_state),\n            ip_address = pd(origin == 'Static', ipv6_address),\n            origin = pd(false, origin),\n            prefix = pd(origin == 'Static', prefix),\n          },\n        }\n\n        parsed['Device.Docsis.Interface.1.'] = docsis_port\n      end\n    end\n  end\n\n  return parsed\nend\n\nfunction set_port(ports)\n  local parameter_values = {}\n\n  for port_name, port in pairs(ports or {}) do\n    if not port.ip or #port.ip == 0 then\n      return nil, 'error setting port, IP is not set for port ' .. tostring(port_name)\n    end\n\n    for _, ip in ipairs(port.ip) do\n      local path = ip.path or ''\n\n      if ip.enable and ip.enable.value ~= nil then\n        local enable_value = (port.enable and port.enable.value ~= nil) and bool_val(port.enable.value) or bool_val(ip.enable.value)\n        parameter_values[path .. 'Enable'] = enable_value\n      end\n\n      if ip.ipv4 and ip.ipv4.ip_address and ip.ipv4.ip_address.value ~= nil then\n        local value = ip.ipv4.ip_address.value\n        if type(value) ~= 'string' then\n          return nil, 'error setting port ' .. tostring(port_name) .. ', IPv4 IPAddress value is not a string: bad payload'\n        end\n        local ipv4_path = (ip.ipv4.path or '')\n        parameter_values[ipv4_path .. 'IPAddress'] = value\n      end\n\n      if ip.ipv4 and ip.ipv4.enable and ip.ipv4.enable.value ~= nil then\n        parameter_values[path .. 'IPv4Enable'] = bool_val(ip.ipv4.enable.value)\n      end\n\n      if ip.ipv6 and ip.ipv6.enable and ip.ipv6.enable.value ~= nil then\n        parameter_values[path .. 'IPv6Enable'] = bool_val(ip.ipv6.enable.value)\n      end\n\n      if ip.ipv4 and ip.ipv4.subnet_mask and ip.ipv4.subnet_mask.value ~= nil then\n        local value = ip.ipv4.subnet_mask.value\n        if type(value) ~= 'string' then\n          return nil, 'error setting port ' .. tostring(port_name) .. ', IPv4 SubnetMask value is not a string: bad payload'\n        end\n        parameter_values[path .. 'SubnetMask'] = value\n      end\n    end\n  end\n\n  return parameter_values, nil\nend\n\nfunction add_port(port) return nil, nil end\n\n-- Unsupported on this model\nfunction get_bridge() return nil end\nfunction parse_get_bridge(response) return nil end\nfunction set_bridge(bridges) return nil end\nfunction get_voice() return nil end\nfunction parse_get_voice(response) return nil end\nfunction add_voice(voice) return nil, nil end\nfunction set_voice(voice) return nil, nil end\nfunction add_line(line) return nil, nil end\nfunction set_line(line) return nil, nil end\nfunction get_cellular() return nil end\nfunction parse_get_cellular(response) return '[]' end\nfunction set_cellular(cellular) return nil end\nfunction get_xdsl() return nil end\nfunction parse_xdsl(response) return nil end\n"
