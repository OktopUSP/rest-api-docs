alse, to_int(value, 0))\n    elseif name == 'InternetGatewayDevice.WANDevice.1.WANDSLInterfaceConfig.UpstreamMaxRate' then\n      xdsl.upstream_max_rate = pd(false, to_int(value, 0))\n    elseif name == 'InternetGatewayDevice.WANDevice.1.WANDSLInterfaceConfig.DownstreamMaxRate' then\n      xdsl.downstream_max_rate = pd(false, to_int(value, 0))\n    elseif name == 'InternetGatewayDevice.WANDevice.1.WANDSLInterfaceConfig.ModulationType' then\n      xdsl.modulation_type = pd(false, value)\n    end\n  end\n\n  return { xdsl }\nend\n"
