info:
  name: Update Profile
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}device-profile"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  body:
    type: json
    data: |-
      {
          "name": "MeuProfile",
          "model": "EG8145X6-10",
          "protocol": "cwmp",
          "active": true,
          "content": "-- EG8145X6-10 model script for devices-manager\n-- Functions return tables that map to resources JSON structures.\n-- If a function returns nil, devices-manager falls back to the Go implementation.\n\n-- Helpers\nlocal function trim(s)\n  return (s:gsub('^%s+', ''):gsub('%s+$', ''))\nend\n\nlocal function split(s, sep)\n  local t = {}\n  if s == nil or s == '' then\n    return t\n  end\n  sep = sep or ','\n  local pattern = '([^' .. sep .. ']+)'\n  for part in string.gmatch(s, pattern) do\n    t[#t+1] = trim(part)\n  end\n  return t\nend\n\nlocal function split_int(s, sep)\n  local out = {}\n  for _, v in ipairs(split(s, sep)) do\n    local n = tonumber(v)\n    if n ~= nil then\n      out[#out+1] = n\n    end\n  end\n  return out\nend\n\nlocal function trim_prefix(value, prefix)\n  if value == nil then\n    return nil\n  end\n  if value:sub(1, #prefix) == prefix then\n    return value:sub(#prefix + 1)\n  end\n  return value\nend\n\nlocal function trim_suffix(value, suffix)\n  if value == nil then\n    return nil\n  end\n  if value:sub(-#suffix) == suffix then\n    return value:sub(1, #value - #suffix)\n  end\n  return value\nend\n\nlocal function bool_val(v)\n  if v == nil then\n    return false\n  end\n  if type(v) == 'boolean' then\n    return v\n  end\n  local s = tostring(v):lower()\n  if s == '1' or s == 'true' then\n    return true\n  end\n  if s == '0' or s == 'false' then\n    return false\n  end\n  return false\nend\n\nlocal function to_int(v, default)\n  local n = tonumber(v)\n  if n == nil then\n    return default\n  end\n  return math.floor(n)\nend\n\nlocal function to_uint64(v)\n  local n = tonumber(v)\n  if n == nil or n \u003c 0 then\n    return 0\n  end\n  return math.floor(n)\nend\n\nlocal function pd(writable, value)\n  return { writable = writable, value = value }\nend\n\nlocal function response_param_map(response)\n  local param_map = {}\n  local list = response and response.list or {}\n  for _, param in ipairs(list) do\n    local name = param.name or ''\n    local value = param.value\n    local last = name:match('([^.]+)$') or name\n    param_map[last] = value\n  end\n  return param_map\nend\n\nlocal function format_transmit_power_supported(raw)\n  if raw == nil then\n    return nil\n  end\n  local out = {}\n  for _, power in ipairs(split(raw, ',')) do\n    if power == '-1' then\n      out[#out+1] = 'Auto'\n    else\n      out[#out+1] = power .. '%'\n    end\n  end\n  return out\nend\n\nlocal function translate_beacon_type_to_human(value)\n  if value == '11i' then\n    return 'WPA2'\n  elseif value == 'WPAand11i' then\n    return 'WPA/WPA2'\n  elseif value == '11iandWPA3' then\n    return 'WPA2/WPA3'\n  end\n  return value\nend\n\nlocal function translate_beacon_type_to_cwmp(value)\n  if value == 'WPA2' then\n    return '11i'\n  elseif value == 'WPA/WPA2' then\n    return 'WPAand11i'\n  elseif value == 'WPA2/WPA3' then\n    return '11iandWPA3'\n  end\n  return value\nend\n\nlocal function is_password_writable(beacon_type)\n  return not (beacon_type == 'Basic' or beacon_type == 'None')\nend\n\nlocal function duration_string(seconds)\n  if seconds == nil then\n    return ''\n  end\n  local total = math.floor(seconds)\n  if total \u003c 60 then\n    return string.format('%ds', total)\n  end\n  local mins = math.floor(total / 60)\n  local secs = total - mins * 60\n  if mins \u003c 60 then\n    return string.format('%dm%ds', mins, secs)\n  end\n  local hours = math.floor(mins / 60)\n  mins = mins - hours * 60\n  return string.format('%dh%dm%ds', hours, mins, secs)\nend\n\nlocal function human_readable_bits(bits)\n  local sizes = { 'bits p/s', 'Kbps', 'Mbps', 'Gbps', 'Tbps', 'Pbps', 'Ebps' }\n  local value = bits\n  local i = 1\n  while value \u003e= 1000 and i \u003c #sizes do\n    value = value / 1000\n    i = i + 1\n  end\n  return string.format('%.2f%s', value, sizes[i])\nend\n\nlocal function parse_iso_time(raw)\n  if raw == nil then\n    return nil\n  end\n  if raw:sub(-1) == 'Z' then\n    raw = raw:sub(1, -2)\n  end\n  local y, mo, d, h, mi, s = raw:match('^(%d+)%-(%d+)%-(%d+)T(%d+):(%d+):(%d+)')\n  if not y then\n    return nil\n  end\n  return os.time({ year = tonumber(y), month = tonumber(mo), day = tonumber(d), hour = tonumber(h), min = tonumber(mi), sec = tonumber(s) })\nend\n\nlocal function get_ip_origin(value)\n  if value == nil or value == '' then\n    return 'PPPoE'\n  end\n  return value\nend\n\nlocal function ip_attribute_is_writable(attribute)\n  return get_ip_origin(attribute) == 'Static'\nend\n\nlocal function parse_diagnostic_state(raw, failure_count)\n  if raw == 'Error_CannotResolveHostName' then\n    return 'Cannot resolve host name'\n  elseif raw == 'Error_MaxHopCountExceeded' then\n    return 'Max hop count exceeded'\n  elseif raw == 'Requested' or raw == 'Running' then\n    return 'In progress'\n  elseif raw == 'Complete' or raw == 'Completed' then\n    if failure_count \u003e 0 then\n      return 'Failure'\n    end\n    return 'Success'\n  elseif raw == 'None' then\n    return 'None'\n  end\n  return 'Unknown'\nend\n\nlocal function ip_to_octets(ip)\n  if ip == nil then\n    return nil\n  end\n  local a, b, c, d = ip:match('^(%d+)%.(%d+)%.(%d+)%.(%d+)$')\n  if not a then\n    return nil\n  end\n  a, b, c, d = tonumber(a), tonumber(b), tonumber(c), tonumber(d)\n  if a \u003e 255 or b \u003e 255 or c \u003e 255 or d \u003e 255 then\n    return nil\n  end\n  return a, b, c, d\nend\n\nlocal function band(a, b)\n  local res = 0\n  local bit = 1\n  while a \u003e 0 or b \u003e 0 do\n    local a_bit = a % 2\n    local b_bit = b % 2\n    if a_bit == 1 and b_bit == 1 then\n      res = res + bit\n    end\n    a = math.floor(a / 2)\n    b = math.floor(b / 2)\n    bit = bit * 2\n  end\n  return res\nend\n\nlocal function is_valid_ipv4(ip)\n  return ip_to_octets(ip) ~= nil\nend\n\nlocal function is_valid_subnet_mask(mask)\n  local a, b, c, d = ip_to_octets(mask)\n  if not a then\n    return false\n  end\n  local mask_value = ((a * 256 + b) * 256 + c) * 256 + d\n  if mask_value == 0 then\n    return false\n  end\n  local inverted = 0xFFFFFFFF - mask_value + 1\n  if inverted == 0 then\n    return true\n  end\n  return band(inverted, inverted - 1) == 0\nend\n\nlocal function are_ips_in_same_subnet(ip1, ip2, mask)\n  local a1, b1, c1, d1 = ip_to_octets(ip1)\n  local a2, b2, c2, d2 = ip_to_octets(ip2)\n  local m1, m2, m3, m4 = ip_to_octets(mask)\n  if not a1 or not a2 or not m1 then\n    return false\n  end\n  return band(a1, m1) == band(a2, m1)\n    and band(b1, m2) == band(b2, m2)\n    and band(c1, m3) == band(c2, m3)\n    and band(d1, m4) == band(d2, m4)\nend\n\nlocal function wan_stats(ip_data)\n  return {\n    bytes_sent = to_uint64(ip_data['Stats.EthernetBytesSent']),\n    bytes_received = to_uint64(ip_data['Stats.EthernetBytesReceived']),\n    packets_sent = to_uint64(ip_data['Stats.EthernetPacketsSent']),\n    packets_received = to_uint64(ip_data['Stats.EthernetPacketsReceived']),\n    errors_sent = to_uint64(ip_data['Stats.EthernetErrorsSent']),\n    errors_received = to_uint64(ip_data['Stats.EthernetErrorsReceived']),\n    discard_packets_sent = to_uint64(ip_data['Stats.EthernetDiscardPacketsSent']),\n    discard_packets_received = to_uint64(ip_data['Stats.EthernetDiscardPacketsReceived']),\n    unicast_packets_sent = to_uint64(ip_data['Stats.EthernetUnicastPacketsSent']),\n    unicast_packets_received = to_uint64(ip_data['Stats.EthernetUnicastPacketsReceived']),\n    multicast_packets_sent = to_uint64(ip_data['Stats.EthernetMulticastPacketsSent']),\n    multicast_packets_received = to_uint64(ip_data['Stats.EthernetMulticastPacketsReceived']),\n    broadcast_packets_sent = to_uint64(ip_data['Stats.EthernetBroadcastPacketsSent']),\n    broadcast_packets_received = to_uint64(ip_data['Stats.EthernetBroadcastPacketsReceived']),\n    unknown_packets_received = to_uint64(ip_data['Stats.EthernetUnknownProtoPacketsReceived']),\n  }\nend\n\n-- Model identity and capabilities\nfunction get_vendor() return 'Huawei' end\nfunction get_data_model() return 'TR-098' end\nfunction get_device_specs() return { TimeTraceRoute = 3 } end\nfunction get_device_capabilities()\n  return {\n    Radio = true,\n    Ssid = true,\n    SiteSurvey = true,\n    ConnectedDevices = true,\n    Diagnostic = true,\n    Ports = true,\n    Reboot = true,\n    FactoryReset = false,\n    FirmwareUpgrade = true,\n    FirmwareRollback = false,\n    FactoryDefault = true,\n    Traceroute = true,\n    SpeedTest = true,\n    DownloadSpeedTest = true,\n    UploadSpeedTest = false,\n    Ping = true,\n    Logs = false,\n    Stats = true,\n    Interfaces = true,\n    Wan = true,\n    Lan = false,\n    Hwinfo = true,\n    Pon = false,\n  }\nend\nfunction is_real_time() return false end\n\n-- WiFi Radio\nfunction get_radio()\n  return {\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.RadioEnabled',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.Channel',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.AutoChannelEnable',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.PossibleChannels',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.X_HW_CurrentOperatingChannelBandwidth',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.TransmitPowerSupported',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.TransmitPower',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.X_HW_SupportedStandards',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.X_HW_Standard',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.X_HW_RFBand',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.RadioEnabled',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.Channel',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.AutoChannelEnable',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.PossibleChannels',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.X_HW_CurrentOperatingChannelBandwidth',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.TransmitPowerSupported',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.TransmitPower',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.X_HW_SupportedStandards',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.X_HW_Standard',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.X_HW_RFBand',\n  }\nend\n\nfunction parse_radio(response)\n  local radios = {}\n  local ports_wlan_tmp = {}\n  for _, param in ipairs(response.list or {}) do\n    local wlan_number, param_type = string.match(param.name or '', 'InternetGatewayDevice%.LANDevice%.1%.WLANConfiguration%.(%d+)%.(.+)')\n    if wlan_number then\n      wlan_number = tonumber(wlan_number)\n      ports_wlan_tmp[wlan_number] = ports_wlan_tmp[wlan_number] or {}\n      ports_wlan_tmp[wlan_number][param_type] = param.value\n    end\n  end\n\n  local wlan_indices = { 1, 5 }\n  for i, wlan_index in ipairs(wlan_indices) do\n    local wlan = ports_wlan_tmp[wlan_index] or {}\n    local channel = to_int(wlan['Channel'], 0)\n    radios[i] = {\n      path = 'InternetGatewayDevice.LANDevice.1.WLANConfiguration.' .. wlan_index .. '.',\n      enable = pd(true, bool_val(wlan['RadioEnabled'])),\n      name = pd(false, wlan['X_HW_RFBand']),\n      auto_channel_enable = pd(true, bool_val(wlan['AutoChannelEnable'])),\n      channel = pd(true, channel),\n      possible_channels = pd(false, split_int(wlan['PossibleChannels'], ',')),\n      operating_channel_bandwidth = pd(false, wlan['X_HW_CurrentOperatingChannelBandwidth']),\n      operating_frequency_band = pd(false, wlan['X_HW_RFBand']),\n      transmit_power = pd(true, wlan['TransmitPower'] and (wlan['TransmitPower'] .. '%') or nil),\n      transmit_power_supported = pd(false, format_transmit_power_supported(wlan['TransmitPowerSupported'])),\n      supported_frequency_bands = pd(false, split(wlan['X_HW_RFBand'], ',')),\n      supported_operating_channel_bandwidth = pd(false, split(wlan['X_HW_CurrentOperatingChannelBandwidth'], ',')),\n      supported_standards = pd(false, split(wlan['X_HW_SupportedStandards'], ',')),\n      operating_standards = pd(false, split(trim_prefix(wlan['X_HW_Standard'] or '', '11'), ',')),\n    }\n  end\n\n  return radios\nend\n\nfunction set_radio(radios)\n  local values = {}\n  for _, r in ipairs(radios or {}) do\n    local path = r.path or ''\n    if r.enable and r.enable.value ~= nil then\n      values[path .. 'RadioEnabled'] = r.enable.value\n    end\n    if r.auto_channel_enable and r.auto_channel_enable.value ~= nil then\n      values[path .. 'AutoChannelEnable'] = r.auto_channel_enable.value\n    end\n    if r.channel and r.channel.value ~= nil then\n      values[path .. 'Channel'] = r.channel.value\n    end\n    if r.transmit_power and r.transmit_power.value ~= nil then\n      values[path .. 'TransmitPower'] = trim_suffix(r.transmit_power.value, '%')\n    end\n  end\n  return values\nend\n\n-- WiFi SSID\nfunction get_ssid()\n  return {\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.SSID',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.RadioEnabled',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.SSIDAdvertisementEnabled',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.Status',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.TotalBytesSent',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.TotalBytesReceived',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.BSSID',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.X_HW_RFBand',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.BeaconType',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.SSID',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.RadioEnabled',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.SSIDAdvertisementEnabled',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.Status',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.TotalBytesSent',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.TotalBytesReceived',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.BSSID',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.X_HW_RFBand',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.BeaconType',\n  }\nend\n\nfunction parse_ssid(response)\n  local ssids = {}\n  local ports_wlan_tmp = {}\n  for _, param in ipairs(response.list or {}) do\n    local wlan_number, param_type = string.match(param.name or '', 'InternetGatewayDevice%.LANDevice%.1%.WLANConfiguration%.(%d+)%.(.+)')\n    if wlan_number then\n      wlan_number = tonumber(wlan_number)\n      ports_wlan_tmp[wlan_number] = ports_wlan_tmp[wlan_number] or {}\n      ports_wlan_tmp[wlan_number][param_type] = param.value\n    end\n  end\n\n  local wlan_indices = { 1, 5 }\n  for i, wlan_index in ipairs(wlan_indices) do\n    local wlan = ports_wlan_tmp[wlan_index] or {}\n    local beacon_type = wlan['BeaconType']\n    ssids[i] = {\n      ssid_path = 'InternetGatewayDevice.LANDevice.1.WLANConfiguration.' .. wlan_index .. '.',\n      name = pd(false, wlan['X_HW_RFBand']),\n      type = pd(false, 'Primary'),\n      ssid = pd(true, wlan['SSID']),\n      status = pd(false, wlan['Status']),\n      enable = pd(false, bool_val(wlan['RadioEnabled'])),\n      ssid_advertisement_enabled = pd(true, bool_val(wlan['SSIDAdvertisementEnabled'])),\n      has_band_steering = pd(false, false),\n      bytes_received = pd(false, wlan['TotalBytesReceived']),\n      bytes_sent = pd(false, wlan['TotalBytesSent']),\n      mac_address = pd(false, wlan['BSSID']),\n      security = {\n        security_modes_supported = pd(false, { 'None', 'Basic', 'WPA', 'WPA2', 'WPA/WPA2', 'WPA3', 'WPA2/WPA3' }),\n        security_mode_enabled = pd(true, translate_beacon_type_to_human(beacon_type)),\n        password = pd(is_password_writable(beacon_type), nil),\n      },\n    }\n  end\n\n  return ssids\nend\n\nfunction set_ssid(ssids)\n  local values = {}\n  for _, s in ipairs(ssids or {}) do\n    local path = s.ssid_path or ''\n    if s.enable and s.enable.value ~= nil then\n      values[path .. 'RadioEnabled'] = s.enable.value\n    end\n    if s.ssid and s.ssid.value ~= nil then\n      values[path .. 'SSID'] = s.ssid.value\n    end\n    if s.ssid_advertisement_enabled and s.ssid_advertisement_enabled.value ~= nil then\n      values[path .. 'SSIDAdvertisementEnabled'] = s.ssid_advertisement_enabled.value\n    end\n    if s.security and s.security.security_mode_enabled and s.security.security_mode_enabled.value ~= nil then\n      values[path .. 'BeaconType'] = translate_beacon_type_to_cwmp(s.security.security_mode_enabled.value)\n    end\n    if s.security and s.security.password and s.security.password.value ~= nil then\n      if s.security.password.value ~= '' then\n        values[path .. 'PreSharedKey.1.KeyPassphrase'] = s.security.password.value\n      end\n    end\n  end\n  return values\nend\n\n-- Site Survey\nfunction get_site_survey_diagnostic_state()\n  return 'InternetGatewayDevice.LANDevice.1.WiFi.NeighboringWiFiDiagnostic.DiagnosticsState'\nend\n\nfunction get_site_survey_results()\n  return { 'InternetGatewayDevice.LANDevice.1.WiFi.NeighboringWiFiDiagnostic.Result.' }\nend\n\nfunction parse_get_site_survey(response)\n  local site_survey = {}\n  local tmp = {}\n  for _, param in ipairs(response.list or {}) do\n    local entry, param_type = string.match(param.name or '', 'InternetGatewayDevice%.LANDevice%.1%.WiFi%.NeighboringWiFiDiagnostic%.Result%.(%d+)%.(.+)')\n    if entry then\n      entry = tonumber(entry)\n      tmp[entry] = tmp[entry] or {}\n      tmp[entry][param_type] = param.value\n    end\n  end\n\n  for _, params in pairs(tmp) do\n    local neighbor = {\n      signal_level = params['SignalStrength'],\n      ssid = params['SSID'],\n      channel = params['Channel'],\n      standard = params['OperatingStandards'],\n      bandwidth = params['OperatingChannelBandwidth'] and trim_suffix(params['OperatingChannelBandwidth'], 'MHz') or nil,\n      bssid = params['BSSID'],\n    }\n    local radio = params['Radio']\n    if radio == 'InternetGatewayDevice.LANDevice.1.WiFi.Radio.1' then\n      site_survey['2.4GHz'] = site_survey['2.4GHz'] or {}\n      table.insert(site_survey['2.4GHz'], neighbor)\n    elseif radio == 'InternetGatewayDevice.LANDevice.1.WiFi.Radio.2' then\n      site_survey['5GHz'] = site_survey['5GHz'] or {}\n      table.insert(site_survey['5GHz'], neighbor)\n    else\n      site_survey['Unknown Frequency'] = site_survey['Unknown Frequency'] or {}\n      table.insert(site_survey['Unknown Frequency'], neighbor)\n    end\n  end\n\n  return site_survey\nend\n\n-- Connected Devices\nfunction get_connected_devices()\n  return { 'InternetGatewayDevice.LANDevice.1.Hosts.Host.' }\nend\n\nfunction parse_get_connected_devices(response)\n  local connected_devices = {}\n  local tmp = {}\n\n  for _, param in ipairs(response.list or {}) do\n    local device_number, param_type = string.match(param.name or '', 'InternetGatewayDevice%.LANDevice%.1%.Hosts%.Host%.(%d+)%.(.+)')\n    if device_number then\n      device_number = tonumber(device_number)\n      tmp[device_number] = tmp[device_number] or {}\n      tmp[device_number][param_type] = param.value\n    end\n  end\n\n  for _, device in pairs(tmp) do\n    local device_interface = 'Ethernet'\n    if device['Layer2Interface'] and device['Layer2Interface']:find('WLANConfiguration.1') then\n      device_interface = '2.4GHz'\n    elseif device['Layer2Interface'] and device['Layer2Interface']:find('WLANConfiguration.5') then\n      device_interface = '5GHz'\n    end\n\n    local resource = {\n      mac = device['MACAddress'],\n      ip_adress = device['IPAddress'],\n      adress_source = device['AddressSource'],\n      active = bool_val(device['Active']),\n      hostname = device['HostName'],\n      rssi = device['X_HW_RSSI'],\n      stats = {\n        bytes_sent = to_uint64(device['X_HW_Stats.BytesSent']),\n        bytes_received = to_uint64(device['X_HW_Stats.BytesReceived']),\n      },\n    }\n\n    connected_devices[device_interface] = connected_devices[device_interface] or {}\n    table.insert(connected_devices[device_interface], resource)\n  end\n\n  return {\n    model = model,\n    hostname = sn,\n    connected_devices = connected_devices,\n  }\nend\n\n-- Speed Test\nfunction parse_get_speed_test_result(speed_test_type, response)\n  local params = response_param_map(response)\n\n  local diagnostic = params['DiagnosticsState']\n  if diagnostic and diagnostic ~= 'Complete' and diagnostic ~= 'Completed' then\n    return nil, diagnostic .. ' state received'\n  end\n\n  local bytes_received = tonumber(params['TotalBytesReceived'] or '0') or 0\n  local raw_eom = params['EOMTime'] or ''\n  local raw_rom = params['ROMTime'] or ''\n  local raw_bom = params['BOMTime'] or ''\n\n  local eom = parse_iso_time(raw_eom)\n  local rom = parse_iso_time(raw_rom)\n  local bom = parse_iso_time(raw_bom)\n  if not eom or not rom or not bom then\n    return nil, 'Time parsing error'\n  end\n\n  local rtt = duration_string(os.difftime(bom, rom))\n  local resp_time = duration_string(os.difftime(eom, rom))\n  local elapsed = os.difftime(eom, bom)\n  local throughput = '0'\n  if elapsed \u003e 0 then\n    if speed_test_type == 'upload' then\n      local bytes_sent = tonumber(params['TotalBytesSent'] or '0') or 0\n      throughput = human_readable_bits(math.floor(8 * bytes_sent / elapsed))\n    else\n      throughput = human_readable_bits(math.floor(8 * bytes_received / elapsed))\n    end\n  end\n\n  return {\n    bytes_received = bytes_received,\n    rtt = rtt,\n    resp_time = resp_time,\n    throughput = throughput,\n    action = speed_test_type,\n  }, nil\nend\n\nfunction get_speed_test_result(speed_test_type)\n  return {\n    'InternetGatewayDevice.DownloadDiagnostics.ROMTime',\n    'InternetGatewayDevice.DownloadDiagnostics.BOMTime',\n    'InternetGatewayDevice.DownloadDiagnostics.EOMTime',\n    'InternetGatewayDevice.DownloadDiagnostics.TotalBytesReceived',\n    'InternetGatewayDevice.DownloadDiagnostics.TotalBytesSent',\n  }\nend\n\nfunction set_speed_test(test)\n  local action = test.action or test.type\n  if action == 'upload' then\n    return nil\n  end\n  local values = {}\n  if test.url and test.url ~= '' then\n    values['InternetGatewayDevice.DownloadDiagnostics.DownloadURL'] = test.url\n  end\n  if test.interface and test.interface ~= '' then\n    values['InternetGatewayDevice.DownloadDiagnostics.Interface'] = test.interface\n  end\n  values['InternetGatewayDevice.DownloadDiagnostics.DiagnosticsState'] = 'Requested'\n  return values\nend\n\nfunction get_download_diagnostic_state()\n  return 'InternetGatewayDevice.DownloadDiagnostics.DiagnosticsState'\nend\n\nfunction get_upload_diagnostic_state()\n  return 'InternetGatewayDevice.UploadDiagnostics.DiagnosticsState'\nend\n\n-- Ping\nfunction get_ping()\n  return {\n    'InternetGatewayDevice.IPPingDiagnostics.Interface',\n    'InternetGatewayDevice.IPPingDiagnostics.Timeout',\n    'InternetGatewayDevice.IPPingDiagnostics.Host',\n    'InternetGatewayDevice.IPPingDiagnostics.NumberOfRepetitions',\n    'InternetGatewayDevice.IPPingDiagnostics.DataBlockSize',\n    'InternetGatewayDevice.IPPingDiagnostics.FailureCount',\n    'InternetGatewayDevice.IPPingDiagnostics.SuccessCount',\n    'InternetGatewayDevice.IPPingDiagnostics.AverageResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.MinimumResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.MaximumResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.DiagnosticsState',\n  }\nend\n\nfunction parse_get_ping(response)\n  local params = response_param_map(response)\n\n  local timeout = to_int(params['Timeout'], 5000)\n  local timeout_seconds = math.floor(timeout / 1000)\n  local repetitions = to_int(params['NumberOfRepetitions'], 3)\n  local block_size = to_int(params['DataBlockSize'], 32)\n  if block_size == 0 then\n    block_size = 32\n  end\n\n  local failure_count = to_int(params['FailureCount'], 0)\n  local success_count = to_int(params['SuccessCount'], 0)\n  local avg_rtt = to_int(params['AverageResponseTime'], 0)\n  local min_rtt = to_int(params['MinimumResponseTime'], 0)\n  local max_rtt = to_int(params['MaximumResponseTime'], 0)\n\n  local diagnostic = params['DiagnosticsState'] or ''\n  local interface_value = params['Interface']\n  local host = params['Host']\n\n  local last_result = {\n    result = parse_diagnostic_state(diagnostic, failure_count),\n    failure_count = failure_count,\n    success_count = success_count,\n    average_rtt = avg_rtt,\n    minimum_rtt = min_rtt,\n    maximum_rtt = max_rtt,\n  }\n\n  return {\n    interface = pd(false, interface_value),\n    timeout = pd(true, timeout_seconds),\n    host = pd(true, host),\n    number_of_repetitions = pd(true, repetitions),\n    data_block_size = pd(true, block_size),\n    processing = pd(false, diagnostic == 'Requested' or diagnostic == 'Request'),\n    last_result = last_result,\n  }\nend\n\nfunction get_ping_diagnostic_state()\n  return 'InternetGatewayDevice.IPPingDiagnostics.DiagnosticsState'\nend\n\nfunction set_ping(ping)\n  local values = {}\n  local data_block = ping.data_block_size and ping.data_block_size.value or 32\n  if data_block == nil or data_block == 0 then\n    data_block = 32\n  end\n\n  values['InternetGatewayDevice.IPPingDiagnostics.Interface'] = ping.interface.value\n  values['InternetGatewayDevice.IPPingDiagnostics.Timeout'] = (ping.timeout.value or 0) * 1000\n  values['InternetGatewayDevice.IPPingDiagnostics.Host'] = ping.host.value\n  values['InternetGatewayDevice.IPPingDiagnostics.NumberOfRepetitions'] = ping.number_of_repetitions.value\n  values['InternetGatewayDevice.IPPingDiagnostics.DiagnosticsState'] = 'Requested'\n  values['InternetGatewayDevice.IPPingDiagnostics.DataBlockSize'] = data_block\n\n  return values\nend\n\nfunction get_ping_result()\n  return {\n    'InternetGatewayDevice.IPPingDiagnostics.FailureCount',\n    'InternetGatewayDevice.IPPingDiagnostics.SuccessCount',\n    'InternetGatewayDevice.IPPingDiagnostics.AverageResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.MinimumResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.MaximumResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.DiagnosticsState',\n  }\nend\n\nfunction parse_get_ping_result(response)\n  local list = response.list or {}\n  if #list \u003c 6 then\n    return nil\n  end\n\n  local failure_count = to_int(list[1].value, 0)\n  local success_count = to_int(list[2].value, 0)\n  local avg_rtt = to_int(list[3].value, 0)\n  local min_rtt = to_int(list[4].value, 0)\n  local max_rtt = to_int(list[5].value, 0)\n  local diagnostic_state = list[6].value or ''\n\n  if diagnostic_state == 'Error_CannotResolveHostName' then\n    diagnostic_state = 'Cannot resolve host name'\n  elseif diagnostic_state == 'Error_MaxHopCountExceeded' then\n    diagnostic_state = 'Max hop count exceeded'\n  elseif diagnostic_state == 'Requested' then\n    diagnostic_state = 'In progress'\n  elseif diagnostic_state == 'Complete' then\n    if failure_count \u003e 0 then\n      diagnostic_state = 'Failure'\n    else\n      diagnostic_state = 'Success'\n    end\n  elseif diagnostic_state == 'None' then\n    diagnostic_state = 'None'\n  else\n    diagnostic_state = 'Unknown'\n  end\n\n  return {\n    result = diagnostic_state,\n    failure_count = failure_count,\n    success_count = success_count,\n    average_rtt = avg_rtt,\n    minimum_rtt = min_rtt,\n    maximum_rtt = max_rtt,\n  }\nend\n\n-- Traceroute\nfunction get_traceroute()\n  return {\n    'InternetGatewayDevice.TraceRouteDiagnostics.Interface',\n    'InternetGatewayDevice.TraceRouteDiagnostics.Timeout',\n    'InternetGatewayDevice.TraceRouteDiagnostics.Host',\n    'InternetGatewayDevice.TraceRouteDiagnostics.NumberOfTries',\n    'InternetGatewayDevice.TraceRouteDiagnostics.MaxHopCount',\n  }\nend\n\nfunction parse_get_traceroute(response)\n  local list = response.list or {}\n  if #list \u003c 5 then\n    return nil\n  end\n\n  local timeout = to_int(list[2].value, 30000)\n  local number_of_tries = to_int(list[4].value, 0)\n  local max_hop_count = to_int(list[5].value, 0)\n\n  return {\n    interface = pd(false, list[1].value),\n    timeout = pd(true, math.floor(timeout / 1000)),\n    host = pd(true, list[3].value),\n    number_of_tries = pd(true, number_of_tries),\n    max_hop_count = pd(true, max_hop_count),\n  }\nend\n\nfunction get_traceroute_diagnostic_state()\n  return 'InternetGatewayDevice.TraceRouteDiagnostics.DiagnosticsState'\nend\n\nfunction set_traceroute(traceroute)\n  local values = {}\n  values['InternetGatewayDevice.TraceRouteDiagnostics.Timeout'] = traceroute.timeout.value\n  values['InternetGatewayDevice.TraceRouteDiagnostics.Host'] = traceroute.host.value\n  values['InternetGatewayDevice.TraceRouteDiagnostics.NumberOfTries'] = traceroute.number_of_tries.value\n  values['InternetGatewayDevice.TraceRouteDiagnostics.MaxHopCount'] = traceroute.max_hop_count.value\n  values['InternetGatewayDevice.TraceRouteDiagnostics.DiagnosticsState'] = 'Requested'\n  return values\nend\n\nfunction get_traceroute_result_number_of_hops()\n  return 'InternetGatewayDevice.TraceRouteDiagnostics.RouteHopsNumberOfEntries'\nend\n\nfunction get_traceroute_result(number_of_hops)\n  local params = {\n    'InternetGatewayDevice.TraceRouteDiagnostics.DiagnosticsState',\n    'InternetGatewayDevice.TraceRouteDiagnostics.ResponseTime',\n    'InternetGatewayDevice.TraceRouteDiagnostics.RouteHopsNumberOfEntries',\n  }\n  for i = 1, number_of_hops do\n    local entry = tostring(i)\n    params[#params+1] = 'InternetGatewayDevice.TraceRouteDiagnostics.RouteHops.' .. entry .. '.HopHost'\n    params[#params+1] = 'InternetGatewayDevice.TraceRouteDiagnostics.RouteHops.' .. entry .. '.HopRTTimes'\n    params[#params+1] = 'InternetGatewayDevice.TraceRouteDiagnostics.RouteHops.' .. entry .. '.HopHostAddress'\n  end\n  return params\nend\n\nfunction parse_get_traceroute_result(response)\n  local list = response.list or {}\n  if #list \u003c 3 then\n    return nil\n  end\n\n  local result = {}\n  local diagnostic_state = list[1].value or ''\n  if diagnostic_state == 'Error_CannotResolveHostName' then\n    result.result = 'Cannot resolve host name'\n  elseif diagnostic_state == 'Error_MaxHopCountExceeded' then\n    result.result = 'Max hop count exceeded'\n  elseif diagnostic_state == 'Requested' then\n    result.result = 'In progress'\n  elseif diagnostic_state == 'Complete' then\n    result.result = 'Success'\n  elseif diagnostic_state == 'None' then\n    result.result = 'None'\n  else\n    result.result = 'Success'\n  end\n\n  result.response_time = to_int(list[2].value, 0)\n  result.hop_count = to_int(list[3].value, 0)\n\n  local hops = {}\n  local index = 4\n  for i = 1, result.hop_count do\n    hops[i] = {\n      host = list[index] and list[index].value or nil,\n      rtt = list[index + 1] and list[index + 1].value or nil,\n      addr = list[index + 2] and list[index + 2].value or nil,\n    }\n    index = index + 3\n  end\n  result.hops = hops\n\n  return result\nend\n\n-- Statistics\nfunction get_statistics()\n  return {\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.Stats.',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.2.Stats.',\n    'InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.',\n  }\nend\n\nfunction parse_get_statistics(response)\n  local all_stats = {}\n  local stats_tmp = {}\n\n  for _, param in ipairs(response.list or {}) do\n    local name = param.name or ''\n    if name:find('LANDevice%.') then\n      local wlan_number = tonumber(name:match('InternetGatewayDevice%.LANDevice%.1%.WLANConfiguration%.(%d+)%.'))\n      local wlan_type = '2.4GHz'\n      if wlan_number == 2 then\n        wlan_type = '5GHz'\n      end\n      stats_tmp[wlan_type] = stats_tmp[wlan_type] or {}\n      local param_type = name:match('InternetGatewayDevice%.LANDevice%.1%.WLANConfiguration%.%d+%.Stats%.(.+)')\n      if param_type then\n        stats_tmp[wlan_type][param_type] = to_uint64(param.value)\n      end\n    elseif name:find('WANDevice%.') then\n      local wan_number = tonumber(name:match('InternetGatewayDevice%.WANDevice%.(%d+)%.')) or 0\n      local wan_type = 'WAN-' .. tostring(wan_number)\n      stats_tmp[wan_type] = stats_tmp[wan_type] or {}\n      local param_type = name:match('InternetGatewayDevice%.WANDevice%.%d+%.WANCommonInterfaceConfig%.(.+)')\n      if param_type then\n        stats_tmp[wan_type][param_type] = to_uint64(param.value)\n      end\n    end\n  end\n\n  for stats_type, stats in pairs(stats_tmp) do\n    local resource = {\n      bytes_sent = stats['TotalBytesSent'] or 0,\n      bytes_received = stats['TotalBytesReceived'] or 0,\n      packets_sent = stats['TotalPacketsSent'] or 0,\n      packets_received = stats['TotalPacketsReceived'] or 0,\n      errors_sent = stats['ErrorsSent'] or 0,\n      errors_received = stats['ErrorsReceived'] or 0,\n      discard_packets_sent = stats['DiscardPacketsSent'] or 0,\n      discard_packets_received = stats['DiscardPacketsReceived'] or 0,\n      unicast_packets_sent = stats['UnicastPacketsSent'] or 0,\n      unicast_packets_received = stats['UnicastPacketsReceived'] or 0,\n      multicast_packets_sent = stats['MulticastPacketsSent'] or 0,\n      multicast_packets_received = stats['MulticastPacketsReceived'] or 0,\n      broadcast_packets_sent = stats['BroadcastPacketsSent'] or 0,\n      broadcast_packets_received = stats['BroadcastPacketsReceived'] or 0,\n      unknown_packets_received = stats['UnknownProtoPacketsReceived'] or 0,\n    }\n    all_stats[stats_type] = all_stats[stats_type] or {}\n    table.insert(all_stats[stats_type], resource)\n  end\n\n  return all_stats\nend\n\n-- Interfaces (TR-098)\nfunction get_interface_wan()\n  return { 'InternetGatewayDevice.WANDevice.1.' }\nend\n\nfunction get_interface_lan()\n  return { 'InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.' }\nend\n\nfunction get_interface_wlan()\n  return { 'InternetGatewayDevice.LANDevice.1.WLANConfiguration.' }\nend\n\nfunction get_wan_options()\n  return nil\nend\n\nfunction parse_get_interface_wan(response)\n  local ports_wan = {}\n  local ports_wan_tmp = {}\n\n  for _, param in ipairs(response.list or {}) do\n    local name = param.name or ''\n    if name:find('WANConnectionDevice%.') then\n      local wan_number = tonumber(name:match('InternetGatewayDevice%.WANDevice%.1%.WANConnectionDevice%.(%d+)%.'))\n      if wan_number then\n        ports_wan_tmp[wan_number] = ports_wan_tmp[wan_number] or {}\n        if name:find('WANIPConnection%.') then\n          local ip_number, param_type = name:match('InternetGatewayDevice%.WANDevice%.1%.WANConnectionDevice%.%d+%.WANIPConnection%.(%d+)%.(.+)')\n          if ip_number then\n            ip_number = tonumber(ip_number)\n            ports_wan_tmp[wan_number][ip_number] = ports_wan_tmp[wan_number][ip_number] or {}\n            ports_wan_tmp[wan_number][ip_number][param_type] = param.value\n          end\n        elseif name:find('WANPPPConnection%.') then\n          local ip_number, param_type = name:match('InternetGatewayDevice%.WANDevice%.1%.WANConnectionDevice%.%d+%.WANPPPConnection%.(%d+)%.(.+)')\n          if ip_number then\n            ip_number = tonumber(ip_number) + 100\n            ports_wan_tmp[wan_number][ip_number] = ports_wan_tmp[wan_number][ip_number] or {}\n            ports_wan_tmp[wan_number][ip_number][param_type] = param.value\n          end\n        end\n      end\n    end\n  end\n\n  for wan_number, ports_wan_value in pairs(ports_wan_tmp) do\n    local path = 'InternetGatewayDevice.WANDevice.1.WANConnectionDevice.' .. wan_number .. '.'\n    for ip_number, ip_data in pairs(ports_wan_value) do\n      local ip_path\n      if ip_number \u003e= 100 then\n        ip_path = path .. 'WANPPPConnection.' .. (ip_number - 100) .. '.'\n      else\n        ip_path = path .. 'WANIPConnection.' .. ip_number .. '.'\n      end\n\n      ports_wan[ip_path] = {\n        path = ip_path,\n        enable = pd(true, (ip_data['Enable'] == '1')),\n        alias = pd(false, 'Logical WAN Connection ' .. wan_number),\n        upstream = pd(false, true),\n        mac_address = pd(false, ip_data['MACAddress']),\n        status = pd(false, ip_data['Status']),\n        tx = pd(false, to_int(ip_data['Stats.EthernetBytesSent'], 0)),\n        rx = pd(false, to_int(ip_data['Stats.EthernetBytesReceived'], 0)),\n        stats = wan_stats(ip_data),\n        ip = {\n          {\n            path = path,\n            enable = pd(true, (ip_data['Enable'] == '1')),\n            name = pd(false, 'WAN Connection ' .. ip_number),\n            ipv4 = {\n              enable = pd(true, (ip_data['X_HW_IPv4Enable'] == '1')),\n              ip_address = pd(ip_attribute_is_writable(ip_data['AddressingType']), ip_data['ExternalIPAddress']),\n              origin = pd(false, get_ip_origin(ip_data['AddressingType'])),\n              subnet_mask = pd(ip_attribute_is_writable(ip_data['AddressingType']), ip_data['SubnetMask']),\n              gateway = pd(ip_attribute_is_writable(ip_data['AddressingType']), ip_data['DefaultGateway']),\n              dns_servers = {\n                dns_servers = pd(ip_attribute_is_writable(ip_data['AddressingType']), ip_data['DNSServers']),\n              },\n            },\n            pppoe = {\n              path = (get_ip_origin(ip_data['AddressingType']) == 'PPPoE') and '-' or '',\n              username = pd(true, ip_data['Username']),\n              password = pd(true, ip_data['Password']),\n            },\n            vlan = {\n              path = '-',\n              enable = pd(true, (ip_data['X_HW_VLAN'] or '0') ~= '0'),\n              id = pd(true, to_int(ip_data['X_HW_VLAN'], 0)),\n            },\n            service = pd(false, ip_data['X_HW_SERVICELIST']),\n            ipv6 = {\n              enable = pd(true, (ip_data['X_HW_IPv6Enable'] == '1')),\n            },\n          },\n        },\n      }\n    end\n  end\n\n  return ports_wan\nend\n\nfunction parse_get_interface_lan(response)\n  local ports_lan = {}\n  local ports_lan_tmp = {}\n\n  for _, param in ipairs(response.list or {}) do\n    local lan_number, param_type = string.match(param.name or '', 'InternetGatewayDevice%.LANDevice%.1%.LANEthernetInterfaceConfig%.(%d+)%.(.+)')\n    if lan_number then\n      lan_number = tonumber(lan_number)\n      ports_lan_tmp[lan_number] = ports_lan_tmp[lan_number] or {}\n      ports_lan_tmp[lan_number][param_type] = param.value\n    end\n  end\n\n  for lan_number, port in pairs(ports_lan_tmp) do\n    local name = port['Name'] or ('LAN ' .. lan_number)\n    ports_lan[name] = {\n      path = 'InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.' .. lan_number .. '.',\n      enable = pd(false, (port['Enable'] == '1')),\n      alias = pd(false, 'LAN ' .. lan_number),\n      upstream = pd(false, false),\n      mac_address = pd(false, port['MACAddress']),\n      status = pd(false, port['Status']),\n      tx = pd(false, to_int(port['Stats.BytesSent'], 0)),\n      rx = pd(false, to_int(port['Stats.BytesReceived'], 0)),\n      stats = {\n        bytes_sent = to_uint64(port['Stats.BytesSent']),\n        bytes_received = to_uint64(port['Stats.BytesReceived']),\n        packets_sent = to_uint64(port['Stats.PacketsSent']),\n        packets_received = to_uint64(port['Stats.PacketsReceived']),\n        errors_sent = to_uint64(port['Stats.ErrorsSent']),\n        errors_received = to_uint64(port['Stats.ErrorsReceived']),\n        discard_packets_sent = to_uint64(port['Stats.DiscardPacketsSent']),\n        discard_packets_received = to_uint64(port['Stats.DiscardPacketsReceived']),\n        unicast_packets_sent = to_uint64(port['Stats.UnicastPacketsSent']),\n        unicast_packets_received = to_uint64(port['Stats.UnicastPacketsReceived']),\n        multicast_packets_sent = to_uint64(port['Stats.MulticastPacketsSent']),\n        multicast_packets_received = to_uint64(port['Stats.MulticastPacketsReceived']),\n        broadcast_packets_sent = to_uint64(port['Stats.BroadcastPacketsSent']),\n        broadcast_packets_received = to_uint64(port['Stats.BroadcastPacketsReceived']),\n        unknown_packets_received = to_uint64(port['Stats.UnknownProtoPacketsReceived']),\n      },\n    }\n  end\n\n  return ports_lan\nend\n\nfunction set_port(ports)\n  local values = {}\n  for port_name, port in pairs(ports or {}) do\n    if not port.ip or #port.ip == 0 then\n      return nil, 'error setting port, IP is not set for port ' .. tostring(port_name)\n    end\n    for _, ip in ipairs(port.ip) do\n      local path = port.path or ip.path or ''\n\n      if ip.enable and ip.enable.value ~= nil then\n        values[path .. 'Enable'] = bool_val(port.enable and port.enable.value)\n      end\n      if ip.name and ip.name.value ~= nil then\n        values[path .. 'Name'] = ip.name.value\n      end\n      if ip.ipv4 and ip.ipv4.ip_address and ip.ipv4.ip_address.value ~= nil then\n        values[path .. 'ExternalIPAddress'] = ip.ipv4.ip_address.value\n      end\n      if ip.ipv4 and ip.ipv4.dns_servers and ip.ipv4.dns_servers.dns_servers and ip.ipv4.dns_servers.dns_servers.value ~= nil then\n        values[path .. 'DNSServers'] = ip.ipv4.dns_servers.dns_servers.value\n      end\n      if ip.ipv4 and ip.ipv4.subnet_mask and ip.ipv4.subnet_mask.value ~= nil then\n        values[path .. 'SubnetMask'] = ip.ipv4.subnet_mask.value\n      end\n      if ip.ipv4 and ip.ipv4.gateway and ip.ipv4.gateway.value ~= nil then\n        values[path .. 'DefaultGateway'] = ip.ipv4.gateway.value\n      end\n      if ip.ipv6 and ip.ipv6.enable and ip.ipv6.enable.value ~= nil then\n        values[path .. 'X_HW_IPv6Enable'] = ip.ipv6.enable.value\n      end\n      if ip.pppoe and ip.pppoe.username and ip.pppoe.username.value ~= nil then\n        values[path .. 'Username'] = ip.pppoe.username.value\n      end\n      if ip.pppoe and ip.pppoe.password and ip.pppoe.password.value ~= nil then\n        values[path .. 'Password'] = ip.pppoe.password.value\n      end\n      if ip.vlan and ip.vlan.enable and ip.vlan.enable.value ~= nil then\n        if ip.vlan.enable.value then\n          if ip.vlan.id and ip.vlan.id.value ~= nil then\n            values[path .. 'X_HW_VLAN'] = ip.vlan.id.value\n          end\n        else\n          values[path .. 'X_HW_VLAN'] = 0\n        end\n      elseif ip.vlan and ip.vlan.id and ip.vlan.id.value ~= nil then\n        values[path .. 'X_HW_VLAN'] = ip.vlan.id.value\n      end\n    end\n  end\n  if next(values) == nil then\n    return nil, 'error setting port, no parameters to set'\n  end\n  return values, nil\nend\n\nfunction add_port(port)\n  local parameters = {}\n  local new_port = port.ip and port.ip[1]\n  if not new_port then\n    return nil, 'error adding port, IP is not set'\n  end\n  local path = new_port.path or ''\n\n  local addressing_type = new_port.ipv4 and new_port.ipv4.origin and new_port.ipv4.origin.value or ''\n  if addressing_type == 'PPPoE' then\n    parameters[path .. 'Username'] = new_port.pppoe.username.value\n    parameters[path .. 'Password'] = new_port.pppoe.password.value\n  elseif addressing_type == 'DHCP' then\n    parameters[path .. 'AddressingType'] = 'DHCP'\n  elseif addressing_type == 'Static' then\n    parameters[path .. 'AddressingType'] = 'Static'\n    local ip_address = new_port.ipv4.ip_address.value\n    if ip_address == '' or not is_valid_ipv4(ip_address) then\n      return nil, 'error adding port, IP address is not valid'\n    end\n    parameters[path .. 'ExternalIPAddress'] = ip_address\n\n    local subnet_mask = new_port.ipv4.subnet_mask.value\n    if subnet_mask == '' or not is_valid_subnet_mask(subnet_mask) then\n      return nil, 'error adding port, subnet mask is not valid'\n    end\n    parameters[path .. 'SubnetMask'] = subnet_mask\n\n    local gateway = new_port.ipv4.gateway.value\n    if gateway ~= '' and is_valid_ipv4(gateway) then\n      parameters[path .. 'DefaultGateway'] = gateway\n    end\n\n    if gateway == ip_address then\n      return nil, 'error adding port, gateway cannot be the same as IP address'\n    end\n\n    if gateway ~= '' and not are_ips_in_same_subnet(gateway, ip_address, subnet_mask) then\n      return nil, 'error adding port, gateway is not in the same subnet as IP address'\n    end\n\n    local dns_servers = new_port.ipv4.dns_servers and new_port.ipv4.dns_servers.dns_servers and new_port.ipv4.dns_servers.dns_servers.value or ''\n    if dns_servers ~= '' then\n      parameters[path .. 'DNSServers'] = dns_servers\n    end\n  else\n    return nil, 'error adding port, unsupported addressing type: ' .. tostring(addressing_type)\n  end\n\n  if new_port.ipv6 and new_port.ipv6.enable and new_port.ipv6.enable.value ~= nil then\n    parameters[path .. 'X_HW_IPv6Enable'] = new_port.ipv6.enable.value and '1' or '0'\n  end\n\n  if new_port.vlan and new_port.vlan.enable and new_port.vlan.enable.value ~= nil then\n    if new_port.vlan.enable.value then\n      local vlan = new_port.vlan.id.value\n      if vlan \u003c= 0 or vlan \u003e 4094 then\n        return nil, 'error adding port, VLAN ID is not valid'\n      end\n      parameters[path .. 'X_HW_VLAN'] = vlan\n    else\n      parameters[path .. 'X_HW_VLAN'] = 0\n    end\n  else\n    parameters[path .. 'X_HW_VLAN'] = 0\n  end\n\n  local service = new_port.service and new_port.service.value or ''\n  parameters[path .. 'X_HW_SERVICELIST'] = service\n\n  return parameters, nil\nend\n\n-- Hardware info\nfunction get_hwinfo()\n  return {\n    'InternetGatewayDevice.DeviceInfo.UpTime',\n    'InternetGatewayDevice.DeviceInfo.MemoryStatus.Total',\n    'InternetGatewayDevice.DeviceInfo.MemoryStatus.Free',\n    'InternetGatewayDevice.DeviceInfo.ProcessStatus.CPUUsage',\n    'InternetGatewayDevice.DeviceInfo.Processor.1.Architecture',\n    'InternetGatewayDevice.DeviceInfo.HardwareVersion',\n    'InternetGatewayDevice.DeviceInfo.TemperatureStatus.TemperatureSensor.',\n  }\nend\n\nfunction parse_get_hwinfo(response)\n  local list = response.list or {}\n  if #list \u003c 6 then\n    return nil\n  end\n\n  local uptime = to_uint64(list[1].value)\n  local hw_version = list[2].value\n  local mem_total = to_uint64(list[3].value)\n  local mem_free = to_uint64(list[4].value)\n  local cpu_usage = tonumber(list[5].value) or 0\n  local architecture = list[6].value\n\n  local mem_use = mem_total - mem_free\n  local memory_usage = 0\n  if mem_total \u003e 0 then\n    memory_usage = (mem_use * 100) / mem_total\n  end\n\n  local temperature = {}\n  local sensor_tmp = {}\n  for i = 7, #list do\n    local name = list[i].name or ''\n    local sensor_number, param_type = string.match(name, 'InternetGatewayDevice%.DeviceInfo%.TemperatureStatus%.TemperatureSensor%.(%d+)%.(.+)')\n    if sensor_number then\n      sensor_number = tonumber(sensor_number)\n      sensor_tmp[sensor_number] = sensor_tmp[sensor_number] or {}\n      sensor_tmp[sensor_number][param_type] = list[i].value\n    end\n  end\n\n  for _, sensor_value in pairs(sensor_tmp) do\n    if sensor_value['Status'] == 'Enabled' or sensor_value['Status'] == 'Enable' then\n      local t = tonumber(sensor_value['Value']) or 0\n      temperature[#temperature+1] = { [sensor_value['Name']] = t }\n    end\n  end\n\n  return {\n    uptime_seconds = uptime,\n    hardware_version = hw_version,\n    architecture = architecture,\n    memory_total_kilobytes = mem_total,\n    memory_free_kilobytes = mem_free,\n    memory_use_kilobytes = mem_use,\n    memory_usage_percentage = tonumber(string.format('%.2f', memory_usage)),\n    cpu_usage_percentage = cpu_usage,\n    temperature_celsius = temperature,\n  }\nend\n\n-- PON\nfunction get_pon()\n  return { 'InternetGatewayDevice.WANDevice.1.X_GponInterafceConfig.' }\nend\n\nfunction parse_get_pon(response)\n  local pon = { stats = {} }\n  local pon_tmp = {}\n\n  for _, param in ipairs(response.list or {}) do\n    local name = param.name or ''\n    if name:find('X_GponInterafceConfig%.Stats%.') then\n      local param_type = name:match('InternetGatewayDevice%.WANDevice%.1%.X_GponInterafceConfig%.Stats%.(.+)')\n      if param_type then\n        pon_tmp[param_type] = param.value\n      end\n    else\n      local param_type = name:match('InternetGatewayDevice%.WANDevice%.1%.X_GponInterafceConfig%.(.+)')\n      if param_type then\n        pon_tmp[param_type] = param.value\n      end\n    end\n  end\n\n  for key, value in pairs(pon_tmp) do\n    if key == 'Status' then\n      pon.status = value\n    elseif key == 'TXPower' then\n      pon.tx_dbm = to_int(value, 0)\n    elseif key == 'RXPower' then\n      pon.rx_dbm = to_int(value, 0)\n    elseif key == 'TransceiverTemperature' then\n      pon.temperature_celsius = tonumber(value) or 0\n    elseif key == 'BiasCurrent' then\n      pon.bias_current_mA = to_int(value, 0)\n    elseif key == 'SupplyVoltage' then\n      pon.supply_voltage_mV = to_int(value, 0)\n    elseif key == 'BytesSent' then\n      pon.stats.bytes_sent = to_uint64(value)\n    elseif key == 'BytesReceived' then\n      pon.stats.bytes_received = to_uint64(value)\n    elseif key == 'PacketsSent' then\n      pon.stats.packets_sent = to_uint64(value)\n    elseif key == 'PacketsReceived' then\n      pon.stats.packets_received = to_uint64(value)\n    elseif key == 'SUnicastPackets' then\n      pon.stats.unicast_packets_sent = to_uint64(value)\n    elseif key == 'RUnicastPackets' then\n      pon.stats.unicast_packets_received = to_uint64(value)\n    elseif key == 'SMulticastPackets' then\n      pon.stats.multicast_packets_sent = to_uint64(value)\n    elseif key == 'RMulticastPackets' then\n      pon.stats.multicast_packets_received = to_uint64(value)\n    elseif key == 'SBroadcastPackets' then\n      pon.stats.broadcast_packets_sent = to_uint64(value)\n    elseif key == 'RBroadcastPackets' then\n      pon.stats.broadcast_packets_received = to_uint64(value)\n    elseif key == 'FECError' then\n      pon.stats.fec_error = to_uint64(value)\n    elseif key == 'HECError' then\n      pon.stats.hec_error = to_uint64(value)\n    elseif key == 'DropPackets' then\n      pon.stats.drop_packets = to_uint64(value)\n    elseif key == 'DropRate' then\n      pon.stats.drop_rate_packets = to_uint64(value)\n    elseif key == 'ErrorRate' then\n      pon.stats.error_rate = to_uint64(value)\n    elseif key == 'SPausePackets' then\n      pon.stats.pause_packets_sent = to_uint64(value)\n    elseif key == 'RPausePackets' then\n      pon.stats.pause_packets_received = to_uint64(value)\n    end\n  end\n\n  return pon\nend\n\n-- The following functions are not implemented in the Go model and fallback to Go (nil).\nfunction get_port() return nil end\nfunction parse_get_port(response) return nil end\nfunction get_bridge() return nil end\nfunction parse_get_bridge(response) return nil end\nfunction set_bridge(bridges) return nil end\nfunction get_voice() return nil end\nfunction parse_get_voice(response) return nil end\nfunction set_voice(voice) return nil, nil end\nfunction set_line(line) return nil, nil end\nfunction get_cellular() return nil end\nfunction parse_get_cellular(response) return {} end\nfunction set_cellular(cellular) return nil end\nfunction get_xdsl() return nil end\nfunction parse_xdsl(response) return nil end\n"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Update Device Script
    request:
      url: "{{base_url}}device-profile"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
      body:
        type: json
        data: |-
          {
              "name": "MeuProfile",
              "model": "EG8145X6-10",
              "protocol": "cwmp",
              "active": true,
              "content": "-- EG8145X6-10 model script for devices-manager\n-- Functions return tables that map to resources JSON structures.\n-- If a function returns nil, devices-manager falls back to the Go implementation.\n\n-- Helpers\nlocal function trim(s)\n  return (s:gsub('^%s+', ''):gsub('%s+$', ''))\nend\n\nlocal function split(s, sep)\n  local t = {}\n  if s == nil or s == '' then\n    return t\n  end\n  sep = sep or ','\n  local pattern = '([^' .. sep .. ']+)'\n  for part in string.gmatch(s, pattern) do\n    t[#t+1] = trim(part)\n  end\n  return t\nend\n\nlocal function split_int(s, sep)\n  local out = {}\n  for _, v in ipairs(split(s, sep)) do\n    local n = tonumber(v)\n    if n ~= nil then\n      out[#out+1] = n\n    end\n  end\n  return out\nend\n\nlocal function trim_prefix(value, prefix)\n  if value == nil then\n    return nil\n  end\n  if value:sub(1, #prefix) == prefix then\n    return value:sub(#prefix + 1)\n  end\n  return value\nend\n\nlocal function trim_suffix(value, suffix)\n  if value == nil then\n    return nil\n  end\n  if value:sub(-#suffix) == suffix then\n    return value:sub(1, #value - #suffix)\n  end\n  return value\nend\n\nlocal function bool_val(v)\n  if v == nil then\n    return false\n  end\n  if type(v) == 'boolean' then\n    return v\n  end\n  local s = tostring(v):lower()\n  if s == '1' or s == 'true' then\n    return true\n  end\n  if s == '0' or s == 'false' then\n    return false\n  end\n  return false\nend\n\nlocal function to_int(v, default)\n  local n = tonumber(v)\n  if n == nil then\n    return default\n  end\n  return math.floor(n)\nend\n\nlocal function to_uint64(v)\n  local n = tonumber(v)\n  if n == nil or n \u003c 0 then\n    return 0\n  end\n  return math.floor(n)\nend\n\nlocal function pd(writable, value)\n  return { writable = writable, value = value }\nend\n\nlocal function response_param_map(response)\n  local param_map = {}\n  local list = response and response.list or {}\n  for _, param in ipairs(list) do\n    local name = param.name or ''\n    local value = param.value\n    local last = name:match('([^.]+)$') or name\n    param_map[last] = value\n  end\n  return param_map\nend\n\nlocal function format_transmit_power_supported(raw)\n  if raw == nil then\n    return nil\n  end\n  local out = {}\n  for _, power in ipairs(split(raw, ',')) do\n    if power == '-1' then\n      out[#out+1] = 'Auto'\n    else\n      out[#out+1] = power .. '%'\n    end\n  end\n  return out\nend\n\nlocal function translate_beacon_type_to_human(value)\n  if value == '11i' then\n    return 'WPA2'\n  elseif value == 'WPAand11i' then\n    return 'WPA/WPA2'\n  elseif value == '11iandWPA3' then\n    return 'WPA2/WPA3'\n  end\n  return value\nend\n\nlocal function translate_beacon_type_to_cwmp(value)\n  if value == 'WPA2' then\n    return '11i'\n  elseif value == 'WPA/WPA2' then\n    return 'WPAand11i'\n  elseif value == 'WPA2/WPA3' then\n    return '11iandWPA3'\n  end\n  return value\nend\n\nlocal function is_password_writable(beacon_type)\n  return not (beacon_type == 'Basic' or beacon_type == 'None')\nend\n\nlocal function duration_string(seconds)\n  if seconds == nil then\n    return ''\n  end\n  local total = math.floor(seconds)\n  if total \u003c 60 then\n    return string.format('%ds', total)\n  end\n  local mins = math.floor(total / 60)\n  local secs = total - mins * 60\n  if mins \u003c 60 then\n    return string.format('%dm%ds', mins, secs)\n  end\n  local hours = math.floor(mins / 60)\n  mins = mins - hours * 60\n  return string.format('%dh%dm%ds', hours, mins, secs)\nend\n\nlocal function human_readable_bits(bits)\n  local sizes = { 'bits p/s', 'Kbps', 'Mbps', 'Gbps', 'Tbps', 'Pbps', 'Ebps' }\n  local value = bits\n  local i = 1\n  while value \u003e= 1000 and i \u003c #sizes do\n    value = value / 1000\n    i = i + 1\n  end\n  return string.format('%.2f%s', value, sizes[i])\nend\n\nlocal function parse_iso_time(raw)\n  if raw == nil then\n    return nil\n  end\n  if raw:sub(-1) == 'Z' then\n    raw = raw:sub(1, -2)\n  end\n  local y, mo, d, h, mi, s = raw:match('^(%d+)%-(%d+)%-(%d+)T(%d+):(%d+):(%d+)')\n  if not y then\n    return nil\n  end\n  return os.time({ year = tonumber(y), month = tonumber(mo), day = tonumber(d), hour = tonumber(h), min = tonumber(mi), sec = tonumber(s) })\nend\n\nlocal function get_ip_origin(value)\n  if value == nil or value == '' then\n    return 'PPPoE'\n  end\n  return value\nend\n\nlocal function ip_attribute_is_writable(attribute)\n  return get_ip_origin(attribute) == 'Static'\nend\n\nlocal function parse_diagnostic_state(raw, failure_count)\n  if raw == 'Error_CannotResolveHostName' then\n    return 'Cannot resolve host name'\n  elseif raw == 'Error_MaxHopCountExceeded' then\n    return 'Max hop count exceeded'\n  elseif raw == 'Requested' or raw == 'Running' then\n    return 'In progress'\n  elseif raw == 'Complete' or raw == 'Completed' then\n    if failure_count \u003e 0 then\n      return 'Failure'\n    end\n    return 'Success'\n  elseif raw == 'None' then\n    return 'None'\n  end\n  return 'Unknown'\nend\n\nlocal function ip_to_octets(ip)\n  if ip == nil then\n    return nil\n  end\n  local a, b, c, d = ip:match('^(%d+)%.(%d+)%.(%d+)%.(%d+)$')\n  if not a then\n    return nil\n  end\n  a, b, c, d = tonumber(a), tonumber(b), tonumber(c), tonumber(d)\n  if a \u003e 255 or b \u003e 255 or c \u003e 255 or d \u003e 255 then\n    return nil\n  end\n  return a, b, c, d\nend\n\nlocal function band(a, b)\n  local res = 0\n  local bit = 1\n  while a \u003e 0 or b \u003e 0 do\n    local a_bit = a % 2\n    local b_bit = b % 2\n    if a_bit == 1 and b_bit == 1 then\n      res = res + bit\n    end\n    a = math.floor(a / 2)\n    b = math.floor(b / 2)\n    bit = bit * 2\n  end\n  return res\nend\n\nlocal function is_valid_ipv4(ip)\n  return ip_to_octets(ip) ~= nil\nend\n\nlocal function is_valid_subnet_mask(mask)\n  local a, b, c, d = ip_to_octets(mask)\n  if not a then\n    return false\n  end\n  local mask_value = ((a * 256 + b) * 256 + c) * 256 + d\n  if mask_value == 0 then\n    return false\n  end\n  local inverted = 0xFFFFFFFF - mask_value + 1\n  if inverted == 0 then\n    return true\n  end\n  return band(inverted, inverted - 1) == 0\nend\n\nlocal function are_ips_in_same_subnet(ip1, ip2, mask)\n  local a1, b1, c1, d1 = ip_to_octets(ip1)\n  local a2, b2, c2, d2 = ip_to_octets(ip2)\n  local m1, m2, m3, m4 = ip_to_octets(mask)\n  if not a1 or not a2 or not m1 then\n    return false\n  end\n  return band(a1, m1) == band(a2, m1)\n    and band(b1, m2) == band(b2, m2)\n    and band(c1, m3) == band(c2, m3)\n    and band(d1, m4) == band(d2, m4)\nend\n\nlocal function wan_stats(ip_data)\n  return {\n    bytes_sent = to_uint64(ip_data['Stats.EthernetBytesSent']),\n    bytes_received = to_uint64(ip_data['Stats.EthernetBytesReceived']),\n    packets_sent = to_uint64(ip_data['Stats.EthernetPacketsSent']),\n    packets_received = to_uint64(ip_data['Stats.EthernetPacketsReceived']),\n    errors_sent = to_uint64(ip_data['Stats.EthernetErrorsSent']),\n    errors_received = to_uint64(ip_data['Stats.EthernetErrorsReceived']),\n    discard_packets_sent = to_uint64(ip_data['Stats.EthernetDiscardPacketsSent']),\n    discard_packets_received = to_uint64(ip_data['Stats.EthernetDiscardPacketsReceived']),\n    unicast_packets_sent = to_uint64(ip_data['Stats.EthernetUnicastPacketsSent']),\n    unicast_packets_received = to_uint64(ip_data['Stats.EthernetUnicastPacketsReceived']),\n    multicast_packets_sent = to_uint64(ip_data['Stats.EthernetMulticastPacketsSent']),\n    multicast_packets_received = to_uint64(ip_data['Stats.EthernetMulticastPacketsReceived']),\n    broadcast_packets_sent = to_uint64(ip_data['Stats.EthernetBroadcastPacketsSent']),\n    broadcast_packets_received = to_uint64(ip_data['Stats.EthernetBroadcastPacketsReceived']),\n    unknown_packets_received = to_uint64(ip_data['Stats.EthernetUnknownProtoPacketsReceived']),\n  }\nend\n\n-- Model identity and capabilities\nfunction get_vendor() return 'Huawei' end\nfunction get_data_model() return 'TR-098' end\nfunction get_device_specs() return { TimeTraceRoute = 3 } end\nfunction get_device_capabilities()\n.  print(\"Test\")\n  return {\n    Radio = true,\n    Ssid = true,\n    SiteSurvey = true,\n    ConnectedDevices = true,\n    Diagnostic = true,\n    Ports = true,\n    Reboot = true,\n    FactoryReset = false,\n    FirmwareUpgrade = true,\n    FirmwareRollback = false,\n    FactoryDefault = true,\n    Traceroute = true,\n    SpeedTest = true,\n    DownloadSpeedTest = true,\n    UploadSpeedTest = false,\n    Ping = true,\n    Logs = true,\n    Stats = true,\n    Interfaces = true,\n    Wan = true,\n    Lan = false,\n    Hwinfo = true,\n    Pon = false,\n  }\nend\nfunction is_real_time() return false end\n\n-- WiFi Radio\nfunction get_radio()\n  return {\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.RadioEnabled',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.Channel',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.AutoChannelEnable',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.PossibleChannels',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.X_HW_CurrentOperatingChannelBandwidth',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.TransmitPowerSupported',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.TransmitPower',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.X_HW_SupportedStandards',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.X_HW_Standard',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.X_HW_RFBand',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.RadioEnabled',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.Channel',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.AutoChannelEnable',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.PossibleChannels',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.X_HW_CurrentOperatingChannelBandwidth',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.TransmitPowerSupported',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.TransmitPower',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.X_HW_SupportedStandards',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.X_HW_Standard',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.X_HW_RFBand',\n  }\nend\n\nfunction parse_radio(response)\n  local radios = {}\n  local ports_wlan_tmp = {}\n  for _, param in ipairs(response.list or {}) do\n    local wlan_number, param_type = string.match(param.name or '', 'InternetGatewayDevice%.LANDevice%.1%.WLANConfiguration%.(%d+)%.(.+)')\n    if wlan_number then\n      wlan_number = tonumber(wlan_number)\n      ports_wlan_tmp[wlan_number] = ports_wlan_tmp[wlan_number] or {}\n      ports_wlan_tmp[wlan_number][param_type] = param.value\n    end\n  end\n\n  local wlan_indices = { 1, 5 }\n  for i, wlan_index in ipairs(wlan_indices) do\n    local wlan = ports_wlan_tmp[wlan_index] or {}\n    local channel = to_int(wlan['Channel'], 0)\n    radios[i] = {\n      path = 'InternetGatewayDevice.LANDevice.1.WLANConfiguration.' .. wlan_index .. '.',\n      enable = pd(true, bool_val(wlan['RadioEnabled'])),\n      name = pd(false, wlan['X_HW_RFBand']),\n      auto_channel_enable = pd(true, bool_val(wlan['AutoChannelEnable'])),\n      channel = pd(true, channel),\n      possible_channels = pd(false, split_int(wlan['PossibleChannels'], ',')),\n      operating_channel_bandwidth = pd(false, wlan['X_HW_CurrentOperatingChannelBandwidth']),\n      operating_frequency_band = pd(false, wlan['X_HW_RFBand']),\n      transmit_power = pd(true, wlan['TransmitPower'] and (wlan['TransmitPower'] .. '%') or nil),\n      transmit_power_supported = pd(false, format_transmit_power_supported(wlan['TransmitPowerSupported'])),\n      supported_frequency_bands = pd(false, split(wlan['X_HW_RFBand'], ',')),\n      supported_operating_channel_bandwidth = pd(false, split(wlan['X_HW_CurrentOperatingChannelBandwidth'], ',')),\n      supported_standards = pd(false, split(wlan['X_HW_SupportedStandards'], ',')),\n      operating_standards = pd(false, split(trim_prefix(wlan['X_HW_Standard'] or '', '11'), ',')),\n    }\n  end\n\n  return radios\nend\n\nfunction set_radio(radios)\n  local values = {}\n  for _, r in ipairs(radios or {}) do\n    local path = r.path or ''\n    if r.enable and r.enable.value ~= nil then\n      values[path .. 'RadioEnabled'] = r.enable.value\n    end\n    if r.auto_channel_enable and r.auto_channel_enable.value ~= nil then\n      values[path .. 'AutoChannelEnable'] = r.auto_channel_enable.value\n    end\n    if r.channel and r.channel.value ~= nil then\n      values[path .. 'Channel'] = r.channel.value\n    end\n    if r.transmit_power and r.transmit_power.value ~= nil then\n      values[path .. 'TransmitPower'] = trim_suffix(r.transmit_power.value, '%')\n    end\n  end\n  return values\nend\n\n-- WiFi SSID\nfunction get_ssid()\n  return {\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.SSID',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.RadioEnabled',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.SSIDAdvertisementEnabled',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.Status',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.TotalBytesSent',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.TotalBytesReceived',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.BSSID',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.X_HW_RFBand',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.BeaconType',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.SSID',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.RadioEnabled',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.SSIDAdvertisementEnabled',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.Status',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.TotalBytesSent',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.TotalBytesReceived',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.BSSID',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.X_HW_RFBand',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.BeaconType',\n  }\nend\n\nfunction parse_ssid(response)\n  local ssids = {}\n  local ports_wlan_tmp = {}\n  for _, param in ipairs(response.list or {}) do\n    local wlan_number, param_type = string.match(param.name or '', 'InternetGatewayDevice%.LANDevice%.1%.WLANConfiguration%.(%d+)%.(.+)')\n    if wlan_number then\n      wlan_number = tonumber(wlan_number)\n      ports_wlan_tmp[wlan_number] = ports_wlan_tmp[wlan_number] or {}\n      ports_wlan_tmp[wlan_number][param_type] = param.value\n    end\n  end\n\n  local wlan_indices = { 1, 5 }\n  for i, wlan_index in ipairs(wlan_indices) do\n    local wlan = ports_wlan_tmp[wlan_index] or {}\n    local beacon_type = wlan['BeaconType']\n    ssids[i] = {\n      ssid_path = 'InternetGatewayDevice.LANDevice.1.WLANConfiguration.' .. wlan_index .. '.',\n      name = pd(false, wlan['X_HW_RFBand']),\n      type = pd(false, 'Primary'),\n      ssid = pd(true, wlan['SSID']),\n      status = pd(false, wlan['Status']),\n      enable = pd(false, bool_val(wlan['RadioEnabled'])),\n      ssid_advertisement_enabled = pd(true, bool_val(wlan['SSIDAdvertisementEnabled'])),\n      has_band_steering = pd(false, false),\n      bytes_received = pd(false, wlan['TotalBytesReceived']),\n      bytes_sent = pd(false, wlan['TotalBytesSent']),\n      mac_address = pd(false, wlan['BSSID']),\n      security = {\n        security_modes_supported = pd(false, { 'None', 'Basic', 'WPA', 'WPA2', 'WPA/WPA2', 'WPA3', 'WPA2/WPA3' }),\n        security_mode_enabled = pd(true, translate_beacon_type_to_human(beacon_type)),\n        password = pd(is_password_writable(beacon_type), nil),\n      },\n    }\n  end\n\n  return ssids\nend\n\nfunction set_ssid(ssids)\n  local values = {}\n  for _, s in ipairs(ssids or {}) do\n    local path = s.ssid_path or ''\n    if s.enable and s.enable.value ~= nil then\n      values[path .. 'RadioEnabled'] = s.enable.value\n    end\n    if s.ssid and s.ssid.value ~= nil then\n      values[path .. 'SSID'] = s.ssid.value\n    end\n    if s.ssid_advertisement_enabled and s.ssid_advertisement_enabled.value ~= nil then\n      values[path .. 'SSIDAdvertisementEnabled'] = s.ssid_advertisement_enabled.value\n    end\n    if s.security and s.security.security_mode_enabled and s.security.security_mode_enabled.value ~= nil then\n      values[path .. 'BeaconType'] = translate_beacon_type_to_cwmp(s.security.security_mode_enabled.value)\n    end\n    if s.security and s.security.password and s.security.password.value ~= nil then\n      if s.security.password.value ~= '' then\n        values[path .. 'PreSharedKey.1.KeyPassphrase'] = s.security.password.value\n      end\n    end\n  end\n  return values\nend\n\n-- Site Survey\nfunction get_site_survey_diagnostic_state()\n  return 'InternetGatewayDevice.LANDevice.1.WiFi.NeighboringWiFiDiagnostic.DiagnosticsState'\nend\n\nfunction get_site_survey_results()\n  return { 'InternetGatewayDevice.LANDevice.1.WiFi.NeighboringWiFiDiagnostic.Result.' }\nend\n\nfunction parse_get_site_survey(response)\n  local site_survey = {}\n  local tmp = {}\n  for _, param in ipairs(response.list or {}) do\n    local entry, param_type = string.match(param.name or '', 'InternetGatewayDevice%.LANDevice%.1%.WiFi%.NeighboringWiFiDiagnostic%.Result%.(%d+)%.(.+)')\n    if entry then\n      entry = tonumber(entry)\n      tmp[entry] = tmp[entry] or {}\n      tmp[entry][param_type] = param.value\n    end\n  end\n\n  for _, params in pairs(tmp) do\n    local neighbor = {\n      signal_level = params['SignalStrength'],\n      ssid = params['SSID'],\n      channel = params['Channel'],\n      standard = params['OperatingStandards'],\n      bandwidth = params['OperatingChannelBandwidth'] and trim_suffix(params['OperatingChannelBandwidth'], 'MHz') or nil,\n      bssid = params['BSSID'],\n    }\n    local radio = params['Radio']\n    if radio == 'InternetGatewayDevice.LANDevice.1.WiFi.Radio.1' then\n      site_survey['2.4GHz'] = site_survey['2.4GHz'] or {}\n      table.insert(site_survey['2.4GHz'], neighbor)\n    elseif radio == 'InternetGatewayDevice.LANDevice.1.WiFi.Radio.2' then\n      site_survey['5GHz'] = site_survey['5GHz'] or {}\n      table.insert(site_survey['5GHz'], neighbor)\n    else\n      site_survey['Unknown Frequency'] = site_survey['Unknown Frequency'] or {}\n      table.insert(site_survey['Unknown Frequency'], neighbor)\n    end\n  end\n\n  return site_survey\nend\n\n-- Connected Devices\nfunction get_connected_devices()\n  return { 'InternetGatewayDevice.LANDevice.1.Hosts.Host.' }\nend\n\nfunction parse_get_connected_devices(response)\n  local connected_devices = {}\n  local tmp = {}\n\n  for _, param in ipairs(response.list or {}) do\n    local device_number, param_type = string.match(param.name or '', 'InternetGatewayDevice%.LANDevice%.1%.Hosts%.Host%.(%d+)%.(.+)')\n    if device_number then\n      device_number = tonumber(device_number)\n      tmp[device_number] = tmp[device_number] or {}\n      tmp[device_number][param_type] = param.value\n    end\n  end\n\n  for _, device in pairs(tmp) do\n    local device_interface = 'Ethernet'\n    if device['Layer2Interface'] and device['Layer2Interface']:find('WLANConfiguration.1') then\n      device_interface = '2.4GHz'\n    elseif device['Layer2Interface'] and device['Layer2Interface']:find('WLANConfiguration.5') then\n      device_interface = '5GHz'\n    end\n\n    local resource = {\n      mac = device['MACAddress'],\n      ip_adress = device['IPAddress'],\n      adress_source = device['AddressSource'],\n      active = bool_val(device['Active']),\n      hostname = device['HostName'],\n      rssi = device['X_HW_RSSI'],\n      stats = {\n        bytes_sent = to_uint64(device['X_HW_Stats.BytesSent']),\n        bytes_received = to_uint64(device['X_HW_Stats.BytesReceived']),\n      },\n    }\n\n    connected_devices[device_interface] = connected_devices[device_interface] or {}\n    table.insert(connected_devices[device_interface], resource)\n  end\n\n  return {\n    model = model,\n    hostname = sn,\n    connected_devices = connected_devices,\n  }\nend\n\n-- Speed Test\nfunction parse_get_speed_test_result(speed_test_type, response)\n  local params = response_param_map(response)\n\n  local diagnostic = params['DiagnosticsState']\n  if diagnostic and diagnostic ~= 'Complete' and diagnostic ~= 'Completed' then\n    return nil, diagnostic .. ' state received'\n  end\n\n  local bytes_received = tonumber(params['TotalBytesReceived'] or '0') or 0\n  local raw_eom = params['EOMTime'] or ''\n  local raw_rom = params['ROMTime'] or ''\n  local raw_bom = params['BOMTime'] or ''\n\n  local eom = parse_iso_time(raw_eom)\n  local rom = parse_iso_time(raw_rom)\n  local bom = parse_iso_time(raw_bom)\n  if not eom or not rom or not bom then\n    return nil, 'Time parsing error'\n  end\n\n  local rtt = duration_string(os.difftime(bom, rom))\n  local resp_time = duration_string(os.difftime(eom, rom))\n  local elapsed = os.difftime(eom, bom)\n  local throughput = '0'\n  if elapsed \u003e 0 then\n    if speed_test_type == 'upload' then\n      local bytes_sent = tonumber(params['TotalBytesSent'] or '0') or 0\n      throughput = human_readable_bits(math.floor(8 * bytes_sent / elapsed))\n    else\n      throughput = human_readable_bits(math.floor(8 * bytes_received / elapsed))\n    end\n  end\n\n  return {\n    bytes_received = bytes_received,\n    rtt = rtt,\n    resp_time = resp_time,\n    throughput = throughput,\n    action = speed_test_type,\n  }, nil\nend\n\nfunction get_speed_test_result(speed_test_type)\n  return {\n    'InternetGatewayDevice.DownloadDiagnostics.ROMTime',\n    'InternetGatewayDevice.DownloadDiagnostics.BOMTime',\n    'InternetGatewayDevice.DownloadDiagnostics.EOMTime',\n    'InternetGatewayDevice.DownloadDiagnostics.TotalBytesReceived',\n    'InternetGatewayDevice.DownloadDiagnostics.TotalBytesSent',\n  }\nend\n\nfunction set_speed_test(test)\n  local action = test.action or test.type\n  if action == 'upload' then\n    return nil\n  end\n  local values = {}\n  if test.url and test.url ~= '' then\n    values['InternetGatewayDevice.DownloadDiagnostics.DownloadURL'] = test.url\n  end\n  if test.interface and test.interface ~= '' then\n    values['InternetGatewayDevice.DownloadDiagnostics.Interface'] = test.interface\n  end\n  values['InternetGatewayDevice.DownloadDiagnostics.DiagnosticsState'] = 'Requested'\n  return values\nend\n\nfunction get_download_diagnostic_state()\n  return 'InternetGatewayDevice.DownloadDiagnostics.DiagnosticsState'\nend\n\nfunction get_upload_diagnostic_state()\n  return 'InternetGatewayDevice.UploadDiagnostics.DiagnosticsState'\nend\n\n-- Ping\nfunction get_ping()\n  return {\n    'InternetGatewayDevice.IPPingDiagnostics.Interface',\n    'InternetGatewayDevice.IPPingDiagnostics.Timeout',\n    'InternetGatewayDevice.IPPingDiagnostics.Host',\n    'InternetGatewayDevice.IPPingDiagnostics.NumberOfRepetitions',\n    'InternetGatewayDevice.IPPingDiagnostics.DataBlockSize',\n    'InternetGatewayDevice.IPPingDiagnostics.FailureCount',\n    'InternetGatewayDevice.IPPingDiagnostics.SuccessCount',\n    'InternetGatewayDevice.IPPingDiagnostics.AverageResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.MinimumResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.MaximumResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.DiagnosticsState',\n  }\nend\n\nfunction parse_get_ping(response)\n  local params = response_param_map(response)\n\n  local timeout = to_int(params['Timeout'], 5000)\n  local timeout_seconds = math.floor(timeout / 1000)\n  local repetitions = to_int(params['NumberOfRepetitions'], 3)\n  local block_size = to_int(params['DataBlockSize'], 32)\n  if block_size == 0 then\n    block_size = 32\n  end\n\n  local failure_count = to_int(params['FailureCount'], 0)\n  local success_count = to_int(params['SuccessCount'], 0)\n  local avg_rtt = to_int(params['AverageResponseTime'], 0)\n  local min_rtt = to_int(params['MinimumResponseTime'], 0)\n  local max_rtt = to_int(params['MaximumResponseTime'], 0)\n\n  local diagnostic = params['DiagnosticsState'] or ''\n  local interface_value = params['Interface']\n  local host = params['Host']\n\n  local last_result = {\n    result = parse_diagnostic_state(diagnostic, failure_count),\n    failure_count = failure_count,\n    success_count = success_count,\n    average_rtt = avg_rtt,\n    minimum_rtt = min_rtt,\n    maximum_rtt = max_rtt,\n  }\n\n  return {\n    interface = pd(false, interface_value),\n    timeout = pd(true, timeout_seconds),\n    host = pd(true, host),\n    number_of_repetitions = pd(true, repetitions),\n    data_block_size = pd(true, block_size),\n    processing = pd(false, diagnostic == 'Requested' or diagnostic == 'Request'),\n    last_result = last_result,\n  }\nend\n\nfunction get_ping_diagnostic_state()\n  return 'InternetGatewayDevice.IPPingDiagnostics.DiagnosticsState'\nend\n\nfunction set_ping(ping)\n  local values = {}\n  local data_block = ping.data_block_size and ping.data_block_size.value or 32\n  if data_block == nil or data_block == 0 then\n    data_block = 32\n  end\n\n  values['InternetGatewayDevice.IPPingDiagnostics.Interface'] = ping.interface.value\n  values['InternetGatewayDevice.IPPingDiagnostics.Timeout'] = (ping.timeout.value or 0) * 1000\n  values['InternetGatewayDevice.IPPingDiagnostics.Host'] = ping.host.value\n  values['InternetGatewayDevice.IPPingDiagnostics.NumberOfRepetitions'] = ping.number_of_repetitions.value\n  values['InternetGatewayDevice.IPPingDiagnostics.DiagnosticsState'] = 'Requested'\n  values['InternetGatewayDevice.IPPingDiagnostics.DataBlockSize'] = data_block\n\n  return values\nend\n\nfunction get_ping_result()\n  return {\n    'InternetGatewayDevice.IPPingDiagnostics.FailureCount',\n    'InternetGatewayDevice.IPPingDiagnostics.SuccessCount',\n    'InternetGatewayDevice.IPPingDiagnostics.AverageResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.MinimumResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.MaximumResponseTime',\n    'InternetGatewayDevice.IPPingDiagnostics.DiagnosticsState',\n  }\nend\n\nfunction parse_get_ping_result(response)\n  local list = response.list or {}\n  if #list \u003c 6 then\n    return nil\n  end\n\n  local failure_count = to_int(list[1].value, 0)\n  local success_count = to_int(list[2].value, 0)\n  local avg_rtt = to_int(list[3].value, 0)\n  local min_rtt = to_int(list[4].value, 0)\n  local max_rtt = to_int(list[5].value, 0)\n  local diagnostic_state = list[6].value or ''\n\n  if diagnostic_state == 'Error_CannotResolveHostName' then\n    diagnostic_state = 'Cannot resolve host name'\n  elseif diagnostic_state == 'Error_MaxHopCountExceeded' then\n    diagnostic_state = 'Max hop count exceeded'\n  elseif diagnostic_state == 'Requested' then\n    diagnostic_state = 'In progress'\n  elseif diagnostic_state == 'Complete' then\n    if failure_count \u003e 0 then\n      diagnostic_state = 'Failure'\n    else\n      diagnostic_state = 'Success'\n    end\n  elseif diagnostic_state == 'None' then\n    diagnostic_state = 'None'\n  else\n    diagnostic_state = 'Unknown'\n  end\n\n  return {\n    result = diagnostic_state,\n    failure_count = failure_count,\n    success_count = success_count,\n    average_rtt = avg_rtt,\n    minimum_rtt = min_rtt,\n    maximum_rtt = max_rtt,\n  }\nend\n\n-- Traceroute\nfunction get_traceroute()\n  return {\n    'InternetGatewayDevice.TraceRouteDiagnostics.Interface',\n    'InternetGatewayDevice.TraceRouteDiagnostics.Timeout',\n    'InternetGatewayDevice.TraceRouteDiagnostics.Host',\n    'InternetGatewayDevice.TraceRouteDiagnostics.NumberOfTries',\n    'InternetGatewayDevice.TraceRouteDiagnostics.MaxHopCount',\n  }\nend\n\nfunction parse_get_traceroute(response)\n  local list = response.list or {}\n  if #list \u003c 5 then\n    return nil\n  end\n\n  local timeout = to_int(list[2].value, 30000)\n  local number_of_tries = to_int(list[4].value, 0)\n  local max_hop_count = to_int(list[5].value, 0)\n\n  return {\n    interface = pd(false, list[1].value),\n    timeout = pd(true, math.floor(timeout / 1000)),\n    host = pd(true, list[3].value),\n    number_of_tries = pd(true, number_of_tries),\n    max_hop_count = pd(true, max_hop_count),\n  }\nend\n\nfunction get_traceroute_diagnostic_state()\n  return 'InternetGatewayDevice.TraceRouteDiagnostics.DiagnosticsState'\nend\n\nfunction set_traceroute(traceroute)\n  local values = {}\n  values['InternetGatewayDevice.TraceRouteDiagnostics.Timeout'] = traceroute.timeout.value\n  values['InternetGatewayDevice.TraceRouteDiagnostics.Host'] = traceroute.host.value\n  values['InternetGatewayDevice.TraceRouteDiagnostics.NumberOfTries'] = traceroute.number_of_tries.value\n  values['InternetGatewayDevice.TraceRouteDiagnostics.MaxHopCount'] = traceroute.max_hop_count.value\n  values['InternetGatewayDevice.TraceRouteDiagnostics.DiagnosticsState'] = 'Requested'\n  return values\nend\n\nfunction get_traceroute_result_number_of_hops()\n  return 'InternetGatewayDevice.TraceRouteDiagnostics.RouteHopsNumberOfEntries'\nend\n\nfunction get_traceroute_result(number_of_hops)\n  local params = {\n    'InternetGatewayDevice.TraceRouteDiagnostics.DiagnosticsState',\n    'InternetGatewayDevice.TraceRouteDiagnostics.ResponseTime',\n    'InternetGatewayDevice.TraceRouteDiagnostics.RouteHopsNumberOfEntries',\n  }\n  for i = 1, number_of_hops do\n    local entry = tostring(i)\n    params[#params+1] = 'InternetGatewayDevice.TraceRouteDiagnostics.RouteHops.' .. entry .. '.HopHost'\n    params[#params+1] = 'InternetGatewayDevice.TraceRouteDiagnostics.RouteHops.' .. entry .. '.HopRTTimes'\n    params[#params+1] = 'InternetGatewayDevice.TraceRouteDiagnostics.RouteHops.' .. entry .. '.HopHostAddress'\n  end\n  return params\nend\n\nfunction parse_get_traceroute_result(response)\n  local list = response.list or {}\n  if #list \u003c 3 then\n    return nil\n  end\n\n  local result = {}\n  local diagnostic_state = list[1].value or ''\n  if diagnostic_state == 'Error_CannotResolveHostName' then\n    result.result = 'Cannot resolve host name'\n  elseif diagnostic_state == 'Error_MaxHopCountExceeded' then\n    result.result = 'Max hop count exceeded'\n  elseif diagnostic_state == 'Requested' then\n    result.result = 'In progress'\n  elseif diagnostic_state == 'Complete' then\n    result.result = 'Success'\n  elseif diagnostic_state == 'None' then\n    result.result = 'None'\n  else\n    result.result = 'Success'\n  end\n\n  result.response_time = to_int(list[2].value, 0)\n  result.hop_count = to_int(list[3].value, 0)\n\n  local hops = {}\n  local index = 4\n  for i = 1, result.hop_count do\n    hops[i] = {\n      host = list[index] and list[index].value or nil,\n      rtt = list[index + 1] and list[index + 1].value or nil,\n      addr = list[index + 2] and list[index + 2].value or nil,\n    }\n    index = index + 3\n  end\n  result.hops = hops\n\n  return result\nend\n\n-- Statistics\nfunction get_statistics()\n  return {\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.Stats.',\n    'InternetGatewayDevice.LANDevice.1.WLANConfiguration.2.Stats.',\n    'InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.',\n  }\nend\n\nfunction parse_get_statistics(response)\n  local all_stats = {}\n  local stats_tmp = {}\n\n  for _, param in ipairs(response.list or {}) do\n    local name = param.name or ''\n    if name:find('LANDevice%.') then\n      local wlan_number = tonumber(name:match('InternetGatewayDevice%.LANDevice%.1%.WLANConfiguration%.(%d+)%.'))\n      local wlan_type = '2.4GHz'\n      if wlan_number == 2 then\n        wlan_type = '5GHz'\n      end\n      stats_tmp[wlan_type] = stats_tmp[wlan_type] or {}\n      local param_type = name:match('InternetGatewayDevice%.LANDevice%.1%.WLANConfiguration%.%d+%.Stats%.(.+)')\n      if param_type then\n        stats_tmp[wlan_type][param_type] = to_uint64(param.value)\n      end\n    elseif name:find('WANDevice%.') then\n      local wan_number = tonumber(name:match('InternetGatewayDevice%.WANDevice%.(%d+)%.')) or 0\n      local wan_type = 'WAN-' .. tostring(wan_number)\n      stats_tmp[wan_type] = stats_tmp[wan_type] or {}\n      local param_type = name:match('InternetGatewayDevice%.WANDevice%.%d+%.WANCommonInterfaceConfig%.(.+)')\n      if param_type then\n        stats_tmp[wan_type][param_type] = to_uint64(param.value)\n      end\n    end\n  end\n\n  for stats_type, stats in pairs(stats_tmp) do\n    local resource = {\n      bytes_sent = stats['TotalBytesSent'] or 0,\n      bytes_received = stats['TotalBytesReceived'] or 0,\n      packets_sent = stats['TotalPacketsSent'] or 0,\n      packets_received = stats['TotalPacketsReceived'] or 0,\n      errors_sent = stats['ErrorsSent'] or 0,\n      errors_received = stats['ErrorsReceived'] or 0,\n      discard_packets_sent = stats['DiscardPacketsSent'] or 0,\n      discard_packets_received = stats['DiscardPacketsReceived'] or 0,\n      unicast_packets_sent = stats['UnicastPacketsSent'] or 0,\n      unicast_packets_received = stats['UnicastPacketsReceived'] or 0,\n      multicast_packets_sent = stats['MulticastPacketsSent'] or 0,\n      multicast_packets_received = stats['MulticastPacketsReceived'] or 0,\n      broadcast_packets_sent = stats['BroadcastPacketsSent'] or 0,\n      broadcast_packets_received = stats['BroadcastPacketsReceived'] or 0,\n      unknown_packets_received = stats['UnknownProtoPacketsReceived'] or 0,\n    }\n    all_stats[stats_type] = all_stats[stats_type] or {}\n    table.insert(all_stats[stats_type], resource)\n  end\n\n  return all_stats\nend\n\n-- Interfaces (TR-098)\nfunction get_interface_wan()\n  return { 'InternetGatewayDevice.WANDevice.1.' }\nend\n\nfunction get_interface_lan()\n  return { 'InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.' }\nend\n\nfunction get_interface_wlan()\n  return { 'InternetGatewayDevice.LANDevice.1.WLANConfiguration.' }\nend\n\nfunction get_wan_options()\n  return nil\nend\n\nfunction parse_get_interface_wan(response)\n  local ports_wan = {}\n  local ports_wan_tmp = {}\n\n  for _, param in ipairs(response.list or {}) do\n    local name = param.name or ''\n    if name:find('WANConnectionDevice%.') then\n      local wan_number = tonumber(name:match('InternetGatewayDevice%.WANDevice%.1%.WANConnectionDevice%.(%d+)%.'))\n      if wan_number then\n        ports_wan_tmp[wan_number] = ports_wan_tmp[wan_number] or {}\n        if name:find('WANIPConnection%.') then\n          local ip_number, param_type = name:match('InternetGatewayDevice%.WANDevice%.1%.WANConnectionDevice%.%d+%.WANIPConnection%.(%d+)%.(.+)')\n          if ip_number then\n            ip_number = tonumber(ip_number)\n            ports_wan_tmp[wan_number][ip_number] = ports_wan_tmp[wan_number][ip_number] or {}\n            ports_wan_tmp[wan_number][ip_number][param_type] = param.value\n          end\n        elseif name:find('WANPPPConnection%.') then\n          local ip_number, param_type = name:match('InternetGatewayDevice%.WANDevice%.1%.WANConnectionDevice%.%d+%.WANPPPConnection%.(%d+)%.(.+)')\n          if ip_number then\n            ip_number = tonumber(ip_number) + 100\n            ports_wan_tmp[wan_number][ip_number] = ports_wan_tmp[wan_number][ip_number] or {}\n            ports_wan_tmp[wan_number][ip_number][param_type] = param.value\n          end\n        end\n      end\n    end\n  end\n\n  for wan_number, ports_wan_value in pairs(ports_wan_tmp) do\n    local path = 'InternetGatewayDevice.WANDevice.1.WANConnectionDevice.' .. wan_number .. '.'\n    for ip_number, ip_data in pairs(ports_wan_value) do\n      local ip_path\n      if ip_number \u003e= 100 then\n        ip_path = path .. 'WANPPPConnection.' .. (ip_number - 100) .. '.'\n      else\n        ip_path = path .. 'WANIPConnection.' .. ip_number .. '.'\n      end\n\n      ports_wan[ip_path] = {\n        path = ip_path,\n        enable = pd(true, (ip_data['Enable'] == '1')),\n        alias = pd(false, 'Logical WAN Connection ' .. wan_number),\n        upstream = pd(false, true),\n        mac_address = pd(false, ip_data['MACAddress']),\n        status = pd(false, ip_data['Status']),\n        tx = pd(false, to_int(ip_data['Stats.EthernetBytesSent'], 0)),\n        rx = pd(false, to_int(ip_data['Stats.EthernetBytesReceived'], 0)),\n        stats = wan_stats(ip_data),\n        ip = {\n          {\n            path = path,\n            enable = pd(true, (ip_data['Enable'] == '1')),\n            name = pd(false, 'WAN Connection ' .. ip_number),\n            ipv4 = {\n              enable = pd(true, (ip_data['X_HW_IPv4Enable'] == '1')),\n              ip_address = pd(ip_attribute_is_writable(ip_data['AddressingType']), ip_data['ExternalIPAddress']),\n              origin = pd(false, get_ip_origin(ip_data['AddressingType'])),\n              subnet_mask = pd(ip_attribute_is_writable(ip_data['AddressingType']), ip_data['SubnetMask']),\n              gateway = pd(ip_attribute_is_writable(ip_data['AddressingType']), ip_data['DefaultGateway']),\n              dns_servers = {\n                dns_servers = pd(ip_attribute_is_writable(ip_data['AddressingType']), ip_data['DNSServers']),\n              },\n            },\n            pppoe = {\n              path = (get_ip_origin(ip_data['AddressingType']) == 'PPPoE') and '-' or '',\n              username = pd(true, ip_data['Username']),\n              password = pd(true, ip_data['Password']),\n            },\n            vlan = {\n              path = '-',\n              enable = pd(true, (ip_data['X_HW_VLAN'] or '0') ~= '0'),\n              id = pd(true, to_int(ip_data['X_HW_VLAN'], 0)),\n            },\n            service = pd(false, ip_data['X_HW_SERVICELIST']),\n            ipv6 = {\n              enable = pd(true, (ip_data['X_HW_IPv6Enable'] == '1')),\n            },\n          },\n        },\n      }\n    end\n  end\n\n  return ports_wan\nend\n\nfunction parse_get_interface_lan(response)\n  local ports_lan = {}\n  local ports_lan_tmp = {}\n\n  for _, param in ipairs(response.list or {}) do\n    local lan_number, param_type = string.match(param.name or '', 'InternetGatewayDevice%.LANDevice%.1%.LANEthernetInterfaceConfig%.(%d+)%.(.+)')\n    if lan_number then\n      lan_number = tonumber(lan_number)\n      ports_lan_tmp[lan_number] = ports_lan_tmp[lan_number] or {}\n      ports_lan_tmp[lan_number][param_type] = param.value\n    end\n  end\n\n  for lan_number, port in pairs(ports_lan_tmp) do\n    local name = port['Name'] or ('LAN ' .. lan_number)\n    ports_lan[name] = {\n      path = 'InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.' .. lan_number .. '.',\n      enable = pd(false, (port['Enable'] == '1')),\n      alias = pd(false, 'LAN ' .. lan_number),\n      upstream = pd(false, false),\n      mac_address = pd(false, port['MACAddress']),\n      status = pd(false, port['Status']),\n      tx = pd(false, to_int(port['Stats.BytesSent'], 0)),\n      rx = pd(false, to_int(port['Stats.BytesReceived'], 0)),\n      stats = {\n        bytes_sent = to_uint64(port['Stats.BytesSent']),\n        bytes_received = to_uint64(port['Stats.BytesReceived']),\n        packets_sent = to_uint64(port['Stats.PacketsSent']),\n        packets_received = to_uint64(port['Stats.PacketsReceived']),\n        errors_sent = to_uint64(port['Stats.ErrorsSent']),\n        errors_received = to_uint64(port['Stats.ErrorsReceived']),\n        discard_packets_sent = to_uint64(port['Stats.DiscardPacketsSent']),\n        discard_packets_received = to_uint64(port['Stats.DiscardPacketsReceived']),\n        unicast_packets_sent = to_uint64(port['Stats.UnicastPacketsSent']),\n        unicast_packets_received = to_uint64(port['Stats.UnicastPacketsReceived']),\n        multicast_packets_sent = to_uint64(port['Stats.MulticastPacketsSent']),\n        multicast_packets_received = to_uint64(port['Stats.MulticastPacketsReceived']),\n        broadcast_packets_sent = to_uint64(port['Stats.BroadcastPacketsSent']),\n        broadcast_packets_received = to_uint64(port['Stats.BroadcastPacketsReceived']),\n        unknown_packets_received = to_uint64(port['Stats.UnknownProtoPacketsReceived']),\n      },\n    }\n  end\n\n  return ports_lan\nend\n\nfunction set_port(ports)\n  local values = {}\n  for port_name, port in pairs(ports or {}) do\n    if not port.ip or #port.ip == 0 then\n      return nil, 'error setting port, IP is not set for port ' .. tostring(port_name)\n    end\n    for _, ip in ipairs(port.ip) do\n      local path = port.path or ip.path or ''\n\n      if ip.enable and ip.enable.value ~= nil then\n        values[path .. 'Enable'] = bool_val(port.enable and port.enable.value)\n      end\n      if ip.name and ip.name.value ~= nil then\n        values[path .. 'Name'] = ip.name.value\n      end\n      if ip.ipv4 and ip.ipv4.ip_address and ip.ipv4.ip_address.value ~= nil then\n        values[path .. 'ExternalIPAddress'] = ip.ipv4.ip_address.value\n      end\n      if ip.ipv4 and ip.ipv4.dns_servers and ip.ipv4.dns_servers.dns_servers and ip.ipv4.dns_servers.dns_servers.value ~= nil then\n        values[path .. 'DNSServers'] = ip.ipv4.dns_servers.dns_servers.value\n      end\n      if ip.ipv4 and ip.ipv4.subnet_mask and ip.ipv4.subnet_mask.value ~= nil then\n        values[path .. 'SubnetMask'] = ip.ipv4.subnet_mask.value\n      end\n      if ip.ipv4 and ip.ipv4.gateway and ip.ipv4.gateway.value ~= nil then\n        values[path .. 'DefaultGateway'] = ip.ipv4.gateway.value\n      end\n      if ip.ipv6 and ip.ipv6.enable and ip.ipv6.enable.value ~= nil then\n        values[path .. 'X_HW_IPv6Enable'] = ip.ipv6.enable.value\n      end\n      if ip.pppoe and ip.pppoe.username and ip.pppoe.username.value ~= nil then\n        values[path .. 'Username'] = ip.pppoe.username.value\n      end\n      if ip.pppoe and ip.pppoe.password and ip.pppoe.password.value ~= nil then\n        values[path .. 'Password'] = ip.pppoe.password.value\n      end\n      if ip.vlan and ip.vlan.enable and ip.vlan.enable.value ~= nil then\n        if ip.vlan.enable.value then\n          if ip.vlan.id and ip.vlan.id.value ~= nil then\n            values[path .. 'X_HW_VLAN'] = ip.vlan.id.value\n          end\n        else\n          values[path .. 'X_HW_VLAN'] = 0\n        end\n      elseif ip.vlan and ip.vlan.id and ip.vlan.id.value ~= nil then\n        values[path .. 'X_HW_VLAN'] = ip.vlan.id.value\n      end\n    end\n  end\n  if next(values) == nil then\n    return nil, 'error setting port, no parameters to set'\n  end\n  return values, nil\nend\n\nfunction add_port(port)\n  local parameters = {}\n  local new_port = port.ip and port.ip[1]\n  if not new_port then\n    return nil, 'error adding port, IP is not set'\n  end\n  local path = new_port.path or ''\n\n  local addressing_type = new_port.ipv4 and new_port.ipv4.origin and new_port.ipv4.origin.value or ''\n  if addressing_type == 'PPPoE' then\n    parameters[path .. 'Username'] = new_port.pppoe.username.value\n    parameters[path .. 'Password'] = new_port.pppoe.password.value\n  elseif addressing_type == 'DHCP' then\n    parameters[path .. 'AddressingType'] = 'DHCP'\n  elseif addressing_type == 'Static' then\n    parameters[path .. 'AddressingType'] = 'Static'\n    local ip_address = new_port.ipv4.ip_address.value\n    if ip_address == '' or not is_valid_ipv4(ip_address) then\n      return nil, 'error adding port, IP address is not valid'\n    end\n    parameters[path .. 'ExternalIPAddress'] = ip_address\n\n    local subnet_mask = new_port.ipv4.subnet_mask.value\n    if subnet_mask == '' or not is_valid_subnet_mask(subnet_mask) then\n      return nil, 'error adding port, subnet mask is not valid'\n    end\n    parameters[path .. 'SubnetMask'] = subnet_mask\n\n    local gateway = new_port.ipv4.gateway.value\n    if gateway ~= '' and is_valid_ipv4(gateway) then\n      parameters[path .. 'DefaultGateway'] = gateway\n    end\n\n    if gateway == ip_address then\n      return nil, 'error adding port, gateway cannot be the same as IP address'\n    end\n\n    if gateway ~= '' and not are_ips_in_same_subnet(gateway, ip_address, subnet_mask) then\n      return nil, 'error adding port, gateway is not in the same subnet as IP address'\n    end\n\n    local dns_servers = new_port.ipv4.dns_servers and new_port.ipv4.dns_servers.dns_servers and new_port.ipv4.dns_servers.dns_servers.value or ''\n    if dns_servers ~= '' then\n      parameters[path .. 'DNSServers'] = dns_servers\n    end\n  else\n    return nil, 'error adding port, unsupported addressing type: ' .. tostring(addressing_type)\n  end\n\n  if new_port.ipv6 and new_port.ipv6.enable and new_port.ipv6.enable.value ~= nil then\n    parameters[path .. 'X_HW_IPv6Enable'] = new_port.ipv6.enable.value and '1' or '0'\n  end\n\n  if new_port.vlan and new_port.vlan.enable and new_port.vlan.enable.value ~= nil then\n    if new_port.vlan.enable.value then\n      local vlan = new_port.vlan.id.value\n      if vlan \u003c= 0 or vlan \u003e 4094 then\n        return nil, 'error adding port, VLAN ID is not valid'\n      end\n      parameters[path .. 'X_HW_VLAN'] = vlan\n    else\n      parameters[path .. 'X_HW_VLAN'] = 0\n    end\n  else\n    parameters[path .. 'X_HW_VLAN'] = 0\n  end\n\n  local service = new_port.service and new_port.service.value or ''\n  parameters[path .. 'X_HW_SERVICELIST'] = service\n\n  return parameters, nil\nend\n\n-- Hardware info\nfunction get_hwinfo()\n  return {\n    'InternetGatewayDevice.DeviceInfo.UpTime',\n    'InternetGatewayDevice.DeviceInfo.MemoryStatus.Total',\n    'InternetGatewayDevice.DeviceInfo.MemoryStatus.Free',\n    'InternetGatewayDevice.DeviceInfo.ProcessStatus.CPUUsage',\n    'InternetGatewayDevice.DeviceInfo.Processor.1.Architecture',\n    'InternetGatewayDevice.DeviceInfo.HardwareVersion',\n    'InternetGatewayDevice.DeviceInfo.TemperatureStatus.TemperatureSensor.',\n  }\nend\n\nfunction parse_get_hwinfo(response)\n  local list = response.list or {}\n  if #list \u003c 6 then\n    return nil\n  end\n\n  local uptime = to_uint64(list[1].value)\n  local hw_version = list[2].value\n  local mem_total = to_uint64(list[3].value)\n  local mem_free = to_uint64(list[4].value)\n  local cpu_usage = tonumber(list[5].value) or 0\n  local architecture = list[6].value\n\n  local mem_use = mem_total - mem_free\n  local memory_usage = 0\n  if mem_total \u003e 0 then\n    memory_usage = (mem_use * 100) / mem_total\n  end\n\n  local temperature = {}\n  local sensor_tmp = {}\n  for i = 7, #list do\n    local name = list[i].name or ''\n    local sensor_number, param_type = string.match(name, 'InternetGatewayDevice%.DeviceInfo%.TemperatureStatus%.TemperatureSensor%.(%d+)%.(.+)')\n    if sensor_number then\n      sensor_number = tonumber(sensor_number)\n      sensor_tmp[sensor_number] = sensor_tmp[sensor_number] or {}\n      sensor_tmp[sensor_number][param_type] = list[i].value\n    end\n  end\n\n  for _, sensor_value in pairs(sensor_tmp) do\n    if sensor_value['Status'] == 'Enabled' or sensor_value['Status'] == 'Enable' then\n      local t = tonumber(sensor_value['Value']) or 0\n      temperature[#temperature+1] = { [sensor_value['Name']] = t }\n    end\n  end\n\n  return {\n    uptime_seconds = uptime,\n    hardware_version = hw_version,\n    architecture = architecture,\n    memory_total_kilobytes = mem_total,\n    memory_free_kilobytes = mem_free,\n    memory_use_kilobytes = mem_use,\n    memory_usage_percentage = tonumber(string.format('%.2f', memory_usage)),\n    cpu_usage_percentage = cpu_usage,\n    temperature_celsius = temperature,\n  }\nend\n\n-- PON\nfunction get_pon()\n  return { 'InternetGatewayDevice.WANDevice.1.X_GponInterafceConfig.' }\nend\n\nfunction parse_get_pon(response)\n  local pon = { stats = {} }\