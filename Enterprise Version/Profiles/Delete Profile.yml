info:
  name: Delete Profile
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{base_url}}device-profile"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  body:
    type: json
    data: |-
      {
          "name": "Test",
          "protocol": "cwmp"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Delete Script
    request:
      url: "{{base_url}}device-profile"
      method: DELETE
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
      body:
        type: json
        data: |-
          {
              "name": "Test",
              "protocol": "cwmp"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.27.4
        - name: Date
          value: Tue, 17 Feb 2026 11:39:05 GMT
        - name: Content-Type
          value: application/json; version=1
        - name: Content-Length
          value: "0"
