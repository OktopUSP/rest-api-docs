info:
  name: API Healthcheck Controller
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}health"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Health
    request:
      url: "{{base_url}}health"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Vary
          value: Origin
        - name: Date
          value: Thu, 15 May 2025 18:20:30 GMT
        - name: Content-Length
          value: "35"
        - name: Content-Type
          value: text/plain; charset=utf-8
      body:
        type: text
        data: |
          {"api":true,"db":true,"nats":true}
  - name: Unhealth
    request:
      url: "{{base_url}}health"
      method: GET
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Vary
          value: Origin
        - name: Date
          value: Thu, 15 May 2025 18:23:09 GMT
        - name: Content-Length
          value: "36"
        - name: Content-Type
          value: text/plain; charset=utf-8
      body:
        type: text
        data: |
          {"api":true,"db":true,"nats":false}
