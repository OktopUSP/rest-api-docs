info:
  name: Get Settings
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}ai-assistant/settings"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Get Settings
    request:
      url: "{{base_url}}ai-assistant/settings"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.24.0 (Ubuntu)
        - name: Date
          value: Thu, 16 Oct 2025 01:41:16 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "52"
        - name: Connection
          value: keep-alive
        - name: Vary
          value: Origin
      body:
        type: json
        data: |-
          {
              "tenant_id": "12345678901234567890",
              "enable": false
          }
