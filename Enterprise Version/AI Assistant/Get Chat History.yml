                  "content": "Olá, Zé da Manga! Eu sou um assistente virtual de suporte técnico, pronto para te ajudar com seu roteador ou qualquer outra dúvida de rede. Não tenho um nome próprio como as pessoas, mas você pode me chamar de Assistente, se quiser!\n\nComo posso te ajudar hoje com seu roteador? Você pode me contar qual é o problema que está enfrentando? Assim, consigo te orientar direitinho, passo a passo.\n\nSe precisar, é só falar!"
