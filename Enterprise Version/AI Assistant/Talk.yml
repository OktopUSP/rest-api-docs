info:
  name: Talk
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}ai-assistant/conversation?device={{device}}&new_conversation=true"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: device
      value: "{{device}}"
      type: query
      description: device context for ai
    - name: new_conversation
      value: "true"
      type: query
      description: if true, send CPE fresh data to AI together with the user input
  body:
    type: text
    data: what did i ask you on my last message?
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Service Not Available
    request:
      url: "{{base_url}}ai-assistant/conversation"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
    response:
      status: 503
      statusText: Service Unavailable
      headers:
        - name: Content-Type
          value: text/plain; charset=utf-8
        - name: Vary
          value: Origin
        - name: X-Content-Type-Options
          value: nosniff
        - name: Date
          value: Tue, 07 Oct 2025 17:58:14 GMT
        - name: Content-Length
          value: "35"
      body:
        type: text
        data: |
          AI assistant service not available
  - name: Talk
    request:
      url: "{{base_url}}ai-assistant/conversation"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
      body:
        type: text
        data: my name is thomas edison
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Origin
        - name: Date
          value: Tue, 07 Oct 2025 19:05:52 GMT
        - name: Content-Length
          value: "570"
      body:
        type: json
        data: |-
          Hello, Thomas Edison! How can I help you today with your network or Customer Premises Equipment (CPE) issue?

          To assist you better, could you please tell me more about the problem you are experiencing? For example:

          - Are you having trouble connecting to the internet?
          - Is your connection slow or dropping?
          - Are you seeing any error messages?
          - What type of device are you using (router, modem, etc.)?

          Once I have more details, I can guide you through some simple troubleshooting steps.

          Please let me know the details so we can work on resolving your issue together!
  - name: Empty Input Bad Request
    request:
      url: "{{base_url}}ai-assistant/conversation"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
      body:
        type: text
        data: ""
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: text/plain; charset=utf-8
        - name: Vary
          value: Origin
        - name: X-Content-Type-Options
          value: nosniff
        - name: Date
          value: Tue, 07 Oct 2025 19:06:21 GMT
        - name: Content-Length
          value: "19"
      body:
        type: text
        data: |
          user empty message
