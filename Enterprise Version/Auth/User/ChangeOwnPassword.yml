info:
  name: ChangeOwnPassword
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}auth/password"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
    - name: X-Api-Version
      value: "2"
  body:
    type: json
    data: |-
      {
          "password":"teste123"
      }
  auth: inherit

docs: |-
  Sets a new password for the signed-in user. The password must be at least 8 characters long.

  ## Errors

  | Status | When |
  |---|---|
  | `400` | Invalid JSON, or the password is shorter than 8 characters. |
  | `401` | Missing or invalid token. |
  | `403` | The account has no local password because it signs in through SSO or the embed integration (`auth_provider` is `sso` or `embed`). |

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: ChangeOwnPassword
    request:
      url: "{{base_url}}auth/password"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
      body:
        type: json
        data: |-
          {
              "password":"teste123"
          }
    response:
      status: 204
      statusText: No Content
      headers:
        - name: Server
          value: nginx/1.24.0 (Ubuntu)
        - name: Date
          value: Mon, 17 Nov 2025 22:18:33 GMT
        - name: Connection
          value: keep-alive
        - name: Vary
          value: Origin
      body:
        type: text
        data: ""
  - name: Account Without Local Password
    request:
      url: "{{base_url}}auth/password"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
      body:
        type: json
        data: |-
          {
              "password":"teste123"
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          "This account signs in through an external provider and has no password to change"
