info:
  name: ChangeOwnPassword
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}auth/password"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  body:
    type: json
    data: |-
      {
          "password":"teste123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: ChangeOwnPassword
    request:
      url: "{{base_url}}auth/password"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
      body:
        type: json
        data: |-
          {
              "password":"teste123"
          }
    response:
      status: 204
      statusText: No Content
      headers:
        - name: Server
          value: nginx/1.24.0 (Ubuntu)
        - name: Date
          value: Mon, 17 Nov 2025 22:18:33 GMT
        - name: Connection
          value: keep-alive
        - name: Vary
          value: Origin
      body:
        type: text
        data: ""
