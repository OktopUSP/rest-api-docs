info:
  name: Find Device by Label
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}device/label/find"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  body:
    type: json
    data: |-
      [
         {
            "name": "MyLabel",
            "value": "Anyone"
         },
         {
            "name":"Building",
            "value":"a",
            "children":[
               {
                  "name":"Floor",
                  "value":"1"
               }
            ]
         }
      ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Find Device by Label
    request:
      url: "{{base_url}}device/label/find"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
      body:
        type: json
        data: |-
          [
             {
                "name": "MyLabel",
                "value": "Anyone"
             },
             {
                "name":"Building",
                "value":"a",
                "children":[
                   {
                      "name":"Floor",
                      "value":"1"
                   }
                ]
             }
          ]
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.27.4
        - name: Date
          value: Mon, 22 Dec 2025 10:28:56 GMT
        - name: Content-Type
          value: application/json; version=1
        - name: Content-Length
          value: "21"
        - name: Connection
          value: keep-alive
        - name: Access-Control-Allow-Credentials
          value: "true"
        - name: Access-Control-Allow-Origin
          value: "null"
      body:
        type: json
        data: |-
          [
              "oktopus-base-mqtt"
          ]

