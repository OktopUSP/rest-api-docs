info:
  name: Get Device Labels
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}device/label?id={{device}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
    - name: X-Api-Version
      value: "2"
  params:
    - name: id
      value: "{{device}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Get Device Labels
    request:
      url: "{{base_url}}device/label?id={{device}}"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
      params:
        - name: id
          value: "{{device}}"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; version=1
      body:
        type: json
        data: |-
          [
              {
                  "name": "condominium",
                  "value": "residencial",
                  "children": [
                      {
                          "name": "block",
                          "value": "A",
                          "children": [
                              {
                                  "name": "floor",
                                  "value": "331"
                              }
                          ]
                      }
                  ]
              },
              {
                  "name": "plan",
                  "value": "500 mega"
              },
              {
                  "name": "connection",
                  "value": "timeout"
              }
          ]

docs: |-
  Returns the labels of a device as a JSON array.

  Each label is a `name`:`value` pair. A label can have labels of its own in `children`, forming a tree, e.g. `condominium:residencial > block:A > floor:331`.

  Labels named `connection` are added and removed by Oktopus from the results of the Connection Requests sent to the device: `connection:behind nat or too slow`, `connection:cpe busy`, `connection:auth error`, `connection:route error` and `connection:timeout`. A successful Connection Request removes them.

  Query parameters:

  - `id`: the device serial number.

  Responses:

  - `200`: the labels. A device that never had labels answers an empty body.
  - `404`: `Device not found`.

  Requires the Devices read permission.
