      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: device
      value: ""
      type: path
    - name: mtp
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
          "command": "Device.Reboot()",
          "send_resp": true
      }
  auth: inherit

