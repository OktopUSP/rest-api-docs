http:
  method: PUT
  url: "{{base_url}}device/:device/:mtp/set"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: device
      value: oktopus-0-mqtt
      type: path
    - name: mtp
      value: mqtt
      type: path
  body:
    type: json
    data: |-
      {
          "allow_partial":true,
          "update_objs":[
              {
                  "obj_path":"Device.BulkData.",
                  "param_settings":[
                      {
                      "param":"Enable",
                      "value":"true",
                      "required":true
                      }
                  ]
              }
          ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

