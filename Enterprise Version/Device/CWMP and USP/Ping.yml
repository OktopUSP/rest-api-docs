info:
  name: Ping
  type: http
  seq: 16

http:
  method: GET
  url: "{{base_url}}device/:device/:mtp/ping"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: device
      value: "{{device}}"
      type: path
    - name: mtp
      value: any
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Ping
    request:
      url: "{{base_url}}device/:device/ping"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
      params:
        - name: device
          value: 485754434ECDE6AD
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Origin
        - name: Date
          value: Mon, 01 Jul 2024 00:50:34 GMT
        - name: Content-Length
          value: "208"
      body:
        type: json
        data: |-
          {
              "interface": {
                  "writable": false,
                  "value": ""
              },
              "interface_options": null,
              "timeout": {
                  "writable": true,
                  "value": 10
              },
