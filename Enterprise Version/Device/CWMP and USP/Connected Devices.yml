http:
  method: GET
  url: "{{base_url}}device/:device/:mtp/connecteddevices"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: device
      value: "{{device}}"
      type: path
    - name: mtp
      value: any
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

