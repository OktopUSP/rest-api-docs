info:
  name: Geolocation Refresh
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}/map/{{device}}/refresh"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
