info:
  name: Delete Geolocation
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{base_url}}map/?sn={{device}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: sn
      value: "{{device}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

