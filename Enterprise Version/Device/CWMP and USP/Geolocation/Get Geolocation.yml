info:
  name: Get Geolocation
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}map/{{device}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Get all devices location
    request:
      url: "{{base_url}}/map"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Origin
        - name: Date
          value: Thu, 04 Jul 2024 19:54:52 GMT
        - name: Content-Length
          value: "249"
      body:
        type: json
        data: |-
          [
              {
                  "sn": "485754434ECDE6AD",
                  "img": "https://static.wikia.nocookie.net/looney-tunes/images/6/65/PapaLeguas.gif/revision/latest/thumbnail/width/360/height/360?cb=20151222151137&path-prefix=pt-br",
                  "coordinates": {
                      "lat": -27.6227433,
                      "lng": -48.6755544
                  }
              }
          ]
  - name: Get device geolocation
    request:
      url: "{{base_url}}/map/{{device}}"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Origin
        - name: Date
          value: Fri, 04 Oct 2024 00:23:57 GMT
        - name: Content-Length
          value: "108"
      body:
        type: json
        data: |-
          {
              "sn": "485754434ECDE6AD",
              "img": "/images/EG8145X6-10.png",
              "coordinates": {
                  "lat": -27.622759,
                  "lng": -48.6755455
              }
          }
