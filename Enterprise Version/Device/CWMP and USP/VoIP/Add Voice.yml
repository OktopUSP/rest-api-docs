info:
  name: Add Voice
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}device/:device/:mtp/voice"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: device
      value: "{{device}}"
      type: path
    - name: mtp
      value: any
      type: path
  body:
    type: json
    data: |-
      {
          "domain": {
              "value": "tommyhilfiger"
          },
          "proxy_server":{
              "value": "1.1.1.1"
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Invalid Arguments
    request:
      url: "{{base_url}}device/:device/:mtp/voice"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
      params:
        - name: device
          value: "{{device}}"
          type: path
        - name: mtp
          value: any
          type: path
      body:
        type: json
        data: |-
          {
              "domain": {
                  "value": "tommyhilfiger"
              },
              "proxy_server":{
                  "value": "1.1.1.1"
              }
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Server
          value: nginx/1.24.0 (Ubuntu)
        - name: Date
          value: Tue, 23 Sep 2025 12:38:12 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "38"
        - name: Connection
          value: keep-alive
        - name: Vary
          value: Origin
      body:
        type: json
        data: '"CWMP Fault: 9003 - Invalid Arguments"'
  - name: Add Voice
    request:
      url: "{{base_url}}device/:device/:mtp/voice"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
      params:
        - name: device
          value: "{{device}}"
          type: path
        - name: mtp
          value: any
          type: path
      body:
        type: json
        data: |-
          {
              "domain": {
                  "value": "tommyhilfiger"
              },
              "proxy_server":{
                  "value": "1.1.1.1"
              }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.24.0 (Ubuntu)
        - name: Date
          value: Tue, 23 Sep 2025 12:47:40 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
