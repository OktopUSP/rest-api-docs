docs: |-
  Asks the device to download and install the firmware image at `Url`.

  ## TR-069 (CWMP) responses

  The ACS sends a `Download` RPC (file type `1 Firmware Upgrade Image`), and the response depends on the device's `DownloadResponse`:

  | Status | Body | Meaning |
  |---|---|---|
  | `204 No Content` | empty | The device accepted the download but has not installed it yet (`DownloadResponse` status `1`). It downloads the image, installs it, reboots, and then reports the result in a `TransferComplete`. **A 204 does not mean the firmware was installed**: check the device's software version after it reconnects. |
  | `200 OK` | `"Firmware update successfully done"` | The device reports that it already installed the firmware (`DownloadResponse` status `0`). |
  | `202 Accepted` | message | The device did not open a CWMP session in time, so the request waits in the queue until the device's next Inform. |
  | `405 Method Not Allowed` | `"firmware upgrade not supported"` | The device model does not support firmware upgrades. |
  | `500 Internal Server Error` | `"Error code: <code>, message: <text>"` | The device rejected the `Download` with a CWMP fault. |

  Mass firmware updates wait for the `TransferComplete` and mark each device as successful or failed based on its fault code.

  ## USP responses

  `200 OK` with the device's `Operate` response.
