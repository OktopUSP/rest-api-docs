  url: "{{base_url}}device/:device/:mtp/fw_update"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
    - name: X-Api-Version
      value: "2"
  params:
    - name: device
      value: "{{device}}"
      type: path
    - name: mtp
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
          "Url": "http://192.168.4.225:8004/logo.png"
      }
  auth: inherit

