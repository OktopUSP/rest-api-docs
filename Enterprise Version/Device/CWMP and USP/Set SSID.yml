          value: "{{authToken}}"
      params:
        - name: device
          value: os::0000CA-29G412666500039
          type: path
        - name: mtp
          value: ""
          type: path
      body:
        type: json
        data: |-
          [
              {
                  "path": "Device.WiFi.SSID.1.",
                  "enable": {
                      "value": "false"
