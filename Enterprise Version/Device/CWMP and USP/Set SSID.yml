info:
  name: Set SSID
  type: http
  seq: 8

http:
  method: PUT
  url: "{{base_url}}device/:device/:mtp/ssid"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: device
      value: "{{device}}"
      type: path
    - name: mtp
      value: ""
      type: path
  body:
    type: json
    data: |-
      [
          {
              "ssid_path": "Device.WiFi.SSID.1.",
              "ssid": {
                  "value": "OKTOPUS_TEST_1"
              }
          }
      ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
