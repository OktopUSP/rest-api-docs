info:
  name: Delete Port
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{base_url}}device/:device/:mtp/ports"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
    - name: X-Api-Version
      value: "2"
  params:
    - name: port
      value: "123456"
      type: query
      disabled: true
    - name: device
      value: "{{device}}"
      type: path
    - name: mtp
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
          "path": "InternetGatewayDevice.WANDevice.1.WANConnectionDevice.2.WANPPPConnection.1."
      }
  auth: inherit

docs: |-
  Deletes a WAN connection. `path` must be a logical WAN object the device reports in **Get Ports**, such as a TR-098 `WANConnectionDevice` connection or a TR-181 `Device.IP.Interface` under an upstream port.

  ## Permission

  `WAN: delete`.

  ## Errors

  | Status | When |
  |---|---|
  | `403` | The role lacks `WAN: delete`, or `path` is a physical port or LAN configuration. |
  | `409` | The device does not report `path` among its ports. Refresh the ports and retry. |
  | `503` | The controller could not read the device's ports to check the request. |

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Delete Port
    request:
      url: "{{base_url}}device/:device/:mtp/ports"
      method: DELETE
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
      params:
        - name: port
          value: "123456"
          type: query
          disabled: true
        - name: device
          value: "{{device}}"
          type: path
        - name: mtp
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
              "path": "InternetGatewayDevice.WANDevice.1.WANConnectionDevice.2.WANPPPConnection.1."
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.18.0 (Ubuntu)
        - name: Date
          value: Mon, 21 Oct 2024 20:35:34 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "14"
        - name: Connection
          value: keep-alive
        - name: Vary
          value: Origin
      body:
        type: json
        data: '"Port deleted"'
