docs:
  content: |-
    Physical interfaces and their logical WAN and LAN configuration.

    Three role permissions split this domain: `Ports` covers the physical interfaces, `WAN` the WAN connections (IP, PPPoE, VLAN, DNS) and `LAN` the LAN configuration, including **Get Bridge** and **Set Bridge**. Fiber (`PON`) and xDSL (`xDSL`) keep their own permissions.
  type: text/markdown
