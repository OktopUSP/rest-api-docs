      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: device
      value: "{{device}}"
      type: path
    - name: mtp
      value: ""
      type: path
  body:
    type: json
    data: |-
      [
          {
              "path": "Device.WiFi.Radio.2.",
              "operating_standards":{
                  "value": "a,n"
              }
          }
      ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

