info:
  name: Set NTP
  type: http
  seq: 32

http:
  method: PUT
  url: "{{base_url}}device/:device/:mtp/ntp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: device
      value: "{{device}}"
      type: path
    - name: mtp
      value: any
      type: path
  body:
    type: json
    data: |-
      [
          {
              "path": "Device.Time.NTPServer2",
              "server":{
                  "value": "pool.ntp.org"
              }
          }
      ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Invalid arguments
    request:
      url: "{{base_url}}device/:device/:mtp/ntp"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
      params:
        - name: device
          value: "{{device}}"
          type: path
        - name: mtp
          value: any
          type: path
      body:
        type: json
        data: |-
          [
              {
                  "path": "Device.Time.NTPServer2",
                  "server":{
                      "value": "pool.ntp.org"
                  }
              }
          ]
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Server
          value: nginx/1.24.0 (Ubuntu)
        - name: Date
          value: Sat, 27 Sep 2025 15:53:45 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "38"
        - name: Connection
          value: keep-alive
        - name: Vary
          value: Origin
      body:
        type: json
        data: '"CWMP Fault: 9003 - Invalid Arguments"'
