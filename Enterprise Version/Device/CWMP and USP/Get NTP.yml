info:
  name: Get NTP
  type: http
  seq: 31

http:
  method: GET
  url: "{{base_url}}device/:device/:mtp/ntp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: device
      value: "{{device}}"
      type: path
    - name: mtp
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Get NTP
    request:
      url: "{{base_url}}device/:device/:mtp/ntp"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
      params:
        - name: device
          value: "{{device}}"
          type: path
        - name: mtp
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.24.0 (Ubuntu)
        - name: Date
          value: Sat, 27 Sep 2025 14:43:32 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "177"
        - name: Connection
          value: keep-alive
        - name: Vary
          value: Origin
      body:
        type: json
        data: |-
          [
              {
                  "path": "Device.Time.NTPServer2",
                  "server": {
                      "writable": true,
                      "value": "clock.nyc.he.net"
                  }
              },
              {
                  "path": "Device.Time.NTPServer1",
                  "server": {
                      "writable": true,
                      "value": "clock.fmt.he.net"
                  }
              }
          ]
