info:
  name: Cache Refresh
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}device/:device/:mtp/cache/refresh"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: device
      value: "{{device}}"
      type: path
    - name: mtp
      value: any
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Cache Refresh
    request:
      url: "{{base_url}}device/:device/:mtp/cache/refresh"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
      params:
        - name: device
          value: "{{device}}"
          type: path
        - name: mtp
          value: any
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.24.0 (Ubuntu)
        - name: Date
          value: Tue, 23 Sep 2025 18:27:08 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "30"
        - name: Connection
          value: keep-alive
        - name: Vary
          value: Origin
      body:
        type: json
        data: '"Cache refreshed successfully"'
