info:
  name: Get xDSL
  type: http
  seq: 33

http:
  method: GET
  url: "{{base_url}}device/:device/:mtp/xdsl"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: device
      value: "{{device}}"
      type: path
    - name: mtp
      value: any
      type: path
  auth: inherit

settings:
