info:
  name: Model Capabilities
  type: http
  seq: 18

http:
  method: GET
  url: "{{base_url}}device/capabilities?model=EG8145X6-10a&sn={{device}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: model
      value: EG8145X6-10a
      type: query
    - name: sn
      value: "{{device}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

