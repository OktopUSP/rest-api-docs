info:
  name: Set Cellular
  type: http
  seq: 30

http:
  method: PUT
  url: "{{base_url}}device/:device/:mtp/cellular"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: device
      value: "{{device}}"
      type: path
    - name: mtp
      value: any
      type: path
  body:
    type: json
    data: |-
      {
          "path": "Device.Cellular.Interface.1.",
          "current_access_technology":{
              "value": "NR"
          },
          "access_point":[
              {
                  "path":"Device.X_Aethra_AccessPoint.AccessPoint.3.",
                  "default_activation": {
                      "value": true
                  }
              }
          ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Set Cellular
    request:
      url: "{{base_url}}device/:device/:mtp/cellular"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
