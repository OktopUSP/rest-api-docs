info:
  name: Set NAT
  type: http
  seq: 6

http:
  method: PUT
  url: "{{base_url}}device/:device/:mtp/nat"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: device
      value: "{{device}}"
      type: path
    - name: mtp
      value: any
      type: path
  body:
    type: json
    data: |-
      {
          "upnp": {
              "enable": false
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
