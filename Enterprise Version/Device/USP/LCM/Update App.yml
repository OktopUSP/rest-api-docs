      params:
        - name: device
          value: "{{device}}"
          type: path
        - name: mtp
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
              "execution_unit": "Device.SoftwareModules.ExecutionUnit.1.",
              "status": "cvbvcbc"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Origin
        - name: Date
          value: Mon, 04 Nov 2024 13:16:01 GMT
        - name: Content-Length
          value: "252"
      body:
        type: json
        data: |-
          {
              "executed_command": "Device.SoftwareModules.ExecutionUnit.1.SetRequestedState()",
