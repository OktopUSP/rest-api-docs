info:
  name: Set QoS
  type: http
  seq: 3

http:
  method: PUT
  url: "{{base_url}}device/:device/:mtp/qos"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: device
      value: "{{device}}"
      type: path
    - name: mtp
      value: any
      type: path
  body:
    type: json
    data: |-
      {
          "enable": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Set QoS
    request:
      url: "{{base_url}}device/:device/:mtp/qos"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
      params:
        - name: device
          value: "{{device}}"
          type: path
        - name: mtp
          value: any
          type: path
      body:
        type: json
        data: |-
          {
              "enable": true
          }
    response:
      status: 200
      statusText: OK
