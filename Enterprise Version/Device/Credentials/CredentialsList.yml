info:
  name: CredentialsList
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}device/auth?page_size=100&page_number=1"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: id
      value: oktopus
      type: query
      disabled: true
    - name: page_size
      value: "100"
      type: query
    - name: page_number
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
