docs: |-
  **API version 1 (default, requests without `X-Api-Version`).** Lists the devices of your organization, or returns one with `id`, in the format used before devices on TR-069 and TR-369 were unified. For the current format, one entry per device with both connections, see **Get Device(s) (API v2)**.

  | Version 1 | |
  |---|---|
  | Rows | One per protocol: a CPE on both TR-069 and TR-369 is **two rows**, the TR-069 row keyed by the serial number and the TR-369 row keyed by the Agent Endpoint ID, each with the status of its own connection |
  | `SN` of a TR-369 row | Agent Endpoint ID (`os::...`); the serial number is in `sn_v2` |
  | `id` | Returns the row the identifier designates: the TR-369 row for an Endpoint ID, the TR-069 row for a serial number |
  | `protocol` filter | `tr069` or `tr369`; anything else returns `400` |

  `total` and `pages` count devices, so a page with dual-stack devices carries a few more rows than devices (in the **List Devices** example, 3 devices are 4 rows).

  ## Query parameters

  | Parameter | Description |
  |---|---|
  | `id` | One device by serial number, `sn_v2` or Agent Endpoint ID |
  | `page_number`, `page_size` | Page, starting at `0`; size from `1` to `100` (default `20`) |
  | `sn` | Exact serial number or Agent Endpoint ID |
  | `sn_v2` | Exact serial number reported by the device |
  | `vendor`, `model`, `version`, `type` (product class), `alias`, `datamodel`, `ip`, `connection_ip`, `pppoe_user`, `wan_mac`, `label` | Property filters |
  | `status` | `0` offline, `1` associating, `2` online, `3` unknown. With `protocol`, the status of **that protocol's connection** (`protocol=tr369&status=2` = TR-369 online) |
  | `protocol` | `tr069` (known to the ACS) or `tr369` (known over USP) |
  | `statusOrder` (`asc` \| `desc`), `lastSeenOrder` (`1` \| `-1`), `uptime` (`1` \| `-1`) | Sorting |
  | `csv=true` | Returns the page as CSV (`pagination=false` for every matching device). The CSV is the same on both API versions: one row per device, `SN` = serial number, `Agent Endpoint ID` = Endpoint ID, `Protocol` = `TR-069` \| `TR-369` \| `Dual-stack` |

  `404` `"No devices found"` when nothing matches.
