docs: |-
  Lists the devices of your organization, one page at a time, or returns one device with `id`.

  The shape of the devices depends on the API version (see the **Enterprise Version** and **Device** folders):

  | | Version 1 (default, no header) | Version 2 (`X-Api-Version: 2`) |
  |---|---|---|
  | Rows | One per protocol, as before devices were unified: a dual-stack CPE is **two rows** (TR-069 row keyed by the serial number, TR-369 row keyed by the Endpoint ID), each with the status of its own connection | One per device |
  | `SN` of a TR-369 device | Agent Endpoint ID (`os::...`); the serial number is in `sn_v2` | Serial number; the Endpoint ID is in `usp_endpoint_id` |
  | Extra fields | — | `usp_endpoint_id`, `protocol` (`tr069` \| `tr369` \| `dual-stack`), `connections` (status, last seen, adapter and Endpoint ID per protocol), `LastSeen` in each `Bridge` / `Cwmp` link |
  | `protocol` filter | `tr069`, `tr369` | `tr069`, `tr369`, `dual-stack` |
  | `id` | Returns the row the identifier designates (the TR-369 row for an Endpoint ID) | Returns the device |

  On a v1 page, `total` and `pages` count devices, so a page with dual-stack devices carries a few more rows than devices.

  ## Query parameters

  | Parameter | Description |
  |---|---|
  | `id` | One device by serial number, `sn_v2` or Agent Endpoint ID |
  | `page_number`, `page_size` | Page, starting at `0`; size from `1` to `100` (default `20`) |
  | `sn` | Exact serial number or Agent Endpoint ID |
  | `sn_v2` | Exact serial number reported by the device |
  | `vendor`, `model`, `version`, `type` (product class), `alias`, `datamodel`, `ip`, `connection_ip`, `pppoe_user`, `wan_mac`, `label` | Property filters |
  | `status` | `0` offline, `1` associating, `2` online, `3` unknown. With `protocol`, the status of **that protocol's connection** (`protocol=tr369&status=2` = TR-369 online), on both versions |
  | `protocol` | `tr069` (known to the ACS), `tr369` (known over USP), `dual-stack` (both, v2 only) |
  | `statusOrder` (`asc` \| `desc`), `lastSeenOrder` (`1` \| `-1`), `uptime` (`1` \| `-1`) | Sorting |
  | `csv=true` | Returns the page as CSV (`pagination=false` for every matching device). The CSV has one row per device on both versions: `SN` = serial number, `Agent Endpoint ID` = Endpoint ID, `Protocol` = `TR-069` \| `TR-369` \| `Dual-stack` |

  `404` `"No devices found"` when nothing matches.
