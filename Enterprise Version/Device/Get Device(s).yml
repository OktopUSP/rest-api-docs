info:
  name: Get Device(s)
  type: http
  seq: 10

http:
  method: GET
  url: "{{base_url}}device?page_number=0&page_size=20&vendor=&version&alias=&statusOrder=desc&type=&model&uptime=-1"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
    - name: X-Api-Version
      value: "2"
      disabled: true
  params:
    - name: id
      value: "{{device}}"
      type: query
      disabled: true
    - name: page_number
      value: "0"
      type: query
    - name: page_size
      value: "20"
      type: query
    - name: vendor
      value: ""
      type: query
    - name: version
      value: ""
      type: query
    - name: alias
      value: ""
      type: query
    - name: statusOrder
      value: desc
      type: query
    - name: type
      value: ""
      type: query
    - name: status
      value: "2"
      type: query
      disabled: true
    - name: model
      value: ""
      type: query
    - name: uptime
      value: "-1"
      type: query
    - name: protocol
      value: dual-stack
      type: query
      disabled: true
    - name: sn
      value: "{{device}}"
      type: query
      disabled: true
    - name: sn_v2
      value: ""
      type: query
      disabled: true
    - name: csv
      value: "true"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

