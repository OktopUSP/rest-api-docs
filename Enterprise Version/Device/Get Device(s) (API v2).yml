docs: |-
  **API version 2 — send `X-Api-Version: 2`** (or `Accept: application/json; version=2`). Lists the devices of your organization, or returns one with `id`, with **one entry per device**: a CPE connected over TR-069 and TR-369 is a single device carrying both connections. This is the format the Oktopus web interface uses. Requests without a version get **Get Device(s)** (version 1).

  | Field | Description |
  |---|---|
  | `SN` | Device key: the serial number (the one the ACS knows the CPE by) |
  | `sn_v2` | Serial number reported by the device |
  | `usp_endpoint_id` | USP Agent Endpoint ID, empty for a TR-069-only device |
  | `protocol` | `tr069`, `tr369` or `dual-stack` |
  | `Status` | The device as a whole: `2` (online) when at least one connection is online |
  | `Cwmp`, `Bridge` | TR-069 and TR-369 links, each with its own `Status` and `LastSeen`; `Cwmp` is `[]` for a device known to the ACS with no link right now |
  | `connections` | One entry per protocol: `protocol` (`tr069` \| `tr369`), `mtp`, `adapter`, `status`, `last_seen`, `datamodel` and, for TR-369, `endpoint_id` |

  `id` accepts the serial number, `sn_v2` or the Agent Endpoint ID and always returns the same device. See the examples **Dual-stack Device, Both Connections Online** and **Dual-stack Device, TR-069 Offline**: the device stays online while one of its connections is.

  ## Query parameters

  | Parameter | Description |
  |---|---|
  | `id` | One device by serial number, `sn_v2` or Agent Endpoint ID |
  | `page_number`, `page_size` | Page, starting at `0`; size from `1` to `100` (default `20`) |
  | `sn` | Exact serial number or Agent Endpoint ID |
  | `sn_v2` | Exact serial number reported by the device |
  | `vendor`, `model`, `version`, `type` (product class), `alias`, `datamodel`, `ip`, `connection_ip`, `pppoe_user`, `wan_mac`, `label` | Property filters |
  | `status` | `0` offline, `1` associating, `2` online, `3` unknown. With `protocol`, the status of **that protocol's connection** (`protocol=tr369&status=2` = TR-369 online) |
  | `protocol` | `tr069` (known to the ACS), `tr369` (known over USP) or `dual-stack` (both) |
  | `statusOrder` (`asc` \| `desc`), `lastSeenOrder` (`1` \| `-1`), `uptime` (`1` \| `-1`) | Sorting |
  | `csv=true` | Returns the page as CSV (`pagination=false` for every matching device). The CSV is the same on both API versions: one row per device, `SN` = serial number, `Agent Endpoint ID` = Endpoint ID, `Protocol` = `TR-069` \| `TR-369` \| `Dual-stack` |

  `404` `"No devices found"` when nothing matches.
