info:
  name: Get Device(s) (API v2)
  type: http
  seq: 11

http:
  method: GET
  url: "{{base_url}}device?page_number=0&page_size=20&statusOrder=desc"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
    - name: X-Api-Version
      value: "2"
  params:
    - name: id
      value: "{{device}}"
      type: query
      disabled: true
    - name: page_number
      value: "0"
      type: query
    - name: page_size
      value: "20"
      type: query
    - name: statusOrder
      value: desc
      type: query
    - name: status
      value: "2"
      type: query
      disabled: true
    - name: protocol
      value: dual-stack
      type: query
      disabled: true
    - name: vendor
      value: ""
      type: query
      disabled: true
    - name: model
      value: ""
      type: query
      disabled: true
    - name: version
      value: ""
      type: query
      disabled: true
    - name: alias
      value: ""
      type: query
      disabled: true
    - name: sn
      value: "{{device}}"
      type: query
      disabled: true
    - name: sn_v2
      value: ""
      type: query
      disabled: true
    - name: csv
      value: "true"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

