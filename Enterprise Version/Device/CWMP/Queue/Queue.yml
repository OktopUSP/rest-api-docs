info:
  name: Queue
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}device/cwmp/:device/queue"
  headers:
    - name: Content-Type
      value: application/xml
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: device
      value: "{{device}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

