info:
  name: How To Connect a Device
  type: http
  seq: 14

http:
  method: GET
  url: "{{base_url}}device/how-to-connect-device"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: How to Connect a Device
    request:
      url: "{{base_url}}device/how-to-connect-device"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.24.0 (Ubuntu)
        - name: Date
          value: Thu, 20 Nov 2025 19:09:17 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "636"
        - name: Connection
          value: keep-alive
        - name: Vary
          value: Origin
      body:
        type: json
        data: |-
          {
              "cwmp_config": {
                  "tls_endpoint": "https://dsa.oktopus.app.br:9293/acs",
                  "non_tls_endpoint": "http://dsa.oktopus.app.br:9292/acs",
                  "acs_username": "<device-username>",
                  "acs_password": "<device-password>",
                  "inform_period": 60000000000
              },
              "usp_config": {
                  "controller_endpoint_id": "proto::oktopus",
                  "mqtt_config": {
                      "broker": "dsa.oktopus.app.br",
                      "non_tls_port": 1883,
                      "tls_port": 8883,
                      "username": "<device-username>",
                      "password": "<device-password>",
                      "version": 5,
                      "controller_topic": "oktopus/usp/v1/controller/<agent-endpoint-id>",
                      "agent_topic": "oktopus/usp/v1/agent/<agent-endpoint-id>"
                  }
              }
          }
