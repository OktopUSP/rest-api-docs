info:
  name: RequestDeviceGet
  type: http
  seq: 5

http:
  method: PUT
  url: "{{base_url}}device/:device/:mtp/get"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  params:
    - name: device
      value: "{{device}}"
      type: path
    - name: mtp
      value: any
      type: path
  body:
    type: json
    data: |-
      {
          "param_paths": [
              "Device.LocalAgent."
          ],
          "max_depth": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
