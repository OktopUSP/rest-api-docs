info:
  name: ChangeOwnPassword
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}auth/password"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  body:
    type: json
    data: |-
      {
          "password":"teste123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
