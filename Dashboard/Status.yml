info:
  name: Status
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}info/status"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Status
    request:
      url: "{{base_url}}info/status"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: "{{authToken}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Origin
        - name: Date
          value: Wed, 01 Nov 2023 04:04:46 GMT
        - name: Content-Length
          value: "25"
      body:
        type: json
        data: |-
          {
              "Online": 2,
              "Offline": 2
          }

