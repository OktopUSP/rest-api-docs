info:
  name: Vendors
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/info/vendors"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
